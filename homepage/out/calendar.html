<script>
(function() {
  window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'doe-calendar-height') return;
    if (!/^https:\/\/gateway\.maine\.gov/.test(e.origin)) return;
    var h = parseInt(e.data.height, 10);
    if (!h || h < 200 || h > 100000) return;
    document.querySelectorAll('iframe[src*="gateway.maine.gov/doe/communications/calendar"]').forEach(function(f) {
      f.style.height = h + 'px';
      f.style.minHeight = '0';
    });
  });
})();
</script>
<p><iframe allow="fullscreen" loading="lazy" src="https://gateway.maine.gov/doe/communications/calendar/" style="width:100%;height:800px;border:0;display:block;" title="Maine DOE Events Calendar"></iframe></p>

<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<title>DOE Events Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&display=swap">

<style>
  :root {
    --warm-white: #eee6df;
    --warm-white-2: #eef2f6;
    --warm-white-3: #c9d3dc;
    --navy: #182b3c;
    --navy-2: #274f73;
    --navy-3: #3d5a7a;
    --steel: #6d8ba6;
    --steel-soft: #a8bccb;
    --teal: #42c3f7;
    --teal-ink: #0d7ba0;
    --teal-tint: #d5f0fb;
    --rust: #8a2e13;
    --rust-tint: #f0d9d0;
    --mint-ink: #3f7f5e;
    --mint-tint: #d5ecdd;
    --mid-tint: #d5dfe9;
    --ink: var(--navy);
    --ink-2: #33475a;
    --ink-3: var(--steel);
    --ground: var(--warm-white);
    --panel: #ffffff;
    --panel-2: #eef2f6;
    --rule: rgba(24, 43, 60, 0.13);
    --rule-strong: rgba(24, 43, 60, 0.22);
    --font-display: 'League Spartan', 'Century Gothic', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-body: 'Calibri', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --pad: clamp(20px, 4vw, 56px);
    --maxw: 1180px;
  }
  /* Dark-mode + custom-theme overrides intentionally disabled — the calendar
     is embedded on public maine.gov pages and needs the same navy/beige
     look regardless of the viewer's OS setting. Users on dark mode were
     seeing beige-on-beige illegible cards (some hardcoded #1e2f42 text
     colors weren't participating in the theme swap). Forcing light mode
     via <meta name="color-scheme" content="light"> + skipping these
     overrides gives everyone the intended design. */

  html, body { margin: 0; padding: 0; }
  body { background: transparent; color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button { cursor: pointer; }

  /* ─── Portal chrome ─────────────────────────────────── */
  /* Accessibility utilities */
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .skip-link { position: absolute; left: 8px; top: -40px; padding: 8px 14px; background: var(--navy); color: var(--warm-white); text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; border-radius: 4px; z-index: 200; transition: top 0.15s; }
  .skip-link:focus { top: 8px; outline: 2px solid var(--teal); outline-offset: 2px; }
  /* Focus indicators (WCAG 2.4.7) */
  a:focus-visible, button:focus-visible, [role="button"]:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 4px; }
  .card:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
  .doe-bar { background: var(--navy); color: #eee6df; padding: 10px var(--pad); font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; gap: 24px; }
  .doe-bar .crumbs { opacity: 0.65; font-weight: 500; font-size: 12px; }
  .doe-bar .crumbs strong { color: #eee6df; opacity: 1; font-weight: 700; }
  .container { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--pad); }
  /* Embed mode — used when the calendar is loaded in an iframe.
     Two variants:
       ?embed=1     → hide just the page heading + skip link. Filters and the
                       full 3-col grid stay. Use this to drop the full
                       calendar into a maine.gov page that already has its
                       own title (e.g., the public /doe/calendar page).
       ?carousel=1 → additionally converts the card grid into a compact
                       horizontal carousel and hides the filter bar. Use
                       this for narrow team-specific widgets. */
  html.embed-mode .hero-compact,
  html.embed-mode .skip-link { display: none !important; }
  html.embed-mode .container { padding-top: 0 !important; }
  /* Carousel-only chrome hiding */
  html.carousel-mode .filter-bar,
  html.carousel-mode #program-filter-banner { display: none !important; }
  html.carousel-mode .container { padding: 0 !important; max-width: none; }
  html.carousel-mode #events-container { position: relative; padding: 8px 4px 16px; }
  /* Carousel layout — horizontal scrolling row of fixed-width cards */
  html.carousel-mode .card-grid {
    display: flex !important;
    flex-wrap: nowrap !important;
    gap: 16px !important;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    padding: 4px 40px 8px !important;
    scrollbar-width: thin;
  }
  html.carousel-mode .card-grid::-webkit-scrollbar { height: 8px; }
  html.carousel-mode .card-grid::-webkit-scrollbar-thumb { background: rgba(24,43,60,0.2); border-radius: 4px; }
  html.carousel-mode .card-grid > .card {
    min-width: 300px;
    max-width: 300px;
    flex: 0 0 300px;
    scroll-snap-align: start;
    margin-bottom: 0;
  }
  /* Trim card internals so the whole card fits comfortably in a ~460px iframe */
  html.carousel-mode .card .card-inner { padding: 14px 16px 14px !important; }
  html.carousel-mode .card .card-title { font-size: 15px !important; line-height: 1.25 !important; margin: 6px 0 8px !important; -webkit-line-clamp: 2; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
  html.carousel-mode .card .card-desc { font-size: 12px !important; line-height: 1.45 !important; -webkit-line-clamp: 3; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; margin: 6px 0 !important; }
  html.carousel-mode .card .card-hr { margin: 6px 0 !important; }
  html.carousel-mode .card .card-chips { gap: 6px !important; }
  html.carousel-mode .card .card-banner { padding: 10px 14px !important; }
  html.carousel-mode .card .focus-strip { padding: 5px 14px !important; font-size: 10.5px !important; }
  html.carousel-mode .card .card-foot { margin-top: 8px !important; }
  /* Prev/next arrow buttons — injected by JS when in embed mode */
  html.carousel-mode .carousel-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--card, #fff);
    border: 1.5px solid var(--rule, #d9d3ca);
    color: var(--ink, #182b3c);
    box-shadow: 0 6px 16px rgba(24,43,60,0.12);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  }
  html.carousel-mode .carousel-arrow:hover {
    background: var(--warm-white, #eee6df);
    transform: translateY(-50%) scale(1.06);
  }
  html.carousel-mode .carousel-arrow:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: translateY(-50%);
  }
  html.carousel-mode .carousel-arrow.prev { left: 6px; }
  html.carousel-mode .carousel-arrow.next { right: 6px; }
  html.carousel-mode .carousel-arrow svg { width: 18px; height: 18px; }
  /* When no events, keep the empty state readable */
  html.carousel-mode .empty { padding: 40px 20px; }
  @media (max-width: 480px) {
    html.carousel-mode .card-grid { padding: 4px 12px 8px !important; }
    html.carousel-mode .card-grid > .card { min-width: 280px; max-width: 280px; flex-basis: 280px; }
    html.carousel-mode .carousel-arrow { display: none; }
  }

  /* ─── Hero ─────────────────────────────────────────── */
  .hero { padding: clamp(48px, 8vw, 104px) 0 clamp(32px, 5vw, 56px); border-bottom: 1px solid var(--rule); }
  .hero .eyebrow { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--teal-ink); margin: 0 0 20px; }
  .hero h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(56px, 11vw, 156px); line-height: 0.85; letter-spacing: -0.03em; color: var(--ink); margin: 0; text-wrap: balance; }
  .hero h1 .amp { font-weight: 400; font-style: italic; color: var(--steel); font-size: 0.75em; padding: 0 0.08em; }
  .hero .lede { font-size: clamp(17px, 1.6vw, 21px); line-height: 1.5; color: var(--ink-2); max-width: 620px; margin: 32px 0 0; }
  .hero .stats { display: flex; gap: 48px; margin-top: 44px; flex-wrap: wrap; }
  .hero .stats .stat .num { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .hero .stats .stat .lbl { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-top: 8px; }

  /* ─── Filter bar ───────────────────────────────────── */
  .filter-bar { padding: 32px 0 28px; border-bottom: 1px solid var(--rule); }
  .filter-bar .label { font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 12px; }
  .filter-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 24px; align-items: flex-start; }
  @media (max-width: 900px) { .filter-row { grid-template-columns: 1fr; } }
  .filter-cell { min-width: 0; }

  .filter-search { margin-bottom: 20px; }
  .search-wrap { position: relative; }
  .search-input {
    width: 100%;
    padding: 14px 48px 14px 48px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--panel);
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--ink);
    -webkit-appearance: none;
    appearance: none;
    line-height: 1.3;
    transition: all 0.15s;
  }
  .search-input::placeholder { color: var(--ink-3); font-family: var(--font-body); }
  .search-input:hover { border-color: var(--steel); }
  .search-input:focus { outline: 2px solid var(--teal); outline-offset: 2px; border-color: var(--teal); }
  .search-input::-webkit-search-cancel-button { display: none; }
  .search-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: var(--ink-3);
    stroke-width: 1.8;
    fill: none;
    pointer-events: none;
  }
  .search-clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 28px;
    border: 0;
    background: transparent;
    color: var(--ink-3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
  }
  .search-clear:hover { background: var(--warm-white-2); color: var(--ink); }
  .search-clear svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 100px; font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.02em; background: transparent; color: var(--ink-2); border: 1px solid var(--rule); transition: all 0.15s; }
  .chip:hover { border-color: var(--steel); color: var(--ink); }
  .chip.active { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: 0.9; }
  .chip.active .dot { background: var(--ground); }
  .cat-learning-chip { color: var(--teal-ink); border-color: color-mix(in srgb, var(--teal-ink) 30%, transparent); }
  .cat-convening-chip { color: var(--navy-2); border-color: color-mix(in srgb, var(--navy-2) 40%, transparent); }
  .cat-public-chip { color: var(--rust); border-color: color-mix(in srgb, var(--rust) 40%, transparent); }
  .cat-students-chip { color: var(--mint-ink); border-color: color-mix(in srgb, var(--mint-ink) 40%, transparent); }
  .cat-learning-chip.active, .cat-convening-chip.active, .cat-public-chip.active, .cat-students-chip.active { background: currentColor; border-color: currentColor; }
  .cat-learning-chip.active > *, .cat-convening-chip.active > *, .cat-public-chip.active > *, .cat-students-chip.active > * { color: var(--ground); }

  .select-wrap { position: relative; display: block; }
  .select { appearance: none; -webkit-appearance: none; width: 100%; padding: 12px 44px 12px 16px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--ink); cursor: pointer; line-height: 1.3; transition: border-color 0.15s; }
  .select:hover { border-color: var(--steel); }
  .select:focus { outline: 2px solid var(--teal); outline-offset: 2px; border-color: var(--teal); }
  .select-caret { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--ink-3); stroke-width: 2; fill: none; pointer-events: none; }

  .view-toggle { display: inline-flex; border: 1px solid var(--rule); border-radius: 100px; padding: 3px; background: var(--panel); }
  .view-toggle button { all: unset; padding: 7px 18px; border-radius: 100px; font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); cursor: pointer; }
  .view-toggle button.active { background: var(--ink); color: var(--ground); }
  /* Month view needs a wide viewport (7 columns × ~150px min). Hide it
     below 900px so users can't pick a view that clips Fri/Sat and truncates
     event titles down to fragments. Agenda + Cards work at any width. */
  @media (max-width: 899px) {
    .view-toggle button[data-view="month"] { display: none; }
  }

  /* ─── Category tokens ──────────────────────────────── */
  .cat-learning { --cat-color: var(--teal-ink); --cat-tint: var(--teal-tint); }
  .cat-convening { --cat-color: var(--navy-2); --cat-tint: var(--mid-tint); }
  .cat-public { --cat-color: var(--rust); --cat-tint: var(--rust-tint); }
  .cat-students { --cat-color: var(--mint-ink); --cat-tint: var(--mint-tint); }

  /* ─── Date chip (top of card) ──────────────────────── */
  .dt-chip {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    padding: 8px 14px;
    background: var(--navy);
    color: var(--warm-white);
    border-radius: 6px;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    align-self: flex-start;
  }
  .dt-chip .wd {
    font-weight: 600;
    font-size: 11px;
    opacity: 0.65;
    letter-spacing: 0.14em;
    padding-left: 4px;
    border-left: 1px solid rgba(238,230,223,0.25);
    margin-left: 4px;
  }
  .card-time {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  .card-time svg { width: 14px; height: 14px; stroke: var(--ink-3); stroke-width: 1.8; fill: none; }
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* ─── Chips: focus area + type ─────────────────────── */
  .card-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .info-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 6px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    line-height: 1;
  }
  .type-chip {
    background: var(--cat-tint, var(--mid-tint));
    color: var(--cat-color, var(--navy-2));
  }
  .type-chip svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; fill: none; }

  .badge-hours {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 6px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    line-height: 1;
    background: var(--warm-white-2);
    color: var(--navy-2);
    border: 1px solid var(--rule);
  }
  .badge-hours svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; fill: none; }

  .focus-chip {
    background: var(--teal-tint);
    color: var(--navy);
    border: 0;
    padding: 5px 12px;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.1em;
  }
  .focus-chip .dot { display: none; }

  /* Full-length focus strip on cards */
  .focus-strip {
    background: var(--teal-tint);
    color: var(--navy);
    padding: 9px 22px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .focus-strip::before {
    content: '';
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--teal-ink);
    flex-shrink: 0;
  }

  /* ─── Card ─────────────────────────────────────────── */
  .card {
    background: #f5eee5;
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 0;
    display: flex;
    flex-direction: column;
    transition: all 0.18s;
    position: relative;
    overflow: hidden;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(24, 43, 60, 0.04);
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--rule-strong);
    box-shadow: 0 16px 40px -16px rgba(24, 43, 60, 0.25);
  }
  .card:hover .card-title { color: var(--cat-color); }
  .card-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 20px;
    background: var(--navy);
    color: var(--warm-white);
    font-family: var(--font-display);
    transition: all 0.18s;
    flex-wrap: wrap;
    position: relative;
  }
  .card-banner .b-date {
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--warm-white);
  }
  .card-banner .b-date .pipe {
    display: inline-block;
    opacity: 0.55;
    font-weight: 300;
    padding: 0 8px;
    color: var(--steel-soft);
    transform: translateY(-1px);
    font-size: 16px;
  }
  .card-banner .b-date .wd {
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: rgba(255, 255, 255, 0.7);
  }
  .card-banner .b-time {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--warm-white);
    line-height: 1;
  }
  .card-banner .b-time svg {
    width: 13px; height: 13px;
    stroke: var(--teal);
    stroke-width: 2;
    fill: none;
    display: block;
    flex-shrink: 0;
  }

  .card-inner {
    padding: 20px 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }
  .card-inner .card-chips { margin-top: -4px; }
  .card-inner .card-hr {
    border: 0;
    height: 1px;
    background: var(--rule);
    margin: 4px 0 2px;
  }
  .card-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 21px;
    line-height: 1.2;
    color: var(--ink);
    margin: 0;
    letter-spacing: -0.01em;
    text-wrap: balance;
    transition: color 0.15s;
  }
  .card-desc {
    font-size: 14px;
    color: #1e2f42;
    line-height: 1.5;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-family: var(--font-body);
    font-weight: 500;
  }
  .card-foot {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
  }
  .card-foot .btn-cta {
    width: 100%;
    justify-content: center;
    padding: 12px 20px;
  }
  .card-loc {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-family: var(--font-body);
    font-size: 13px;
    color: #1e2f42;
    min-width: 0;
    line-height: 1.4;
  }
  .card-loc svg { width: 14px; height: 14px; stroke: var(--ink); stroke-width: 1.7; fill: none; flex-shrink: 0; margin-top: 2px; }
  .card-loc span {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }

  .title-block {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
  }
  .title-block .card-title { margin: 0; }
  .m-title-block { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; margin-bottom: 14px; }

  /* ─── CTA button (rounded square) ──────────────────── */
  .btn-cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    border-radius: 6px;
    background: var(--navy);
    color: var(--warm-white);
    text-decoration: none;

    <button id="program-filter-clear" type="button" style="background:transparent;border:1.5px solid #42c3f755;color:#0d7ba0;font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;">Show all events</button>
  </div>
  <div id="events-container"></div>
</div>
<div class="modal-scrim" id="modal-scrim" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
// ─── EVENT DATA ────────────────────────────────────────
let EVENTS = [];
const CALENDAR_ENDPOINT = "https://script.google.com/macros/s/AKfycbw98yVhSSYfD2HhJGilZBYYE_dc_R9lY4ZKNxmRRyzHXVvQdVyPkBg_iYXDcAygSkqnTQ/exec?type=calendar";
const CAL_CACHE_KEY = 'doe_calendar_events_v1';

// Rehydrate from sessionStorage on load so the page paints instantly with
// last-known events while the fresh fetch runs. Same pattern used across
// the portal to hide Apps Script cold-start latency.
function hydrateFromCache() {
  try {
    const raw = sessionStorage.getItem(CAL_CACHE_KEY);
    if (!raw) return false;
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr) || !arr.length) return false;
    EVENTS = arr;
    populateFocusSelect();
    populateTypeSelect();
    render();
    return true;
  } catch(e) { return false; }
}

// Retry-once + 25s AbortController timeout — Apps Script cold-start can take
// 5-15s and occasionally hangs. First attempt fast; second gives it room.
async function fetchCalendarJson() {
  const attempt = async () => {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 25000);
    try { const r = await fetch(CALENDAR_ENDPOINT, { cache: 'no-store', signal: ctrl.signal }); return await r.json(); }
    finally { clearTimeout(t); }
  };
  try { return await attempt(); }
  catch(e) {
    await new Promise(r => setTimeout(r, 1200));
    return await attempt();
  }
}

async function loadEvents() {
  const hadCache = hydrateFromCache();
  try {
    const container = document.getElementById('events-container');
    if (container && !hadCache) container.innerHTML = '<div class="empty"><div class="big">Loading events...</div></div>';
    const data = await fetchCalendarJson();
    if (data.error) throw new Error(data.error);
    EVENTS = data.events || [];
    // Persist for next visit so the return trip is instant.
    try { sessionStorage.setItem(CAL_CACHE_KEY, JSON.stringify(EVENTS)); } catch(e){}
    populateFocusSelect();
    populateTypeSelect();
    render();
  } catch (err) {
    // If we hydrated from cache, keep that view — a failed refresh shouldn't
    // wipe events off the screen. Only show the error state on a truly cold visit.
    if (hadCache) { console.warn('[calendar] refresh failed, keeping cached view:', err.message); return; }
    document.getElementById('events-container').innerHTML =
      '<div class="empty"><div class="big">Could not load events</div><div class="sm">' +
      String(err.message || err) + '</div></div>';
  }
}

const CLUSTER_OF = {
  'Webinar': 'learning', 'Training': 'learning', 'Workshop': 'learning', 'Information Session': 'learning',
  'Conference': 'convening', 'Discussion Group': 'convening', 'Office Hours': 'convening',
  'Public Hearing': 'public',
  'Student Opportunity': 'students'
};

// Per-type color — every event type gets its own hue, distinct from the teal topic strip.
const TYPE_COLOR = {
  'Webinar':             { color: '#274f73', tint: '#d5dfe9' },  // Mid Blue
  'Training':            { color: '#8a2e13', tint: '#f0d9d0' },  // Rust
  'Workshop':            { color: '#a86018', tint: '#f4e3cd' },  // Amber
  'Information Session': { color: '#4a6a80', tint: '#dce4ec' },  // Steel Blue
  'Conference':          { color: '#182b3c', tint: '#c9d3dc' },  // Navy
  'Discussion Group':    { color: '#6b3a5a', tint: '#e8dae5' },  // Plum
  'Office Hours':        { color: '#3f7f5e', tint: '#d5ecdd' },  // Sage
  'Public Hearing':      { color: '#a63c1e', tint: '#f5d4c9' },  // Deep Coral
  'Student Opportunity': { color: '#0d7ba0', tint: '#d5f0fb' },
  'Other':              { color: '#5c6a78', tint: '#d5dae0' }   // Deep Teal (used only here since topic strip is teal-tint bg)
};
function typeColor(type) { return TYPE_COLOR[type] || { color: '#274f73', tint: '#d5dfe9' }; }

const ICON_OF = {
  learning: '<svg viewBox="0 0 24 24"><polygon points="9 7 17 12 9 17 9 7" fill="currentColor" stroke="none"/></svg>',
  convening: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M4 20c0-3 3-5 5-5s5 2 5 5"/><path d="M14 20c0-2 2-3 3-3s3 1 3 3"/></svg>',
  public: '<svg viewBox="0 0 24 24"><rect x="9" y="4" width="6" height="10" rx="3"/><path d="M6 12a6 6 0 0 0 12 0"/><path d="M12 18v3"/><path d="M8 21h8"/></svg>',
  students: '<svg viewBox="0 0 24 24"><path d="M2 9l10-4 10 4-10 4L2 9z"/><path d="M6 11v4c0 1.5 2.7 3 6 3s6-1.5 6-3v-4"/><path d="M22 9v6"/></svg>'
};

const CLOCK_SVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';
const PIN_SVG = '<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
const USERS_SVG = '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>';
const USER_SVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>';
const MAIL_SVG = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>';

// Team contact lookup keyed on focus area. Real production contacts get plugged in here.
const CONTACT_BY_FOCUS = {
  'Assessment': { name: 'Assessment Team', email: 'assessment.doe@maine.gov' },
  'Multilingual Learning': { name: 'Multilingual Learning Team', email: 'mll.doe@maine.gov' },
  'Special Services & Inclusive Education': { name: 'Special Services & Inclusive Education', email: 'specialservices.doe@maine.gov' },
  'Federal Programs': { name: 'Federal Programs Team', email: 'federalprograms.doe@maine.gov' },
  'Early Learning': { name: 'Early Learning Team', email: 'earlylearning.doe@maine.gov' },
  'Policy/Rulemaking': { name: 'Office of Policy & Government Affairs', email: 'policy.doe@maine.gov' },
  'Educator Supports': { name: 'Educator Supports Team', email: 'educatorsupports.doe@maine.gov' },
  'School Health': { name: 'School Health Services', email: 'schoolhealth.doe@maine.gov' },
  'Career & Technical Education': { name: 'CTE Office', email: 'cte.doe@maine.gov' },
  'Outdoor Education': { name: 'Outdoor Learning Team', email: 'outdoorlearning.doe@maine.gov' },
  'Data': { name: 'Data & Research Team', email: 'data.doe@maine.gov' },
  'Instructional Supports': { name: 'K-12 Instructional Supports', email: 'instruction.doe@maine.gov' },
  'Attendance & Engagement': { name: 'Attendance & Engagement Team', email: 'attendance.doe@maine.gov' },
  'School Safety': { name: 'School Safety Center', email: 'schoolsafety.doe@maine.gov' },
  'Child Nutrition': { name: 'Child Nutrition Programs', email: 'childnutrition.doe@maine.gov' },
  'Higher Education': { name: 'Higher Education Team', email: 'highered.doe@maine.gov' }
};
function contactFor(e) {
  return { name: e.contactName || '', email: e.contactEmail || '' };
}

// ─── STATE ─────────────────────────────────────────────
const state = { focus: 'all', type: 'all', view: 'cards', search: '', program: 'all' };
// URL params for widget-style embeds. All are optional and combinable.
//   ?program=X    — filter to events with a matching Program / Initiative
//   ?focus=X      — filter to events with a matching Focus Area
//   ?type=X       — filter to a specific Event Type (Webinar, Office Hours, …)
//   ?embed=1      — hide the page heading/skip-link for cleaner iframe embeds
(function readUrlParams(){
  try {
    var sp = new URLSearchParams(window.location.search);
    var p = sp.get('program'); if (p) state.program = decodeURIComponent(p);
    var f = sp.get('focus');   if (f) state.focus   = decodeURIComponent(f);
    var t = sp.get('type');    if (t) state.type    = decodeURIComponent(t);
    if (sp.get('embed') === '1') document.documentElement.classList.add('embed-mode');
    if (sp.get('carousel') === '1') {
      document.documentElement.classList.add('embed-mode', 'carousel-mode');
      state.view = 'cards'; // agenda/month don't work as a carousel
    }
  } catch(e){}
})();

// ─── HELPERS ───────────────────────────────────────────
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WEEKDAYS_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function parseDate(iso) { if(!iso)return new Date(NaN); const [y,m,d] = String(iso).split('-').map(Number); return new Date(y, m-1, d); }
function isValidISO(iso) { return !!iso && !isNaN(parseDate(iso).getTime()); }
function dayShort(iso) { if(!isValidISO(iso))return''; return WEEKDAYS[parseDate(iso).getDay()]||''; }
function dayLong(iso) { if(!isValidISO(iso))return''; return WEEKDAYS_LONG[parseDate(iso).getDay()]||''; }
function monthShort(iso) { if(!isValidISO(iso))return''; return MONTHS[parseDate(iso).getMonth()]||''; }
function monthLong(iso) { if(!isValidISO(iso))return''; return MONTHS_LONG[parseDate(iso).getMonth()]||''; }
function dayNum(iso) { if(!isValidISO(iso))return''; return String(parseDate(iso).getDate()).padStart(2,'0'); }
function normUrl(u) { if(!u)return'#'; var s=String(u).trim(); if(!s||s==='#')return'#'; var md=s.match(/\]\(([^)]+)\)/); if(md)s=md[1].trim(); if(/^https?:\/\//i.test(s))return s; if(/^mailto:/i.test(s))return s; if(/^www\./i.test(s))return 'https://'+s; return 'https://'+s.replace(/^\/+/,''); }
function dateLong(iso) { if(!isValidISO(iso))return''; const d = parseDate(iso); return WEEKDAYS_LONG[d.getDay()] + ', ' + MONTHS_LONG[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
function monthYearKey(iso) { if(!isValidISO(iso))return''; const d = parseDate(iso); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function getCluster(type) { return CLUSTER_OF[type] || 'convening'; }

function filtered() {
  const q = state.search.trim().toLowerCase();
  return EVENTS.filter(e => {
    if (state.focus !== 'all' && e.focusArea !== state.focus) return false;
    if (state.type !== 'all' && e.type !== state.type) return false;
    if (state.program !== 'all') {
      // Fuzzy match — accepts "btam", "BTAM", or the full name.
      // Note: renamed inner query var to prevent shadowing the outer `q`
      // (search query) which was a JS syntax error and broke the whole
      // filter chain including keyword search.
      var progTag = String(e.programInitiative || '').toLowerCase();
      var progQuery = String(state.program).toLowerCase();
      if (!progTag) return false;
      if (progTag !== progQuery && progTag.indexOf(progQuery) === -1) return false;
    }
    if (q) {
      const hay = (e.title + ' ' + e.desc + ' ' + e.long + ' ' + e.focusArea + ' ' + e.type + ' ' + e.location + ' ' + e.audience).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => a.date.localeCompare(b.date));
}

function cardBanner(e) {
  return `<div class="card-banner">
    <span class="b-date">${monthShort(e.date).toUpperCase()} ${dayNum(e.date)}<span class="pipe">|</span><span class="wd">${dayShort(e.date).toUpperCase()}</span></span>
    <span class="b-time"><svg class="time-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>${esc(e.time)}</span>
  </div>`;
}
// Kept for compatibility with agenda / month / other views that don't use banner
function dtChip(e) {
  return `<span class="dt-chip">
    ${monthShort(e.date).toUpperCase()} ${dayNum(e.date)}
    <span class="wd">${dayShort(e.date).toUpperCase()}</span>
  </span>`;
}
function timeText(e) {
  return `<span class="card-time">${CLOCK_SVG}${esc(e.time)}</span>`;
}

function typeChip(e) {
  const cluster = getCluster(e.type);
  const tc = typeColor(e.type);
  return `<span class="info-chip type-chip" style="background:${tc.tint};color:${tc.color}">${ICON_OF[cluster]}${esc(e.type)}</span>`;
}

function focusChip(e) {
  const cluster = getCluster(e.type);
  return `<span class="info-chip focus-chip cat-${cluster}"><span class="dot"></span>${esc(e.focusArea)}</span>`;
}

// Program / Initiative pill — small, only renders when the event has a tag.
// Sub-team widgets use ?program=X to show only their events; this pill makes
// the tag visible on every card + row + modal so it's clear what it is.
function programPill(e) {
  if (!e.programInitiative) return '';
  return `<span class="info-chip" style="background:linear-gradient(135deg,#0d7ba018,#42c3f712);color:#0d7ba0;border:1px solid #42c3f766;font-weight:700;font-size:11px;letter-spacing:.02em;">
    <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right:2px;"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
    ${esc(e.programInitiative)}
  </span>`;
}

function cardHTML(e) {
  const tc = typeColor(e.type);
  const styleVars = `--cat-color:${tc.color};--cat-tint:${tc.tint}`;
  const label = `${e.title}, ${e.focusArea}, ${e.type}, ${dateLong(e.date)}, ${e.time}, ${e.location}`;
  return `<article class="card" style="${styleVars}" role="button" tabindex="0" aria-label="${esc(label)} — press Enter for full details" onclick="openModal('${e.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openModal('${e.id}')}">
    ${cardBanner(e)}
    <div class="focus-strip">${esc(e.focusArea)}</div>
    <div class="card-inner">
      <h3 class="card-title">${esc(e.title)}</h3>
      <div class="card-chips">${typeChip(e)}${programPill(e)}${e.contactHours ? '<span class="badge-hours" aria-label="Includes contact hours"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg>Contact Hours</span>' : ''}</div>
      <hr class="card-hr" aria-hidden="true">
      <p class="card-desc">${esc(e.desc)}</p>
      <div class="card-foot">
        <div class="card-loc"><span aria-hidden="true">${PIN_SVG}</span><span>${esc(e.location)}</span></div>
        <button class="btn-cta" type="button" aria-label="Register for ${esc(e.title)}" onclick="event.stopPropagation();openModal('${e.id}')">Register <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>
  </article>`;
}

function agendaRowHTML(e) {
  const cluster = getCluster(e.type);
  const isRange = e.end && e.end !== e.date;
  const dayLabel = isRange ? `${dayNum(e.date)}–${dayNum(e.end)}` : dayNum(e.date);
  return `<button class="agenda-row cat-${cluster}" onclick="openModal('${e.id}')">
    <div class="row-date">
      <span class="day-num">${dayLabel}</span>
      <span class="day-wd">${dayShort(e.date)} · ${monthShort(e.date)}</span>
    </div>
    <div class="row-body">
      <div class="row-chips">${focusChip(e)}</div>
      <h3 class="row-title">${esc(e.title)}</h3>
      <div class="row-chips" style="margin-top:-4px;margin-bottom:8px">${typeChip(e)}${programPill(e)}</div>
      <p class="row-desc">${esc(e.desc)}</p>
      <div class="row-loc">
        ${CLOCK_SVG}<span class="time-mark">${esc(e.time)}</span>
        <span class="dot-sep">·</span>
        ${PIN_SVG}<span>${esc(e.location)}</span>
      </div>
    </div>
    <div class="row-arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
  </button>`;
}

// ─── VIEW RENDERERS ────────────────────────────────────
function renderCards() {
  const events = filtered();
  if (!events.length) return renderEmpty();
  const container = document.getElementById('events-container');
  // Carousel is height-constrained — drop the 40px pad. Plain embed keeps it.
  const isCarousel = document.documentElement.classList.contains('carousel-mode');
  const gridStyle = isCarousel ? '' : 'padding-top:40px';
  container.innerHTML = `<div class="card-grid" style="${gridStyle}">${events.map(cardHTML).join('')}</div>`;
  if (isCarousel) mountCarouselArrows(container);
}

function mountCarouselArrows(container) {
  const grid = container.querySelector('.card-grid');
  if (!grid) return;
  const arrowSVG = (dir) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="${dir === 'prev' ? 'M15 18l-6-6 6-6' : 'M9 6l6 6-6 6'}"/>
  </svg>`;
  const prev = document.createElement('button');
  prev.className = 'carousel-arrow prev';
  prev.type = 'button';
  prev.setAttribute('aria-label', 'Previous events');
  prev.innerHTML = arrowSVG('prev');
  const next = document.createElement('button');
  next.className = 'carousel-arrow next';
  next.type = 'button';
  next.setAttribute('aria-label', 'Next events');
  next.innerHTML = arrowSVG('next');

  const scrollBy = () => {
    const first = grid.querySelector('.card');
    if (!first) return 320;
    return first.getBoundingClientRect().width + 16; // card width + gap
  };
  prev.addEventListener('click', () => grid.scrollBy({ left: -scrollBy() * 2, behavior: 'smooth' }));
  next.addEventListener('click', () => grid.scrollBy({ left:  scrollBy() * 2, behavior: 'smooth' }));

  const updateArrows = () => {
    prev.disabled = grid.scrollLeft <= 4;
    next.disabled = grid.scrollLeft + grid.clientWidth >= grid.scrollWidth - 4;
  };
  grid.addEventListener('scroll', updateArrows, { passive: true });
  requestAnimationFrame(updateArrows);
  window.addEventListener('resize', updateArrows);

  container.appendChild(prev);
  container.appendChild(next);
}

function renderAgenda() {
  const events = filtered();
  if (!events.length) return renderEmpty();
  const byMonth = {};
  for (const e of events) {
    const k = monthYearKey(e.date);
    (byMonth[k] ||= []).push(e);
  }
  let html = '<div class="agenda">';
  Object.keys(byMonth).sort().forEach(k => {
    const [y,m] = k.split('-');
    const monthName = MONTHS_LONG[Number(m)-1];
    const list = byMonth[k];
    html += `<div class="month-head"><h2>${monthName}<span class="year">${y}</span></h2><div class="count">${list.length} event${list.length===1?'':'s'}</div></div>`;
    html += list.map(agendaRowHTML).join('');
  });
  html += '</div>';
  document.getElementById('events-container').innerHTML = html;
}

function renderMonth() {
  const events = filtered();
  const byDate = {};
  for (const e of events) (byDate[e.date] ||= []).push(e);

  const firstEventDate = events.length ? parseDate(events[0].date) : new Date();
  const year = firstEventDate.getFullYear();
  const month = firstEventDate.getMonth();
  const first = new Date(year, month, 1);
  const startPad = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();

  let cells = '';
  WEEKDAYS.forEach(d => cells += `<div class="dow">${d}</div>`);

  for (let i = startPad; i > 0; i--) {
    cells += `<div class="day-cell other"><span class="num">${prevDays - i + 1}</span></div>`;
  }

  const today = new Date();
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;
    const dayEvents = byDate[iso] || [];
    let dots = '';
    for (let i = 0; i < Math.min(3, dayEvents.length); i++) {
      const e = dayEvents[i];
      dots += `<button class="day-dot cat-${getCluster(e.type)}" onclick="event.stopPropagation();openModal('${e.id}')" title="${esc(e.title)}">${esc(e.title)}</button>`;
    }
    if (dayEvents.length > 3) dots += `<span style="font-size:10px;color:var(--ink-3);font-weight:600;padding:0 6px">+${dayEvents.length-3} more</span>`;
    cells += `<div class="day-cell${isToday?' today':''}"><span class="num">${d}</span>${dots}</div>`;
  }

  const totalCells = startPad + daysInMonth;
  const trailingPad = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= trailingPad; i++) {
    cells += `<div class="day-cell other"><span class="num">${i}</span></div>`;
  }

  document.getElementById('events-container').innerHTML = `<div class="month-grid-view">
    <div class="mg-head">
      <h2>${MONTHS_LONG[month]}<span class="year">${year}</span></h2>
      <div class="mg-nav"><button>Prev</button><button>Today</button><button>Next</button></div>
    </div>
    <div class="month-grid">${cells}</div>
    ${!events.length ? renderEmptyMarkup() : ''}
  </div>`;
}

function renderEmpty() {
  document.getElementById('events-container').innerHTML = renderEmptyMarkup();
}
function renderEmptyMarkup() {
  return `<div class="empty"><div class="big">No events match your filters.</div><div class="sm">Try widening the focus area or clearing the type filter.</div></div>`;
}

// Threshold below which the 7-column month grid gets too cramped — cells
// truncate event titles down to fragments and Fri/Sat can even clip out of
// view in narrow iframe embeds.
const MONTH_MIN_WIDTH = 900;

function render() {
  // If the viewport is too narrow for the month view, migrate state.view
  // to agenda BEFORE rendering — that also keeps the button-toggle UI in
  // sync (no dead "Month" button appearing active while agenda renders).
  if (state.view === 'month' && window.innerWidth < MONTH_MIN_WIDTH) {
    state.view = 'agenda';
    document.querySelectorAll('#view-toggle button').forEach(x => {
      x.classList.toggle('active', x.getAttribute('data-view') === 'agenda');
    });
  }
  updateStats();
  updateProgramBanner();
  if (state.view === 'cards') renderCards();
  else if (state.view === 'agenda') renderAgenda();
  else renderMonth();
}

// Re-render on resize so the fallback engages / disengages as widths change.
// Debounced to avoid thrashing on drag-resize.
let _resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => render(), 120);
});

// Banner shows when the URL asked for a specific program. The label prefers
// the full form found on any event (so ?program=btam still displays as
// "Behavioral Threat Assessment & Management").
function updateProgramBanner() {
  const banner = document.getElementById('program-filter-banner');
  if (!banner) return;
  // Toggle via style.display — the banner has inline flex-container rules
  // that would otherwise override the [hidden] attribute's UA display:none.
  if (state.program === 'all') { banner.style.display = 'none'; return; }
  var raw = String(state.program);
  var q = raw.toLowerCase();
  var full = raw;
  for (const ev of EVENTS) {
    const p = String(ev.programInitiative || '');
    if (p && (p.toLowerCase() === q || p.toLowerCase().indexOf(q) !== -1)) {
      full = p; break;
    }
  }
  document.getElementById('program-filter-label').textContent = full;
  banner.style.display = 'flex';
}

// Attach directly — the banner and its clear button already exist in the
// DOM by the time this script runs (they're earlier in the body). Waiting
// for DOMContentLoaded was over-cautious and, in some browsers, the event
// had already fired by the time the listener was registered — leaving the
// button dead.
(function attachProgramClear(){
  var clear = document.getElementById('program-filter-clear');
  if (!clear) return;
  clear.addEventListener('click', function() {
    state.program = 'all';
    try {
      var url = new URL(window.location.href);
      url.searchParams.delete('program');
      window.history.replaceState({}, '', url.toString());
    } catch(e){}
    render();
  });
})();

function updateStats() {
  const events = filtered();
  document.getElementById('stat-events').textContent = events.length;
  const focusSet = new Set(events.map(e => e.focusArea));
  var _sf = document.getElementById('stat-focus'); if (_sf) _sf.textContent = focusSet.size;
  const typeSet = new Set(events.map(e => e.type));
  var _st = document.getElementById('stat-types'); if (_st) _st.textContent = typeSet.size;
}

// Accessibility: remember opener so we can return focus on close.
let _lastFocused = null;

function openModal(id) {
  const e = EVENTS.find(x => x.id === id);
  if (!e) return;
  const cluster = getCluster(e.type);
  const c = contactFor(e);
  _lastFocused = document.activeElement;
  const scrim = document.getElementById('modal-scrim');
  scrim.setAttribute('role', 'dialog');
  scrim.setAttribute('aria-modal', 'true');
  scrim.setAttribute('aria-labelledby', 'modal-title');
  const modal = document.getElementById('modal');
  modal.className = 'modal cat-' + cluster;
  modal.innerHTML = `
    <button class="modal-close" type="button" aria-label="Close" onclick="closeModal()"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M6 18L18 6"/></svg></button>
    <div class="m-title-block">
      ${focusChip(e)}
      <h3 id="modal-title">${esc(e.title)}</h3>
      <div class="m-chips">${typeChip(e)}${programPill(e)}</div>
    </div>
    <div class="m-desc">${e.long || esc(e.desc)}</div>
    <div class="m-facts">
      <div class="m-fact"><span aria-hidden="true">${CLOCK_SVG}</span><div><strong>When</strong><span class="val">${dateLong(e.date)} - ${esc(e.time)}</span></div></div>
      <div class="m-fact"><span aria-hidden="true">${PIN_SVG}</span><div><strong>Where</strong><span class="val">${esc(e.venueName || e.location)}${e.venueAddress ? '<br><span style="font-weight:500;font-size:13px;opacity:0.85">' + esc(e.venueAddress) + '</span>' : ''}</span></div></div>
      <div class="m-fact"><span aria-hidden="true">${USERS_SVG}</span><div><strong>Audience</strong><span class="val">${esc(e.audience)}</span></div></div>
      <div class="m-fact"><span aria-hidden="true">${USER_SVG}</span><div><strong>Contact</strong><span class="val">${esc(c.name)}</span><a href="mailto:${esc(c.email)}" class="m-mail" aria-label="Email ${esc(c.name)}"><span aria-hidden="true">${MAIL_SVG}</span>${esc(c.email)}</a></div></div>
    </div>
    <a class="m-cta" href="${normUrl(e.register)}" target="_blank" rel="noopener" aria-label="Register for this event (opens new page)">Register <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2.4;fill:none" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <div class="m-meta">Focus area - ${esc(e.focusArea)}</div>
  `;
  scrim.classList.add('open');
  document.body.style.overflow = 'hidden';
  // Move focus into the modal (close button is a safe landing).
  setTimeout(() => modal.querySelector('.modal-close')?.focus(), 0);
}
function closeModal() {
  document.getElementById('modal-scrim').classList.remove('open');
  document.body.style.overflow = '';
  // Return focus to whatever triggered the modal.
  if (_lastFocused && typeof _lastFocused.focus === 'function') {
    _lastFocused.focus();
  }
}

// Global keyboard handler for modal: Escape closes, Tab is trapped within.
document.addEventListener('keydown', (e) => {
  const scrim = document.getElementById('modal-scrim');
  if (!scrim || !scrim.classList.contains('open')) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
  if (e.key === 'Tab') {
    const modal = document.getElementById('modal');
    const focusable = modal.querySelectorAll('a, button, [tabindex]:not([tabindex="-1"]), input, select, textarea');
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

// ─── FILTER WIRING ─────────────────────────────────────
function populateFocusSelect() {
  const counts = {};
  EVENTS.forEach(e => counts[e.focusArea] = (counts[e.focusArea] || 0) + 1);
  const areas = Object.keys(counts).sort();
  const sel = document.getElementById('focus-select');
  sel.innerHTML = `<option value="all">All focus areas (${EVENTS.length})</option>` + areas.map(a => `<option value="${esc(a)}">${esc(a)} (${counts[a]})</option>`).join('');
  sel.value = state.focus; // reflect URL-param pre-filter
  sel.addEventListener('change', () => { state.focus = sel.value; render(); });
}
function populateTypeSelect() {
  const counts = {};
  EVENTS.forEach(e => counts[e.type] = (counts[e.type] || 0) + 1);
  const types = Object.keys(counts).sort();
  const sel = document.getElementById('type-select');
  sel.innerHTML = `<option value="all">All types (${EVENTS.length})</option>` + types.map(t => `<option value="${esc(t)}">${esc(t)} (${counts[t]})</option>`).join('');
  sel.value = state.type; // reflect URL-param pre-filter
  sel.addEventListener('change', () => { state.type = sel.value; render(); });
}

// Search
const searchInput = document.getElementById('search-input');
const searchClear = document.getElementById('search-clear');
searchInput.addEventListener('input', () => {
  state.search = searchInput.value;
  searchClear.hidden = !state.search;
  render();
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  state.search = '';
  searchClear.hidden = true;
  searchInput.focus();
  render();
});

document.getElementById('view-toggle').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]');
  if (!b) return;
  document.querySelectorAll('#view-toggle button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  state.view = b.dataset.view;
  render();
});

loadEvents();

<!DOCTYPE html>
<html lang="en">
<head>
<script src="gate.js"></script>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Branding & Comms | Maine DOE Communications Portal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=League+Spartan:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',-apple-system,sans-serif;background:#f3f6f9;color:#182b3c;min-height:100vh}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#a8bdd040;border-radius:3px}
.portal-bar{display:flex;align-items:center;gap:12px;padding:0 24px;height:52px;background:linear-gradient(90deg,#0a1520,#0e1c2a);border-bottom:1px solid rgba(66,195,247,0.1);font-family:"DM Sans",-apple-system,sans-serif;flex-shrink:0}
.portal-bar .me-badge{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#42c3f7,#34d399);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#0c1926;flex-shrink:0}
.portal-bar .crumb{display:flex;align-items:center;gap:8px;flex:1;font-size:13px}
.portal-bar .crumb a{color:#94a3b8;text-decoration:none;font-weight:500;transition:color .15s}
.portal-bar .crumb a:hover{color:#42c3f7}
.portal-bar .crumb .sep{color:#475569;font-size:11px}
.portal-bar .crumb .current{color:#e2e8f0;font-weight:700}
</style>
</head>
<body>
<div id="portal-bar" class="portal-bar"><div class="me-badge">ME</div><div class="crumb"><a href="index.html">Portal</a><span class="sep">›</span><span class="current">Branding & Comms</span></div></div>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.9/babel.min.js"></script>
<script type="text/babel">
const {useState} = React;

const I=({d,size=20,color='currentColor',style})=>(
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0,...style}}>
    {Array.isArray(d)?d.map((p,i)=><path key={i} d={p}/>):<path d={d}/>}
  </svg>
);

const B={navy:'#182b3c',navyMid:'#274f73',teal:'#42c3f7',tealDk:'#2da8d8',
  wh:'#ffffff',txt:'#182b3c',txtSec:'#334155',txtMute:'#475569',
  border:'#a8bdd0',warm:'#eee6df',red:'#8a2e13',green:'#16a34a'};

const tabs=[
  {id:'intro',label:'Intro',icon:["M8 12h.01","M12 12h.01","M16 12h.01","M21 12c0 4.97-4.03 9-9 9a9.72 9.72 0 01-4.5-1.1L3 21l1.1-5.5A9.72 9.72 0 013 12c0-4.97 4.03-9 9-9s9 4.03 9 9z"]},
  {id:'colors',label:'Colors',icon:["M12 2L2 7l10 5 10-5-10-5z","M2 17l10 5 10-5","M2 12l10 5 10-5"]},
  {id:'type',label:'Typography',icon:["M4 7V4h16v3","M9 20h6","M12 4v16"]},
  {id:'voice',label:'Voice',icon:["M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"]},
  {id:'language',label:'Language',icon:["M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z","M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"]},
  {id:'logos',label:'Logos',icon:["M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"]},
  {id:'images',label:'Images',icon:["M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2z","M8.5 10a1.5 1.5 0 100-3 1.5 1.5 0 000 3z","M21 15l-5-5L5 21"]},
  {id:'correspondence',label:'Correspondence',icon:["M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2z","M22 6l-10 7L2 6"]},
  {id:'resources',label:'Resources',icon:["M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6","M15 3h6v6","M10 14L21 3"]},
];

function Pill({children,color}){return <span style={{display:'inline-block',padding:'3px 12px',borderRadius:20,fontSize:11,fontWeight:700,
  background:color?`${color}12`:'#f1f5f9',color:color||B.txtSec,border:`1px solid ${color?color+'25':'#e2e8f0'}`}}>{children}</span>}

function Card({children,style,accent}){return <div style={{background:B.wh,borderRadius:14,padding:'20px 22px',
  border:`2px solid ${B.border}70`,boxShadow:'0 4px 16px rgba(24,43,60,0.08)',
  borderLeft:accent?`5px solid ${accent}`:undefined,...style}}>{children}</div>}

function SectionHead({title,sub}){return <div style={{marginBottom:20}}>
  <h3 style={{fontSize:20,fontWeight:800,color:B.navy,marginBottom:6,letterSpacing:'-0.01em'}}>{title}</h3>
  {sub&&<p style={{fontSize:14,color:B.txtMute,lineHeight:1.6,fontWeight:500}}>{sub}</p>}
</div>}

function SubHead({children,accent}){const a=accent||B.teal;return <h4 style={{fontSize:14,fontWeight:800,color:B.navy,textTransform:'uppercase',letterSpacing:.6,marginBottom:14,marginTop:8,display:'flex',alignItems:'center',gap:10}}><span style={{width:20,height:3,background:a,borderRadius:2}}/>{children}</h4>}

// Panel: navy-gradient header + light body (matches EnGiNE's Communications Orientation card).
// Icon + title + optional subtitle in the header, optional action button on the right.
function Panel({icon,title,subtitle,action,children,accent}){
  const acc=accent||B.teal;
  return <div style={{background:B.wh,borderRadius:14,border:`2px solid ${acc}55`,overflow:'hidden',marginBottom:20,boxShadow:'0 5px 18px rgba(24,43,60,0.10)'}}>
    <div style={{padding:'18px 24px',background:'linear-gradient(135deg,#0c1926,#162d44)',display:'flex',alignItems:'center',justifyContent:'space-between',gap:16}}>
      <div style={{display:'flex',alignItems:'center',gap:12,minWidth:0,flex:1}}>
        {icon&&<div style={{width:40,height:40,borderRadius:12,background:`${acc}25`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <I d={icon} size={18} color={acc}/>
        </div>}
        <div style={{minWidth:0}}>
          <h3 style={{fontSize:16,fontWeight:700,color:'#fff',margin:0,letterSpacing:'-0.005em'}}>{title}</h3>
          {subtitle&&<p style={{fontSize:12,color:'#94a3b8',margin:0,fontWeight:500}}>{subtitle}</p>}
        </div>
      </div>
      {action}
    </div>
    <div style={{padding:'22px 24px'}}>{children}</div>
  </div>;
}

function Tip({children,type}){
  const warn=type==='warn';
  return <div style={{display:'flex',gap:10,padding:'14px 18px',borderRadius:12,marginBottom:16,fontSize:13,lineHeight:1.6,fontWeight:500,
    background:warn?'#fef3c714':'rgba(66,195,247,0.06)',border:`1.5px solid ${warn?'#f59e0b30':'rgba(66,195,247,0.2)'}`,
    borderLeft:`4px solid ${warn?'#f59e0b':B.teal}`,color:B.txtSec}}>
    <I d={warn?["M12 22a10 10 0 100-20 10 10 0 000 20z","M12 8v4","M12 16h.01"]:["M12 22a10 10 0 100-20 10 10 0 000 20z","M12 16v-4","M12 8h.01"]} size={18} color={warn?'#f59e0b':B.teal} style={{flexShrink:0,marginTop:1}}/>
    <div>{children}</div>
  </div>}

function ColorSwatch({hex,label,rgb,cmyk,primary}){
  const [copied,setCopied]=useState(false);
  const light=hex==='#eee6df'||hex==='#42c3f7';
  return <div onClick={()=>{navigator.clipboard.writeText(hex);setCopied(true);setTimeout(()=>setCopied(false),1500);}}
    style={{width:160,cursor:'pointer',transition:'transform 0.15s'}}
    onMouseEnter={e=>e.currentTarget.style.transform='translateY(-2px)'}
    onMouseLeave={e=>e.currentTarget.style.transform='none'}>
    <div style={{height:80,borderRadius:12,background:hex,border:light?`2px solid ${B.border}60`:'none',
      display:'flex',alignItems:'flex-end',justifyContent:'flex-end',padding:8,
      boxShadow:`0 4px 16px ${hex}30`}}>
      {copied&&<span style={{fontSize:10,fontWeight:700,color:light?B.navy:'#fff',background:'rgba(255,255,255,0.3)',padding:'2px 8px',borderRadius:6}}>Copied!</span>}
    </div>
    <div style={{marginTop:8}}>
      {primary&&<Pill color={B.teal}>Primary</Pill>}
      {!primary&&<Pill>Secondary</Pill>}
      <div style={{fontSize:15,fontWeight:700,color:B.navy,margin:'6px 0 2px'}}>{label}</div>
      <div style={{fontSize:11,color:B.txtMute,fontWeight:600,fontFamily:'monospace'}}>{hex}</div>
      <div style={{fontSize:10,color:B.txtMute,marginTop:2}}>RGB: {rgb}</div>
      {cmyk&&<div style={{fontSize:10,color:B.txtMute}}>CMYK: {cmyk}</div>}
    </div>
  </div>}

function CheckRow({items,positive,accent}){
  return <div>{items.map((x,i)=>(
    <div key={i} style={{padding:'8px 0',borderBottom:`1px solid ${B.border}40`,fontSize:14,color:B.navy,fontWeight:500,display:'flex',alignItems:'flex-start',gap:8}}>
      <I d={positive?["M20 6L9 17l-5-5"]:["M18 6L6 18","M6 6l12 12"]} size={16} color={accent||(positive?'#16a34a':B.red)} style={{flexShrink:0,marginTop:2}}/>
      <span>{x}</span>
    </div>
  ))}</div>
}

function BrandGuide(){
  const [tab,setTab]=useState('intro');

  return(
    <div style={{maxWidth:1200,margin:'0 auto',padding:'0 28px'}}>
      {/* Hero banner */}
      <div style={{background:'linear-gradient(135deg,#0c1926,#162d44)',borderRadius:'0 0 20px 20px',padding:'32px 32px 28px',marginBottom:28,position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',inset:0,pointerEvents:'none',
          backgroundImage:'linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px)',
          backgroundSize:'60px 60px',maskImage:'radial-gradient(ellipse 80% 80% at 50% 50%,black,transparent)',WebkitMaskImage:'radial-gradient(ellipse 80% 80% at 50% 50%,black,transparent)'}}/>
        <div style={{position:'relative',zIndex:1}}>
          <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:14}}>
            <div style={{width:44,height:44,borderRadius:12,background:'linear-gradient(135deg,#c084fc,#a855f7)',
              display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 16px rgba(192,132,252,0.3)'}}>
              <I d={["M12 2L2 7l10 5 10-5-10-5z","M2 17l10 5 10-5","M2 12l10 5 10-5"]} size={22} color="#fff"/>
            </div>
            <div>
              <h1 style={{fontSize:24,fontWeight:800,color:'#fff',margin:0}}>Branding & Comms</h1>
              <p style={{fontSize:13,color:'#94a3b8',margin:0,fontWeight:500}}>Maine DOE Communications Portal</p>
            </div>
          </div>
        </div>
      </div>

      {/* Tab bar */}
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:28,padding:'0 4px'}}>
        {tabs.map(t=>{
          const active=tab===t.id;
          return <button key={t.id} onClick={()=>setTab(t.id)}
            style={{display:'flex',alignItems:'center',gap:6,padding:'9px 16px',borderRadius:10,fontSize:13,fontWeight:600,cursor:'pointer',
              border:active?`2px solid ${B.teal}`:`2px solid #c2cdd8`,
              background:active?B.navy:B.wh,color:active?B.teal:B.txtSec,
              boxShadow:active?'0 2px 8px rgba(24,43,60,0.2)':'0 1px 3px rgba(0,0,0,0.04)',
              transition:'all 0.15s'}}>
            <I d={t.icon} size={14} color={active?B.teal:B.txtMute}/> {t.label}
          </button>;
        })}
      </div>

      {/* Content */}
      <div key={tab} style={{animation:'fadeIn 0.3s ease',paddingBottom:60}}>

        {/* ── INTRO ── */}
        {tab==='intro'&&<div>
          <SectionHead title="Welcome to the Branding & Comms Guide" sub="A single home for how the Maine DOE looks, sounds, and works with the field."/>
          <Card style={{marginBottom:20}}>
            <p style={{fontSize:14,color:B.txtSec,lineHeight:1.7,fontWeight:500,margin:'0 0 12px'}}>
              This guide ensures that all Maine Department of Education (DOE) materials and communications have a cohesive appearance, voice, and identity. A strong, cohesive brand strengthens the impact of our collective work, builds deeper connections with our audiences, and promotes our values, vision, and mission.
            </p>
            <p style={{fontSize:14,color:B.txtSec,lineHeight:1.7,fontWeight:500,margin:0}}>
              When creating anything for publication, consult the sections here related to the work you are doing to ensure your product stays on brand.
            </p>
          </Card>
          <Tip>There may be certain instances when material is created outside of these brand guidelines (e.g., material intended for students). Contact the Communications Team in those instances with questions.</Tip>

          <SubHead>Involving the Comms Team</SubHead>
          <Tip>Bring the Communications Team in at the <strong>ground level</strong> of any project. This will save you time and energy!</Tip>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:20}}>
            <Card accent="#16a34a">
              <h4 style={{fontSize:15,fontWeight:700,color:'#16a34a',margin:'0 0 12px'}}>Please Do</h4>
              <CheckRow positive={true} items={[
                'Bring the Communications Team in at the ground level of an idea or project.',
                'Invite the Communications Team to your first planning meeting so we can understand your goals.',
                'Share your goals so we can develop a strategy together.',
                'Contact us early and often.',
                'Bring your project, goals, and audiences to us — we\'ll work together to plan announcements.',
                'Adhere to the Maine DOE Brand Guide.',
                'Use appropriate workflows.',
              ]}/>
            </Card>
            <Card accent={B.red}>
              <h4 style={{fontSize:15,fontWeight:700,color:B.red,margin:'0 0 12px'}}>Please Do Not</h4>
              <CheckRow positive={false} items={[
                'Wait to contact the Communications Team until you send us a Maine DOE Newsroom post.',
                'Utilize just one tactic to achieve your goal.',
                'Only ask for a video, social media campaign, etc., without providing additional context.',
                'Talk to the press without approval.',
                'Plan events without informing the Communications Team.',
              ]}/>
            </Card>
          </div>
          <Tip type="warn">Submit to the <strong>Communications Workflow at least two weeks</strong> before you want content posted or sent. Full workflow, approvals, and materials guide now live in <strong>Publication → Overview</strong>.</Tip>
        </div>}

        {/* ── COLORS ── */}
        {tab==='colors'&&<div>
          <SectionHead title="Color usage" sub="Three primary and three secondary colors. Primary colors are the most prominent; secondary are accents."/>
          <Card style={{marginBottom:20}}>
            <SubHead>Primary colors</SubHead>
            <div style={{display:'flex',gap:24,flexWrap:'wrap'}}>
              <ColorSwatch hex="#182b3c" label="Dark Navy" rgb="24 - 43 - 60" cmyk="90 - 74 - 51 - 54" primary/>
              <ColorSwatch hex="#274f73" label="Mid Blue" rgb="39 - 79 - 115" cmyk="91 - 69 - 33 - 17" primary/>
              <ColorSwatch hex="#6d8ba6" label="Steel Blue" rgb="109 - 139 - 166" cmyk="62 - 38 - 23 - 1" primary/>
            </div>
          </Card>
          <Card style={{marginBottom:20}}>
            <SubHead>Secondary colors</SubHead>
            <div style={{display:'flex',gap:24,flexWrap:'wrap'}}>
              <ColorSwatch hex="#8a2e13" label="Rust Red" rgb="138 - 46 - 19" cmyk="29 - 89 - 100 - 31"/>
              <ColorSwatch hex="#eee6df" label="Warm White" rgb="238 - 230 - 223" cmyk="6 - 8 - 10 - 0"/>
              <ColorSwatch hex="#42c3f7" label="Teal" rgb="66 - 195 - 247" cmyk="60 - 3 - 0 - 0"/>
            </div>
          </Card>
          <Tip>Click any swatch to copy the hex code. Teal (<code style={{background:'#f1f5f9',padding:'1px 6px',borderRadius:4,fontSize:12}}>#42c3f7</code>) is a <strong>secondary accent</strong> — use it for borders, dividers, and hover states, not as a dominant background.</Tip>
        </div>}

        {/* ── TYPOGRAPHY ── */}
        {tab==='type'&&<div>
          <SectionHead title="Typography (fonts)" sub="Four primary font types for graphics, promotional materials, and digital spaces. All fonts may be used in the various forms available (bold, italics, etc.)."/>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:16,marginBottom:20}}>
            {[{pill:'Body text',name:'Calibri',family:'Calibri, sans-serif',desc:'Emails, letters, body text. Sans-serif for accessibility — recommended by the U.S. Secretary of State\'s Office of Diversity and Inclusion.',preview:'The quick brown fox jumps over the lazy dog.',
                bundled:'Installed with Microsoft Office. Every DOE staff member with Microsoft 365 already has it.',
                // TODO: paste the SharePoint or maine.gov URL for the Calibri font file here
                download:'#'},
              {pill:'Headers & graphics',name:'Century Gothic',family:'"Century Gothic", sans-serif',desc:'Primary font for graphics and promotional materials.',preview:'THE QUICK BROWN FOX',
                bundled:'Installed with Microsoft Office. Every DOE staff member with Microsoft 365 already has it.',
                // TODO: paste the SharePoint or maine.gov URL for the Century Gothic font file here
                download:'#'},
              {pill:'Headers & graphics',name:'League Spartan',family:'"League Spartan", sans-serif',desc:'Used alongside Century Gothic. Free on Google Fonts.',preview:'THE QUICK BROWN FOX',download:'https://fonts.google.com/specimen/League+Spartan'},
              {pill:'PowerPoint headers',name:'Arial Black',family:'"Arial Black", "Helvetica Black", sans-serif',desc:'Used for PowerPoint presentation headers.',preview:'THE QUICK BROWN FOX',weight:900,
                bundled:'Installed with Windows and macOS. Standard on virtually every modern operating system.',
                // TODO: paste the SharePoint or maine.gov URL for the Arial Black font file here
                download:'#'}].map((f,i)=>(
              <Card key={i}><Pill>{f.pill}</Pill>
                <div style={{fontSize:28,fontWeight:f.weight||700,color:B.navy,margin:'12px 0 4px',fontFamily:f.family}}>{f.name}</div>
                <div style={{fontSize:15,fontFamily:f.family,fontWeight:f.weight||400,color:B.txtSec,margin:'0 0 8px',lineHeight:1.5}}>{f.preview}</div>
                <div style={{fontSize:12,fontFamily:f.family,fontWeight:f.weight||400,color:B.txtMute,margin:'0 0 8px',lineHeight:1.5,wordBreak:'break-all',letterSpacing:'.02em'}}>ABCDEFGHIJKLMNOPQRSTUVWXYZ<br/>abcdefghijklmnopqrstuvwxyz<br/>0123456789</div>
                <p style={{fontSize:13,color:B.txtMute,lineHeight:1.6,margin:'0 0 10px'}}>{f.desc}</p>
                {f.bundled&&<div style={{display:'inline-flex',alignItems:'center',gap:6,padding:'4px 10px',borderRadius:20,background:'#16a34a15',border:'1px solid #16a34a35',fontSize:10.5,fontWeight:800,color:'#166534',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:10}}>
                  <span style={{width:5,height:5,borderRadius:'50%',background:'#16a34a'}}/>Already installed
                </div>}
                {f.bundled&&<p style={{fontSize:11.5,color:B.txtMute,lineHeight:1.55,margin:'0 0 12px',fontWeight:500}}>{f.bundled}</p>}
                {f.download&&f.download!=='#'&&<a href={f.download} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:6,marginTop:4,fontSize:12,fontWeight:700,color:'#ffffff',textDecoration:'none',padding:'8px 14px',borderRadius:8,border:`2px solid ${B.tealDk}`,background:B.tealDk,boxShadow:'0 3px 10px rgba(45,168,216,0.3)'}}>
                  <I d={["M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4","M7 10l5 5 5-5","M12 15V3"]} size={14} color="#ffffff"/> Download font
                </a>}
                {f.download==='#'&&<div style={{marginTop:4,padding:'8px 12px',borderRadius:8,background:'#fef3c714',border:'1px solid #f59e0b30',fontSize:11.5,color:'#78350f',fontWeight:600,lineHeight:1.5}}>
                  Upload the font file and paste the URL into the brand guide code to enable the download button.
                </div>}
              </Card>
            ))}
          </div>
          <Card>
            <SubHead>Web-specific fonts</SubHead>
            {[{p:'Maine.gov (Drupal)',n:'Pre-set. Do not copy-paste from Word — it injects unwanted formatting.'},
              {p:'Newsroom (WordPress)',n:'Lato body. Century Gothic / League Spartan for banner graphics.'},
              {p:'Email blasts (Mailchimp)',n:'Arial body. Century Gothic / League Spartan for banner graphics.'}].map((x,i)=>(
              <div key={i} style={{display:'flex',gap:16,fontSize:13,padding:'10px 0',borderBottom:`1px solid ${B.border}45`}}>
                <span style={{fontWeight:700,minWidth:180,color:B.navy}}>{x.p}</span>
                <span style={{color:B.txtMute}}>{x.n}</span>
              </div>
            ))}
          </Card>
          <Tip>When writing a communication, use bold and italic sparingly and for the purpose of emphasis.</Tip>
        </div>}

        {/* ── VOICE ── */}
        {tab==='voice'&&<div>
          <SectionHead title="Brand voice" sub="Our voice connects to the values in our vision and mission. Consistent across all communications."/>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:20}}>
            <Card accent="#16a34a">
              <h4 style={{fontSize:15,fontWeight:700,color:'#16a34a',margin:'0 0 14px',display:'flex',alignItems:'center',gap:8}}>
                <I d={["M22 11.08V12a10 10 0 11-5.93-9.14","M22 4L12 14.01l-3-3"]} size={18} color="#16a34a"/> Always
              </h4>
              {['Clear, conversational, and human','Helpful and solution-oriented','Friendly yet professional','Kind, compassionate, and respectful',
                'Optimistic yet grounded','Inclusive','Student-, educator-, and school-centered','Creative and innovative (when appropriate)'].map((x,i)=>(
                <div key={i} style={{padding:'8px 0',borderBottom:`1px solid ${B.border}40`,fontSize:14,color:B.navy,fontWeight:500}}>{x}</div>
              ))}
            </Card>
            <Card accent={B.red}>
              <h4 style={{fontSize:15,fontWeight:700,color:B.red,margin:'0 0 14px',display:'flex',alignItems:'center',gap:8}}>
                <I d={["M18 6L6 18","M6 6l12 12"]} size={18} color={B.red}/> Never
              </h4>
              {['Overly punitive, harsh, critical, or negative','Bureaucratic','Using lots of words when fewer will do','Jargony','Exclusive'].map((x,i)=>(
                <div key={i} style={{padding:'8px 0',borderBottom:`1px solid ${B.border}40`,fontSize:14,color:B.navy,fontWeight:500}}>{x}</div>
              ))}
            </Card>
          </div>

        {/* ── LANGUAGE ── */}
        {tab==='language'&&<div>
          <SectionHead title="Language guidelines" sub="Writing conventions across all Maine DOE communications."/>

          <Card style={{marginBottom:16}}>
            <SubHead>Referring to the Maine DOE</SubHead>
            {[{l:'Initial',t:'"the Maine Department of Education (DOE)"'},{l:'Subsequent',t:'"the Maine DOE" or "the department" (lowercase)'},{l:'Never',t:'"MDOE"',bad:true}].map((r,i)=>(
              <div key={i} style={{display:'flex',gap:12,fontSize:13,padding:'6px 0',alignItems:'center'}}>
                <span style={{fontWeight:700,color:r.bad?B.red:B.navy,minWidth:90}}>{r.l}:</span>
                <code style={{background:'#f1f5f9',padding:'3px 10px',borderRadius:6,color:B.txtSec,fontSize:12,fontWeight:600}}>{r.t}</code>
              </div>
            ))}
            <div style={{marginTop:16,paddingTop:16,borderTop:`1px solid ${B.border}45`}}>
              <div style={{fontSize:13,fontWeight:700,color:B.navy,marginBottom:6}}>Referring to a specific office or team</div>
              <div style={{fontSize:13,color:B.txtSec,lineHeight:1.6}}>
                <strong>Initial:</strong> "The Maine Department of Education (DOE) [office or team name]"<br/>
                <strong>Subsequent:</strong> "The Maine DOE [office or team name]"
              </div>
            </div>
          </Card>

          <Card style={{marginBottom:16}}>
            <SubHead>Abbreviations & acronyms</SubHead>
            <CheckRow positive={false} accent={B.red} items={[
              'Do not create new ones that are not needed.',
              'Do not use your Maine DOE office acronym in public documents/spaces.',
              'Use them sparingly.',
            ]}/>
            <div style={{marginTop:10,fontSize:13,color:B.txtSec,lineHeight:1.6}}>Spell out the full name/title in the first reference before using the acronym. If you only reference the name/title once, you do not need the acronym. Example: <em>Every Student Succeeds Act (ESSA)</em> → subsequently <em>ESSA</em>.</div>
          </Card>

          <Card style={{marginBottom:16}}>
            <SubHead>Commonly-used conventions</SubHead>
            {['Oxford comma','One space after a period (not two)','Spell out a number when it begins a sentence or if it is less than 10 (e.g., "five"). Otherwise, use the numeral.',
              'Dates: January 1, 2026; 1/1/2026 (NOT 01/01/2026); January 1 (NOT January 1st)','Times: 10:30 a.m., 1 p.m., noon, midnight','MSAD 28, RSU 40 (no #)'].map((x,i)=>(
              <div key={i} style={{padding:'8px 0',borderBottom:`1px solid ${B.border}40`,fontSize:13,color:B.navy,fontWeight:500}}>{x}</div>
            ))}
          </Card>

          <Card style={{marginBottom:16}}>
            <SubHead>When making a reference</SubHead>
            <div style={{fontSize:13,color:B.txtSec,lineHeight:1.7}}>
              <div style={{marginBottom:6}}><strong>To a statute:</strong> "Maine Revised Statutes, Title 20-A, §1101, subsection 1"</div>
              <div style={{marginBottom:6}}><strong>To a law:</strong> "Public Law 2005, Chapter 457, Part KK, Section 3"</div>
              <div style={{marginBottom:6}}><strong>To a rule:</strong> "Rule Chapter 115"</div>
              <div style={{marginBottom:6}}><strong>To a biennium:</strong> "2020-2021 biennium"</div>
              <div style={{marginBottom:6}}><strong>To a fiscal year:</strong> "Fiscal Year 2018-19" or "FY19"</div>
              <div style={{marginBottom:6}}><strong>To a school year:</strong> "2025-2026 school year"</div>
              <div><strong>To a person:</strong> FULL NAME on first reference, LAST NAME after that</div>
            </div>
          </Card>

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
            <Card accent="#16a34a">
              <h4 style={{fontSize:13,fontWeight:700,color:B.navy,marginBottom:12}}>Hyphenate</h4>
              {['One-time','In-person','Cost-effective','Up-to-date','Long-term','State-of-the-art'].map((w,i)=>
                <div key={i} style={{fontSize:13,color:B.navy,padding:'4px 0',fontWeight:500}}>{w}</div>)}
            </Card>
            <Card accent={B.red}>
              <h4 style={{fontSize:13,fontWeight:700,color:B.navy,marginBottom:12}}>Do not hyphenate</h4>
              {['Ongoing','Statewide','High school','Nonprofit','Health care'].map((w,i)=>
                <div key={i} style={{fontSize:13,color:B.navy,padding:'4px 0',fontWeight:500}}>{w}</div>)}
            </Card>
          </div>
          <Tip>Avoid hyphens if one word is an adverb (ends in "-ly") or if the compound adjective comes AFTER the noun. Example: "The meeting was in person."</Tip>

          <Card style={{marginBottom:16}}>
            <SubHead>Capitalization</SubHead>
            <p style={{fontSize:13,color:B.txtSec,marginBottom:10,fontWeight:500}}>Capitalize words when they are part of an actual title or name:</p>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
              {['State Board of Education','Office of Innovation','Department of Labor','Bureau of Motor Vehicles','Governor Janet Mills','Commissioner Pender Makin','Maine Legislature','State of Maine','Early Learning Team'].map((x,i)=>(
                <div key={i} style={{fontSize:13,color:B.navy,padding:'4px 0',fontWeight:500}}>{x}</div>
              ))}
            </div>
          </Card>

          <Card style={{marginBottom:16}}>
            <SubHead>Citations</SubHead>
            <p style={{fontSize:13,color:B.txtSec,lineHeight:1.7,fontWeight:500,marginBottom:10}}>As leaders and experts in education, always try to generate unique content. Partnerships and external references should supplement our work rather than be the primary focus. Use APA style when citing external references.</p>
            <p style={{fontSize:13,color:B.txtSec,lineHeight:1.7,fontWeight:500,margin:0}}>When linking to files, resources, or external websites, use descriptive full-text links (e.g., "View the FY27 report"). Avoid "Click here" or "Read more" — especially when sufficient context has not been provided.</p>
          </Card>

          <Card>
            <SubHead>Inclusive language</SubHead>
            <CheckRow positive={true} items={[
              'Use person-first language.',
              'Use "schools across Maine" rather than "Maine schools".',
              'Use "school administrative unit (SAU)" rather than "district" (as applicable and in accordance with statutory definition).',
              'For office-specific language (Special Services, Wabanaki Studies, etc.), contact the office director/team leader.',
            ]}/>
          </Card>
        </div>}

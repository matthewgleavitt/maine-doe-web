<script type="text/babel">
const {useState,useEffect,useMemo} = React;

const ic={
  mail:["M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2z","M22 6l-10 7L2 6"],
  ext:["M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6","M15 3h6v6","M10 14L21 3"],

  book:["M4 19.5A2.5 2.5 0 016.5 17H20","M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"],

  layers:["M12 2L2 7l10 5 10-5-10-5z","M2 17l10 5 10-5","M2 12l10 5 10-5"],

};

const B={navy:'#182b3c',teal:'#42c3f7',tealDark:'#0d7ba0',purple:'#8b5cf6',purpleDark:'#6d28d9',wh:'#ffffff',txt:'#182b3c',txtSec:'#334155',txtMute:'#475569',border:'#a8bdd0',green:'#16a34a',warm:'#f5eee5'};
const API='https://script.google.com/macros/s/AKfycbw98yVhSSYfD2HhJGilZBYYE_dc_R9lY4ZKNxmRRyzHXVvQdVyPkBg_iYXDcAygSkqnTQ/exec';

const NEWSLETTER_BUILDER_URL='https://www.maine.gov/doe/sites/maine.gov.doe/files/bulk/communications/newsletter-builder/?backend=drupal';
const NEWSLETTER_TUTORIAL_URL='https://stateofmaine-my.sharepoint.com/:v:/g/personal/matthew_g_leavitt_maine_gov/IQBCNjXJdtVnQoluVjwZZKrpAapypefB97Nk71hrACsyjhc?e=ujyRxW';
const NEWSLETTER_SAMPLE_URL='https://www.maine.gov/doe/newsletters/general/escape-ordinary-2026-05-22';
const COMMONS_HOME_URL='https://www.maine.gov/doe/commons/';
const COMMONS_ADD_URL='https://www.maine.gov/doe/node/add/blog_post';
const COMMONS_DIRECTIONS_URL='commons-directions.html';

// WordPress.com public API — no auth required for public site posts.
const NEWSROOM_URL='https://mainedoenews.net/';
const NEWSROOM_SITE='mainedoenews.net';
const NEWSROOM_SUBMIT_URL='https://somdoegeneralproduction.crm9.dynamics.com/main.aspx?appid=baad3b2b-d201-4316-9e19-af1ea100f6b5&pagetype=entitylist&etn=comm_newsroomrequest&viewid=a9c34696-d0a9-44c3-aa2c-7383fbad60c9&viewType=1039';

function stripHtml(s){return String(s||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&#8217;/g,"'").replace(/&#8216;/g,"'").replace(/&#8220;/g,'"').replace(/&#8221;/g,'"').replace(/&#8230;/g,'…').replace(/\s+/g,' ').trim();}

// Fallback if the Commons feed can't be fetched (Apps Script down, CORS, etc.)
const FALLBACK_POSTS=[
  {title:'Teaching 9/11: The 25th Anniversary',team:'Interdisciplinary Instruction',url:'https://www.maine.gov/doe/commons/interdisciplinary-instruction/teaching-911-25th-anniversary',excerpt:'The Maine Department of Education would like to introduce resources that help educators address this important and challenging milestone.',image:'',date:''},
  {title:'School Nurse Summer Institute 2026',team:'School Health',url:'https://www.maine.gov/doe/commons/school-health/school-nurse-summer-institute-2026',excerpt:'Thank You For Attending School Nurse Summer Institute!',image:'',date:''},
];

// Deterministic team color palette (accessible band colors for card banners)
const TEAM_COLORS=['#0d7ba0','#8a2e13','#274f73','#4a6a80','#6b3a5a','#a86018','#182b3c','#3f7f5e'];
function teamColor(team){
  var s=String(team||''); var h=0;
  for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return TEAM_COLORS[h%TEAM_COLORS.length];
}
function fmtDate(iso){
  if(!iso) return '';
  try{
    var d=new Date(iso);
    if(isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  }catch(e){return '';}
}

function NewsroomArticleSearch({posts}){
  const [q,setQ]=useState('');
  const [sort,setSort]=useState('date'); // date | views | title
  const total=(posts||[]).length;
  const withViews=(posts||[]).filter(p=>p.views!=null&&p.views>0).length;

  const filtered=useMemo(()=>{
    const ql=q.trim().toLowerCase();
    let list=(posts||[]).filter(p=>!ql||String(p.title||'').toLowerCase().includes(ql));
    if(sort==='views') list=list.slice().sort((a,b)=>{
      const av=a.views==null?-1:a.views; const bv=b.views==null?-1:b.views;
      return bv-av;
    });
    if(sort==='date')  list=list.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    if(sort==='title') list=list.slice().sort((a,b)=>String(a.title||'').localeCompare(String(b.title||'')));
    return list;
  },[posts,q,sort]);
  const CAP=200;
  const showing=filtered.slice(0,CAP);

  function fmtDate(iso){
    if(!iso) return '';
    try{const d=new Date(iso); if(isNaN(d.getTime())) return ''; return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return '';}
  }

  return <div style={{background:'#ffffff',borderRadius:14,border:`2px solid #a8bdd055`,padding:'20px 22px',marginBottom:20,boxShadow:'0 2px 8px rgba(0,0,0,0.04)'}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap',marginBottom:12}}>
      <h3 style={{fontSize:13,fontWeight:800,color:'#182b3c',margin:0,textTransform:'uppercase',letterSpacing:'.06em'}}>Search article hits</h3>
      <div style={{fontSize:11.5,color:'#475569',fontWeight:600}}>All {total.toLocaleString()} articles published in the last 365 days</div>
    </div>
    <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}}>
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'9px 14px',background:'#ffffff',borderRadius:10,border:`1.5px solid #a8bdd055`,flex:'1 1 260px'}}>
        <Sv d={["M11 3a8 8 0 108 8","M21 21l-4.35-4.35"]} size={15} color="#475569"/>
        <input type="text" value={q} onChange={e=>setQ(e.target.value)}
          placeholder="Search titles (e.g. 'Assessment', 'Grant', 'Adult Education')..."
          style={{border:'none',outline:'none',flex:1,fontSize:13.5,color:'#182b3c',fontWeight:500,background:'transparent',fontFamily:'inherit'}}/>
        {q&&<span onClick={()=>setQ('')} style={{cursor:'pointer',color:'#475569',fontWeight:800,fontSize:16,lineHeight:1}}>×</span>}
      </div>
      <div style={{display:'flex',gap:4,padding:4,borderRadius:10,background:'#f1f5f9',fontSize:12,fontWeight:700}}>
        {['date','views','title'].map(s=>(
          <button key={s} onClick={()=>setSort(s)}
            style={{padding:'6px 12px',borderRadius:7,border:'none',background:sort===s?'#ffffff':'transparent',color:sort===s?'#182b3c':'#475569',cursor:'pointer',fontFamily:'inherit',fontWeight:700,fontSize:12,textTransform:'capitalize',boxShadow:sort===s?'0 1px 3px rgba(24,43,60,0.08)':'none'}}>
            {s==='date'?'Newest':s==='views'?'Most viewed':'A → Z'}
          </button>
        ))}
      </div>
    </div>
    <div style={{maxHeight:520,overflowY:'auto',border:`1px solid #a8bdd040`,borderRadius:10}}>
      <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
        <thead style={{position:'sticky',top:0,background:'#e2e8f0',zIndex:1}}>
          <tr>
            <th style={{padding:'10px 14px',textAlign:'left',fontWeight:800,color:'#182b3c',fontSize:11,textTransform:'uppercase',letterSpacing:'.05em'}}>Article</th>
            <th style={{padding:'10px 14px',textAlign:'left',fontWeight:800,color:'#182b3c',fontSize:11,textTransform:'uppercase',letterSpacing:'.05em',whiteSpace:'nowrap',width:110}}>Published</th>
            <th style={{padding:'10px 14px',textAlign:'right',fontWeight:800,color:'#182b3c',fontSize:11,textTransform:'uppercase',letterSpacing:'.05em',whiteSpace:'nowrap',width:110}}>Views (12mo)</th>
          </tr>
        </thead>
        <tbody>
          {showing.length===0?<tr><td colSpan={3} style={{padding:'30px 20px',textAlign:'center',color:'#475569',fontWeight:500}}>{q?`No articles match "${q}"`:'No article data available'}</td></tr>
          :showing.map((p,i)=>(
            <tr key={p.id||i} style={{borderTop:`1px solid #a8bdd033`}}>
              <td style={{padding:'10px 14px'}}>
                <a href={p.url} target="_blank" rel="noopener noreferrer" style={{color:'#182b3c',textDecoration:'none',fontWeight:600}}>{p.title}</a>
              </td>
              <td style={{padding:'10px 14px',color:'#475569',fontSize:12,fontWeight:600,whiteSpace:'nowrap'}}>{fmtDate(p.date)}</td>
              <td style={{padding:'10px 14px',textAlign:'right',fontWeight:800,fontVariantNumeric:'tabular-nums',whiteSpace:'nowrap',color:p.views==null?'#94a3b8':'#8a2e13'}}>
                {p.views==null?<span title="Below the monthly top-100 cutoff — traffic exists but WordPress.com only exposes counts for the top 100 per month">—</span>:(p.views||0).toLocaleString()}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
    <div style={{marginTop:10,fontSize:11.5,color:'#475569',fontWeight:600,display:'flex',flexWrap:'wrap',justifyContent:'space-between',gap:8}}>
      <span>Views shown for {withViews.toLocaleString()} of {total.toLocaleString()} articles. <span title="WordPress.com only exposes view counts for the monthly top 100 posts. Articles below that cutoff show a dash — traffic is real, just not surfaced by the API." style={{textDecoration:'underline dotted',cursor:'help'}}>Why the dashes?</span></span>
      {filtered.length>CAP&&<span>Showing first {CAP} of {filtered.length.toLocaleString()} matches — narrow the search to see more</span>}
    </div>
  </div>;
}

function rateColor(rate,type){
  if(type==='open') return rate>=40?'#16a34a':rate>=25?'#f59e0b':'#ef4444';
  return rate>=4?'#16a34a':rate>=2?'#f59e0b':'#ef4444';
}

function App(){
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [expanded,setExpanded]=useState(null);
  const [search,setSearch]=useState('');
  const [page,setPage]=useState(1);
  const [tab,setTab]=useState('overview');
  const [commonsPosts,setCommonsPosts]=useState(null);
  const [commonsLoading,setCommonsLoading]=useState(true);
  const [newsroomPosts,setNewsroomPosts]=useState(null);
  const [newsroomMeta,setNewsroomMeta]=useState(null);
  const [newsroomLoading,setNewsroomLoading]=useState(true);
  const [newsroomStats,setNewsroomStats]=useState(null);
  const [newsroomStatsError,setNewsroomStatsError]=useState(null);
  const [newsroomStatsLoading,setNewsroomStatsLoading]=useState(true);
  const PER_PAGE=25;

  useEffect(()=>{
    (async()=>{
      try{const r=await fetch(API+'?type=publications');const j=await r.json();setData(j);}catch(e){setData({error:e.message});}
      setLoading(false);
    })();
  },[]);

  useEffect(()=>{
    (async()=>{
      try{
        const r=await fetch(API+'?type=commons');
        const j=await r.json();
        if(j&&Array.isArray(j.posts)&&j.posts.length) setCommonsPosts(j.posts);
        else setCommonsPosts(FALLBACK_POSTS);
      }catch(e){setCommonsPosts(FALLBACK_POSTS);}
      setCommonsLoading(false);
    })();
  },[]);

  useEffect(()=>{
    (async()=>{
      try{
        // WordPress.com REST v1.1 — CORS-enabled, no auth needed for public posts.
        const [postsRes,siteRes]=await Promise.all([
          fetch(`https://public-api.wordpress.com/rest/v1.1/sites/${NEWSROOM_SITE}/posts?number=6&fields=ID,title,URL,excerpt,date,featured_image,author`),
          fetch(`https://public-api.wordpress.com/rest/v1.1/sites/${NEWSROOM_SITE}?fields=name,description,subscribers_count`),
        ]);
        const postsJ=await postsRes.json();
        const siteJ=await siteRes.json();
        const posts=(postsJ.posts||[]).map(p=>({
          id:p.ID,
          title:stripHtml(p.title||''),
          url:(p.URL||'').replace(/^http:/,'https:'),
          excerpt:stripHtml(p.excerpt||'').slice(0,200),
          date:p.date||'',
          image:(p.featured_image||'').replace(/^http:/,'https:'),
          author:p.author&&p.author.name?p.author.name:'',
        }));
        setNewsroomPosts(posts);
        setNewsroomMeta({
          name:siteJ.name||'Maine DOE Newsroom',
          description:siteJ.description||'',
          subscribers:siteJ.subscribers_count||0,
          total:postsJ.found||posts.length,
        });
      }catch(e){setNewsroomPosts([]);}
      setNewsroomLoading(false);
    })();
  },[]);

  useEffect(()=>{
    (async()=>{
      try{
        const r=await fetch(API+'?type=newsroom_stats');
        const j=await r.json();
        if(j.error) setNewsroomStatsError(j.error);
        else setNewsroomStats(j);
      }catch(e){setNewsroomStatsError('Could not load stats');}
      setNewsroomStatsLoading(false);
    })();
  },[]);

  const campaigns=(data&&data.campaigns)||[];
  const s=(data&&data.summary)||{};

  const filtered=useMemo(()=>{
    if(!search)return campaigns;
    const q=search.toLowerCase();
    return campaigns.filter(c=>(c.subject||'').toLowerCase().includes(q)||(c.title||'').toLowerCase().includes(q)||(c.listName||'').toLowerCase().includes(q)||(c.sendDate||'').includes(q));
  },[campaigns,search]);

  const totalPages=Math.ceil(filtered.length/PER_PAGE);
  const paginated=useMemo(()=>filtered.slice((page-1)*PER_PAGE,page*PER_PAGE),[filtered,page]);

  const tabs=[
    {id:'overview',label:'Overview',icon:ic.check,accent:'#8b5cf6'},
    {id:'commons',label:'The Commons',icon:ic.book,accent:'#0d7ba0'},
    {id:'newsroom',label:'Newsroom',icon:ic.news,accent:'#8a2e13'},
    {id:'builder',label:'Newsletter Builder',icon:ic.layers,accent:'#42c3f7'},
    {id:'data',label:'Mailchimp',icon:ic.mail,accent:'#f472b6'},
  ];

  return <div style={{maxWidth:1200,margin:'0 auto',padding:'0 28px 40px',animation:'fadeIn 0.3s ease'}}>

    {/* Hero */}
    <div style={{background:'linear-gradient(135deg,#0c1926,#162d44)',borderRadius:'0 0 20px 20px',padding:32,marginBottom:0,position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',inset:0,pointerEvents:'none',backgroundImage:'linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px)',backgroundSize:'60px 60px'}}/>
      <div style={{position:'relative',zIndex:1}}>
        <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:8}}>
          <div style={{width:48,height:48,borderRadius:14,background:'linear-gradient(135deg,#8b5cf6,#6d28d9)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 16px rgba(139,92,246,0.3)'}}>
            <Sv d={ic.mail} size={24} color="#fff"/>
          </div>
          <div>
            <h1 style={{fontFamily:"'League Spartan',sans-serif",fontSize:24,fontWeight:800,color:'#fff',margin:0,letterSpacing:'.05em',textTransform:'uppercase'}}>Publication</h1>
            <p style={{fontSize:13,color:'#94a3b8',margin:0,fontWeight:500}}>The DOE's outbound content — Commons posts, newsletters, blogs, and campaign performance</p>
          </div>
        </div>
      </div>
    </div>

    {/* Tabs bar */}
    <div style={{display:'flex',gap:8,padding:'20px 0 0',marginBottom:24,borderBottom:`2px solid ${B.border}55`,overflowX:'auto'}}>
      {tabs.map(t=>{
        const a=tab===t.id;
        return <button key={t.id} onClick={()=>setTab(t.id)}
          style={{display:'inline-flex',alignItems:'center',gap:9,padding:'14px 22px',background:'none',border:'none',cursor:'pointer',
            fontFamily:"'League Spartan','DM Sans',sans-serif",
            fontSize:15,fontWeight:a?800:600,color:a?B.navy:B.txtMute,letterSpacing:'.01em',
            borderBottom:a?`3px solid ${t.accent}`:'3px solid transparent',
            marginBottom:-2,whiteSpace:'nowrap',transition:'color .15s'}}
          onMouseEnter={e=>{if(!a)e.currentTarget.style.color=B.txt;}}
          onMouseLeave={e=>{if(!a)e.currentTarget.style.color=B.txtMute;}}>
          <Sv d={t.icon} size={18} color={a?t.accent:B.txtMute}/>
          {t.label}
        </button>;
      })}
    </div>

    {/* ── OVERVIEW TAB ── */}
    {tab==='overview'&&<div style={{animation:'fadeIn 0.3s ease'}}>

      {/* Intro card */}
      <div style={{background:B.wh,borderRadius:16,border:`2px solid ${B.border}55`,padding:'26px 28px',marginBottom:20,boxShadow:'0 2px 12px rgba(0,0,0,0.04)'}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:16,marginBottom:14,flexWrap:'wrap'}}>
          <div style={{width:52,height:52,borderRadius:14,background:'linear-gradient(135deg,#8b5cf6,#6d28d9)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,boxShadow:'0 4px 14px rgba(139,92,246,0.3)'}}>
            <Sv d={ic.check} size={26} color="#fff"/>
          </div>
          <div style={{flex:1,minWidth:280}}>
            <h2 style={{fontSize:22,fontWeight:800,color:B.navy,margin:'0 0 8px',letterSpacing:'.01em'}}>Content and approval</h2>
            <p style={{fontSize:14.5,color:B.txtSec,lineHeight:1.65,fontWeight:500,margin:0}}>
              Guidance for content intended for publicly-facing platforms — social media, website, Newsroom, the Commons, and email blasts. Different publication types have different review paths; the summary below shows where each lives and how it gets out the door.
            </p>
          </div>
        </div>
        <div style={{padding:'14px 20px',borderRadius:10,background:'#fef3c714',border:'1.5px solid #f59e0b30',borderLeft:'4px solid #f59e0b',fontSize:13.5,color:B.txtSec,fontWeight:500,lineHeight:1.6}}>
          <strong style={{color:B.navy}}>Two-week rule.</strong> Submit priority notices, Maine DOE Newsroom articles, and media advisories/releases to the <strong>Communications Workflow at least two weeks</strong> before you want the piece posted or sent.
        </div>
      </div>

      {/* Content ownership */}
      <div style={{background:B.wh,borderRadius:14,border:`2px solid ${B.border}55`,padding:'22px 26px',marginBottom:16}}>
        <h3 style={{fontSize:13,fontWeight:800,color:B.navy,margin:'0 0 12px',textTransform:'uppercase',letterSpacing:'.06em'}}>Content ownership</h3>

          Content posted or contained in priority notices, Newsroom articles, administrative letters, media advisories/releases, social posts, YouTube uploads, or Commons blog posts should be <strong style={{color:B.navy}}>Maine DOE-owned content only</strong> — written, organized, coordinated, planned, and sponsored by the Maine DOE.
        </p>
        <p style={{fontSize:13.5,color:B.txtSec,lineHeight:1.7,fontWeight:500,margin:0}}>
          Other acceptable content: from organizations with a specific partnership, or for initiatives the Maine DOE sponsors or has special involvement in. Content not owned by the Maine DOE is permitted only if fully vetted or if it includes clear disclaimer language.
        </p>
      </div>

      {/* Comms materials at a glance */}
      <div style={{background:B.wh,borderRadius:14,border:`2px solid ${B.border}55`,padding:'22px 26px',marginBottom:16}}>
        <h3 style={{fontSize:13,fontWeight:800,color:B.navy,margin:'0 0 14px',textTransform:'uppercase',letterSpacing:'.06em'}}>Communications materials at a glance</h3>
        {[
          {t:'Priority notice',d:'Targeted message to a specific audience via Mailchimp. Not typically intended for the general public.'},
          {t:'Administrative letter',d:'New/changed laws or regulations. Multi-step review/approval through the Communications Workflow.'},
          {t:'Newsroom article',d:'Professional learning, school highlights, grant opportunities. Our digital newspaper — posted on the Newsroom, included in the weekly Maine DOE Update.'},
          {t:'Blog (The Commons)',d:'Practical, timely content for Maine schools — topic articles, how-tos, program spotlights, resource roundups. Reviewed by your supervisor, then published by Comms. See the Commons tab.'},
          {t:'Newsletter',d:'Team bulletins, updates, and announcements built with the Newsletter Builder — a middle ground between quick email and a Mailchimp campaign. See the Newsletter Builder tab.'},
          {t:'Media advisory',d:'Sent only to press to invite them to cover a specific event. Connect with the Director of Communications.'},
          {t:'Media release',d:'Announcements and news for the press and a larger audience. Connect with the Director of Communications.'},
          {t:'Letter of support',d:'Occasional, case-by-case. Review with your office director and associate/deputy commissioner before writing or signing.'},
          {t:'Maine DOE Update',d:'Weekly Friday newsletter with all Newsroom articles from that week.'},
          {t:'Social media',d:'Facebook, Instagram, LinkedIn. Requires goal, audience, dates, caption, imagery, and (for ads) budget + funding code.'},
        ].map((x,i,arr)=>(
          <div key={i} style={{padding:'12px 0',borderBottom:i<arr.length-1?`1px solid ${B.border}40`:'none'}}>
            <div style={{fontSize:14,fontWeight:800,color:B.navy,marginBottom:3}}>{x.t}</div>
            <div style={{fontSize:12.5,color:B.txtSec,fontWeight:500,lineHeight:1.6}}>{x.d}</div>
          </div>
        ))}
      </div>

      {/* Social media approval checklist */}
      <div style={{background:B.wh,borderRadius:14,border:`2px solid ${B.border}55`,padding:'22px 26px',marginBottom:16}}>
        <h3 style={{fontSize:13,fontWeight:800,color:B.navy,margin:'0 0 8px',textTransform:'uppercase',letterSpacing:'.06em'}}>Social media approval checklist</h3>
        <p style={{fontSize:13,color:B.txtSec,marginBottom:12,fontWeight:500,lineHeight:1.55}}>Before submitting to the team leader/office director and then to Rachel Paling:</p>
        <ul style={{listStyle:'none',padding:0,margin:0}}>
          {['Goal of post and intended audience.','Date or span of dates for promotion.','Post caption (for all posts, if multiple).','Images or graphics appropriate to the content.','Budget and funding code (for advertisements).'].map((it,i)=>(
            <li key={i} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'6px 0',fontSize:13.5,color:B.txtSec,fontWeight:500,lineHeight:1.55}}>
              <Sv d={ic.check} size={16} color="#16a34a" style={{marginTop:2,flexShrink:0}}/>
              <span>{it}</span>
            </li>
          ))}
        </ul>
      </div>

      {/* Official letters */}
      <div style={{background:B.wh,borderRadius:14,border:`2px solid ${B.border}55`,padding:'22px 26px',marginBottom:16}}>
        <h3 style={{fontSize:13,fontWeight:800,color:B.navy,margin:'0 0 10px',textTransform:'uppercase',letterSpacing:'.06em'}}>Official letters</h3>
        <p style={{fontSize:13.5,color:B.txtSec,lineHeight:1.7,fontWeight:500,margin:0}}>
          An official letter from the Maine DOE must be written on Maine DOE letterhead, approved by the team leader/office director, and sent to the Director of Communications for approval before being sent by U.S. post. Letters must be signed by a member of leadership and should include a member of the Commissioner's Office administrative support team.
        </p>
      </div>

      {/* File naming convention */}
      <div style={{background:B.wh,borderRadius:14,border:`2px solid ${B.border}55`,padding:'22px 26px',marginBottom:16}}>
        <h3 style={{fontSize:13,fontWeight:800,color:B.navy,margin:'0 0 10px',textTransform:'uppercase',letterSpacing:'.06em'}}>File naming convention for website uploads</h3>
        <p style={{fontSize:13,color:B.txtSec,lineHeight:1.65,fontWeight:500,marginBottom:12}}>
          When uploading files that will be linked from maine.gov/doe, name your file so it's easy to find, share, and understand out of context:
        </p>
        <code style={{display:'block',background:'#f1f5f9',padding:'12px 14px',borderRadius:8,color:B.navy,fontSize:13,fontWeight:700,marginBottom:14,border:`1px solid ${B.border}60`,fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace'}}>Team/Area - Title of File - Full Date.pdf</code>
        <ul style={{listStyle:'none',padding:0,margin:'0 0 14px'}}>
          {['Spaces between hyphens.','No abbreviations or acronyms (unless universal).','Date with periods between, full year written out, no leading zeros — 6.1.2024 (not 06.01.24 or 6.1.24).','Prioritize using PDFs.'].map((it,i)=>(
            <li key={i} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'5px 0',fontSize:13,color:B.txtSec,fontWeight:500,lineHeight:1.55}}>
              <Sv d={ic.check} size={15} color="#16a34a" style={{marginTop:2,flexShrink:0}}/>
              <span>{it}</span>
            </li>
          ))}
        </ul>
        <div style={{padding:'12px 14px',background:'#f8fafc',borderRadius:8,border:`1px solid ${B.border}45`}}>
          <div style={{fontSize:11,fontWeight:800,color:B.txtMute,letterSpacing:'.06em',textTransform:'uppercase',marginBottom:8}}>Examples</div>
          {[
            'Multilingual Learning - Multilingual Learners with Disabilities Policy Guide - 3.11.2025.pdf',
            'Assessment - Print Disability Flowchart - 3.11.2025.pdf',
            'Outdoor Education - Maine Outdoor Learning Grant Application - 3.11.2025.pdf',
            'MLTI - Sphero Tutorial - 3.11.2025.pdf',
            'School Safety - Restorative Practices Brochure - 3.11.2025.pdf',

          ))}
        </div>
      </div>
    </div>}

    {/* ── COMMONS TAB ── */}
    {tab==='commons'&&<div style={{animation:'fadeIn 0.3s ease'}}>

      {/* Intro / CTA card */}

        <div style={{display:'flex',alignItems:'flex-start',gap:16,marginBottom:18,flexWrap:'wrap'}}>
          <div style={{width:52,height:52,borderRadius:14,background:'linear-gradient(135deg,#0d7ba0,#0891b2)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,boxShadow:'0 4px 14px rgba(13,123,160,0.25)'}}>
            <Sv d={ic.book} size={26} color="#fff"/>
          </div>
          <div style={{flex:1,minWidth:280}}>
            <h2 style={{fontSize:22,fontWeight:800,color:B.navy,margin:'0 0 8px',letterSpacing:'.01em'}}>The Maine DOE Commons</h2>

              The department's blog — the practical, timely content our teams share with Maine schools. Topic articles, how-tos, program spotlights, resource roundups. Content that doesn't fit the newsroom's official-policy or press-release lane, but still deserves a home.
            </p>
          </div>
        </div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',paddingTop:14,borderTop:`1px solid ${B.border}30`}}>

            style={{display:'inline-flex',alignItems:'center',gap:8,padding:'12px 22px',borderRadius:12,background:'linear-gradient(135deg,#0d7ba0,#0891b2)',color:'#fff',textDecoration:'none',fontSize:14,fontWeight:700,boxShadow:'0 4px 14px rgba(13,123,160,0.3)'}}>
            <Sv d={["M12 5v14","M5 12h14"]} size={18} color="#fff"/> Publish to The Commons
          </a>
          <a href={COMMONS_DIRECTIONS_URL} target="_blank" rel="noopener noreferrer"
            style={{display:'inline-flex',alignItems:'center',gap:8,padding:'12px 22px',borderRadius:12,background:B.wh,color:B.navy,textDecoration:'none',fontSize:14,fontWeight:700,border:`2px solid ${B.border}80`}}>
            <Sv d={ic.book} size={16} color={B.navy}/> Read full directions
          </a>
          <a href={COMMONS_HOME_URL} target="_blank" rel="noopener noreferrer"
            style={{display:'inline-flex',alignItems:'center',gap:8,padding:'12px 22px',borderRadius:12,background:'transparent',color:B.txtSec,textDecoration:'none',fontSize:14,fontWeight:600}}>
            View live Commons <Sv d={ic.ext} size={14} color={B.txtSec}/>
          </a>
        </div>
      </div>

      {/* Commons vs Newsroom */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:20}}>
        <div style={{background:B.wh,borderRadius:14,border:`2px solid #0d7ba030`,padding:'20px 22px'}}>
          <div style={{display:'inline-flex',alignItems:'center',gap:8,padding:'4px 10px',borderRadius:20,background:'#0d7ba015',marginBottom:12}}>
            <span style={{width:6,height:6,borderRadius:'50%',background:'#0d7ba0'}}/>
            <span style={{fontSize:10,fontWeight:800,color:'#0d7ba0',textTransform:'uppercase',letterSpacing:'.08em'}}>Use the Commons for</span>
          </div>
          <div style={{fontSize:14,fontWeight:700,color:B.navy,marginBottom:10}}>Practical, reference material</div>
          <ul style={{listStyle:'none',padding:0,margin:0,fontSize:13.5,color:B.txtSec,lineHeight:1.9,fontWeight:500}}>
            <li>• Team-based content for the audience</li>
            <li>• Reviews and spotlights</li>
            <li>• Focus on resources</li>
            <li>• Resource roundups for a topic</li>
            <li>• Interviews / Informational Digests</li>
          </ul>
        </div>
        <div style={{background:B.wh,borderRadius:14,border:`2px solid #8a2e1330`,padding:'20px 22px'}}>
          <div style={{display:'inline-flex',alignItems:'center',gap:8,padding:'4px 10px',borderRadius:20,background:'#8a2e1315',marginBottom:12}}>
            <span style={{width:6,height:6,borderRadius:'50%',background:'#8a2e13'}}/>
            <span style={{fontSize:10,fontWeight:800,color:'#8a2e13',textTransform:'uppercase',letterSpacing:'.08em'}}>Use the Newsroom for</span>
          </div>
          <div style={{fontSize:14,fontWeight:700,color:B.navy,marginBottom:10}}>News and announcements</div>
          <ul style={{listStyle:'none',padding:0,margin:0,fontSize:13.5,color:B.txtSec,lineHeight:1.9,fontWeight:500}}>
            <li>• Press releases and announcements</li>
            <li>• Time-sensitive news</li>
            <li>• Official policy of record</li>
            <li>• Good News</li>
          </ul>
        </div>
      </div>
      <div style={{padding:'14px 20px',borderRadius:12,background:'#0d7ba008',border:'1.5px solid #0d7ba025',marginBottom:24,fontSize:13.5,color:B.txtSec,lineHeight:1.6,fontWeight:500}}>
        <strong style={{color:B.navy}}>Rule of thumb:</strong> if it's news, it goes to the Newsroom. If it's the how-to behind the work, it goes to the Commons.
      </div>

      {/* Featured posts — live feed from The Commons */}
      <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:14,paddingLeft:2}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <h3 style={{fontSize:15,fontWeight:800,color:B.navy,margin:0,textTransform:'uppercase',letterSpacing:'.05em'}}>Latest from The Commons</h3>
          {!commonsLoading&&commonsPosts&&<span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 9px',borderRadius:20,background:'#16a34a15',fontSize:10,fontWeight:800,color:'#16a34a',textTransform:'uppercase',letterSpacing:'.06em'}}>
            <span style={{width:5,height:5,borderRadius:'50%',background:'#16a34a'}}/>Live
          </span>}
        </div>
        <a href={COMMONS_HOME_URL} target="_blank" rel="noopener noreferrer" style={{fontSize:12,fontWeight:700,color:'#0d7ba0',textDecoration:'none'}}>View all →</a>
      </div>
      {commonsLoading?<div style={{display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 20px',gap:12,background:B.wh,borderRadius:14,border:`2px solid ${B.border}55`}}>
        <Sv d={ic.spin} size={20} color="#0d7ba0" style={{animation:'spin 1s linear infinite'}}/>
        <span style={{color:B.txtSec,fontSize:13,fontWeight:600}}>Loading latest posts...</span>
      </div>:<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(320px,1fr))',gap:16}}>
        {(commonsPosts||FALLBACK_POSTS).map((p,i)=>{
          const color=teamColor(p.team);

            style={{background:B.wh,borderRadius:14,border:`2px solid ${B.border}55`,overflow:'hidden',textDecoration:'none',color:'inherit',display:'flex',flexDirection:'column',transition:'transform .15s, box-shadow .15s, border-color .15s'}}

              {hasImage&&<div style={{position:'absolute',inset:0,background:'linear-gradient(to top,rgba(12,25,38,0.55) 0%,rgba(12,25,38,0.15) 45%,transparent 100%)'}}/>}
              <div style={{position:'absolute',bottom:12,left:14,right:14,display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
                <span style={{fontSize:10,fontWeight:800,color:'#fff',textTransform:'uppercase',letterSpacing:'.08em',padding:'4px 10px',borderRadius:20,background:'rgba(12,25,38,0.72)',backdropFilter:'blur(6px)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:'70%'}}>{p.team||'Commons'}</span>

            <div style={{padding:'18px 20px 20px',flex:1,display:'flex',flexDirection:'column'}}>

              <p style={{fontSize:13,color:B.txtSec,lineHeight:1.55,fontWeight:500,margin:'0 0 12px',flex:1}}>{p.excerpt}</p>
              <div style={{fontSize:12,fontWeight:700,color:color,display:'inline-flex',alignItems:'center',gap:5}}>Read on Commons <Sv d={ic.ext} size={12} color={color}/></div>
            </div>
          </a>;
        })}
      </div>}
    </div>}

    {/* ── NEWSROOM TAB ── */}
    {tab==='newsroom'&&<div style={{animation:'fadeIn 0.3s ease'}}>

      {/* Intro card */}
      <div style={{background:B.wh,borderRadius:16,border:`2px solid ${B.border}55`,padding:'26px 28px',marginBottom:20,boxShadow:'0 2px 12px rgba(0,0,0,0.04)'}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:16,marginBottom:14,flexWrap:'wrap'}}>
          <div style={{width:52,height:52,borderRadius:14,background:'linear-gradient(135deg,#8a2e13,#b23a15)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,boxShadow:'0 4px 14px rgba(138,46,19,0.28)'}}>
            <Sv d={ic.news} size={26} color="#fff"/>
          </div>
          <div style={{flex:1,minWidth:280}}>
            <h2 style={{fontSize:22,fontWeight:800,color:B.navy,margin:'0 0 8px',letterSpacing:'.01em'}}>Maine DOE Newsroom</h2>
            <p style={{fontSize:14.5,color:B.txtSec,lineHeight:1.65,fontWeight:500,margin:0}}>
              The department's digital newspaper — professional-learning notices, school and program highlights, grant opportunities, and time-sensitive announcements. Everything published here is bundled into the weekly <strong style={{color:B.navy}}>Maine DOE Update</strong> that goes out every Friday.
            </p>
          </div>
        </div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',paddingTop:14,borderTop:`1px solid ${B.border}30`}}>
          <a href={NEWSROOM_URL} target="_blank" rel="noopener noreferrer"
            style={{display:'inline-flex',alignItems:'center',gap:8,padding:'12px 22px',borderRadius:12,background:'linear-gradient(135deg,#8a2e13,#b23a15)',color:'#fff',textDecoration:'none',fontSize:14,fontWeight:700,boxShadow:'0 4px 14px rgba(138,46,19,0.28)'}}>
            <Sv d={ic.ext} size={16} color="#fff"/> Visit the Newsroom
          </a>
          <a href={NEWSROOM_SUBMIT_URL} target="_blank" rel="noopener noreferrer"
            style={{display:'inline-flex',alignItems:'center',gap:8,padding:'12px 22px',borderRadius:12,background:B.wh,color:B.navy,textDecoration:'none',fontSize:14,fontWeight:700,border:`2px solid ${B.border}80`}}>
            <Sv d={["M12 5v14","M5 12h14"]} size={16} color={B.navy}/> Submit an article
          </a>
        </div>
      </div>

      {/* Stats — real data via WordPress.com Stats API, once OAuth is connected */}
      {newsroomStatsLoading?<div style={{background:B.wh,borderRadius:14,padding:'40px 20px',textAlign:'center',border:`2px solid ${B.border}55`,marginBottom:20,display:'flex',alignItems:'center',justifyContent:'center',gap:12}}>
        <Sv d={ic.spin} size={20} color="#8a2e13" style={{animation:'spin 1s linear infinite'}}/>
        <span style={{color:B.txtSec,fontSize:13,fontWeight:600}}>Loading Newsroom analytics...</span>
      </div>
      :newsroomStatsError?<div style={{background:B.wh,borderRadius:14,border:`2px solid ${B.border}55`,padding:'22px 26px',marginBottom:20,boxShadow:'0 2px 8px rgba(0,0,0,0.04)'}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:14,flexWrap:'wrap'}}>
          <div style={{width:44,height:44,borderRadius:12,background:'#f59e0b18',border:'1.5px solid #f59e0b40',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <Sv d={["M12 9v4","M12 17h.01","M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"]} size={22} color="#a16207"/>
          </div>
          <div style={{flex:1,minWidth:280}}>
            <div style={{fontSize:14,fontWeight:800,color:B.navy,marginBottom:6}}>WordPress.com stats aren't connected yet</div>
            <p style={{fontSize:13,color:B.txtSec,lineHeight:1.65,fontWeight:500,margin:0}}>{newsroomStatsError}</p>
          </div>

      </div>
      :newsroomStats&&<>
        {/* KPI tiles — the four numbers that actually matter */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:14,marginBottom:16}}>
          {[
            {l:'Views today',v:(newsroomStats.summary?.viewsToday||0).toLocaleString(),c:'#8a2e13'},
            {l:'Views · last 7 days',v:(newsroomStats.summary?.views7d||0).toLocaleString(),c:'#b23a15'},
            {l:'Views · last 30 days',v:(newsroomStats.summary?.views30d||0).toLocaleString(),c:'#0d7ba0'},
            {l:'Articles · last 365 days',v:(newsroomStats.summary?.articles365Count||0).toLocaleString(),c:'#16a34a'},
          ].map((m,i)=>(
            <div key={i} style={{background:B.wh,borderRadius:14,padding:'16px 18px',border:`2px solid ${B.border}55`,boxShadow:'0 2px 8px rgba(0,0,0,0.04)'}}>
              <div style={{fontSize:10,color:B.txtMute,textTransform:'uppercase',fontWeight:800,letterSpacing:.5,marginBottom:6,display:'flex',alignItems:'center',gap:5}}>

              </div>
              <div style={{fontSize:22,fontWeight:800,color:B.navy,lineHeight:1.15}}>{m.v}</div>
            </div>
          ))}
        </div>

        {/* Search & browse ALL articles from the last 365 days */}
        <NewsroomArticleSearch posts={newsroomStats.articles||[]}/>

        {/* Top posts + referrers side by side */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(320px,1fr))',gap:14,marginBottom:20}}>
          <div style={{background:B.wh,borderRadius:14,border:`2px solid ${B.border}55`,padding:'18px 20px'}}>
            <h3 style={{fontSize:12,fontWeight:800,color:B.navy,margin:'0 0 12px',textTransform:'uppercase',letterSpacing:'.06em',display:'flex',alignItems:'center',gap:8,justifyContent:'space-between'}}>
              <span>Top articles · last 30 days</span>
              <span style={{fontSize:10,color:B.txtMute,fontWeight:700,letterSpacing:'.04em'}}>Views</span>
            </h3>
            {(newsroomStats.top30||[]).slice(0,7).map((p,i)=>(
              <a key={p.id||i} href={p.url} target="_blank" rel="noopener noreferrer"
                style={{display:'flex',justifyContent:'space-between',gap:12,padding:'9px 0',borderTop:i===0?'none':`1px solid ${B.border}30`,textDecoration:'none',color:'inherit'}}>

            {(newsroomStats.top30||[]).length===0&&<div style={{fontSize:12,color:B.txtMute,fontWeight:500,padding:'8px 0'}}>No data yet for this period.</div>}
          </div>

          <div style={{background:B.wh,borderRadius:14,border:`2px solid ${B.border}55`,padding:'18px 20px'}}>
            <h3 style={{fontSize:12,fontWeight:800,color:B.navy,margin:'0 0 12px',textTransform:'uppercase',letterSpacing:'.06em',display:'flex',alignItems:'center',gap:8,justifyContent:'space-between'}}>
              <span>Top referrers · last 30 days</span>
              <span style={{fontSize:10,color:B.txtMute,fontWeight:700,letterSpacing:'.04em'}}>Visits</span>
            </h3>
            {(newsroomStats.referrers||[]).slice(0,7).map((r,i)=>{
              const inner=<>
                <div style={{minWidth:0,flex:1,fontSize:13,fontWeight:700,color:B.navy,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.name||'(direct)'}</div>
                <div style={{fontSize:13,fontWeight:800,color:'#0d7ba0',fontVariantNumeric:'tabular-nums',flexShrink:0}}>{(r.total||0).toLocaleString()}</div>
              </>;
              return r.url ?
                <a key={i} href={r.url} target="_blank" rel="noopener noreferrer" style={{display:'flex',justifyContent:'space-between',gap:12,padding:'9px 0',borderTop:i===0?'none':`1px solid ${B.border}30`,textDecoration:'none',color:'inherit'}}>{inner}</a>
                : <div key={i} style={{display:'flex',justifyContent:'space-between',gap:12,padding:'9px 0',borderTop:i===0?'none':`1px solid ${B.border}30`}}>{inner}</div>;
            })}
            {(newsroomStats.referrers||[]).length===0&&<div style={{fontSize:12,color:B.txtMute,fontWeight:500,padding:'8px 0'}}>No referrer data yet.</div>}
          </div>
        </div>
      </>}

      {/* Recent posts feed */}
      <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:14,paddingLeft:2}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <h3 style={{fontSize:15,fontWeight:800,color:B.navy,margin:0,textTransform:'uppercase',letterSpacing:'.05em'}}>Latest from the Newsroom</h3>
          {!newsroomLoading&&newsroomPosts&&newsroomPosts.length>0&&<span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 9px',borderRadius:20,background:'#16a34a15',fontSize:10,fontWeight:800,color:'#16a34a',textTransform:'uppercase',letterSpacing:'.06em'}}>
            <span style={{width:5,height:5,borderRadius:'50%',background:'#16a34a'}}/>Live
          </span>}
        </div>
        <a href={NEWSROOM_URL} target="_blank" rel="noopener noreferrer" style={{fontSize:12,fontWeight:700,color:'#8a2e13',textDecoration:'none'}}>View all →</a>
      </div>
      {newsroomLoading?<div style={{display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 20px',gap:12,background:B.wh,borderRadius:14,border:`2px solid ${B.border}55`}}>
        <Sv d={ic.spin} size={20} color="#8a2e13" style={{animation:'spin 1s linear infinite'}}/>
        <span style={{color:B.txtSec,fontSize:13,fontWeight:600}}>Loading latest articles...</span>
      </div>
      :newsroomPosts&&newsroomPosts.length===0?<div style={{padding:'32px 20px',textAlign:'center',background:B.wh,borderRadius:14,border:`1.5px dashed ${B.border}80`}}>
        <Sv d={ic.news} size={32} color={B.txtMute}/>
        <p style={{marginTop:12,fontSize:13,color:B.txtMute,fontWeight:500}}>Could not load Newsroom articles. <a href={NEWSROOM_URL} target="_blank" rel="noopener noreferrer" style={{color:'#8a2e13',fontWeight:700}}>Open the Newsroom directly.</a></p>
      </div>
      :<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(320px,1fr))',gap:16}}>
        {(newsroomPosts||[]).map((p,i)=>{
          const hasImage=!!p.image;
          return <a key={p.id||i} href={p.url} target="_blank" rel="noopener noreferrer"
            style={{background:B.wh,borderRadius:14,border:`2px solid ${B.border}55`,overflow:'hidden',textDecoration:'none',color:'inherit',display:'flex',flexDirection:'column',transition:'transform .15s, box-shadow .15s, border-color .15s'}}
            onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow='0 8px 20px rgba(0,0,0,0.08)';e.currentTarget.style.borderColor='#8a2e1380';}}
            onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='none';e.currentTarget.style.borderColor=B.border+'55';}}>
            <div style={{height:160,background:hasImage?`#0c1926 url("${p.image}") center/cover no-repeat`:`linear-gradient(135deg,#8a2e13,${B.navy})`,position:'relative',overflow:'hidden'}}>
              {!hasImage&&<div style={{position:'absolute',inset:0,backgroundImage:'linear-gradient(rgba(255,255,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.04) 1px,transparent 1px)',backgroundSize:'40px 40px'}}/>}
              {hasImage&&<div style={{position:'absolute',inset:0,background:'linear-gradient(to top,rgba(12,25,38,0.55) 0%,rgba(12,25,38,0.15) 45%,transparent 100%)'}}/>}
              <div style={{position:'absolute',bottom:12,left:14,right:14,display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
                <span style={{fontSize:10,fontWeight:800,color:'#fff',textTransform:'uppercase',letterSpacing:'.08em',padding:'4px 10px',borderRadius:20,background:'rgba(12,25,38,0.72)',backdropFilter:'blur(6px)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:'70%'}}>Newsroom</span>
                {p.date&&<span style={{fontSize:10,fontWeight:700,color:'#e2e8f0',padding:'4px 8px',borderRadius:20,background:'rgba(12,25,38,0.55)',backdropFilter:'blur(6px)',whiteSpace:'nowrap'}}>{fmtDate(p.date)}</span>}
              </div>
            </div>
            <div style={{padding:'18px 20px 20px',flex:1,display:'flex',flexDirection:'column'}}>
              <h4 style={{fontSize:16,fontWeight:800,color:B.navy,margin:'0 0 8px',lineHeight:1.3,letterSpacing:'.005em'}}>{p.title}</h4>
              <p style={{fontSize:13,color:B.txtSec,lineHeight:1.55,fontWeight:500,margin:'0 0 12px',flex:1}}>{p.excerpt}</p>
              <div style={{fontSize:12,fontWeight:700,color:'#8a2e13',display:'inline-flex',alignItems:'center',gap:5}}>Read the article <Sv d={ic.ext} size={12} color="#8a2e13"/></div>
            </div>
          </a>;
        })}
      </div>}
    </div>}

    {/* ── NEWSLETTER BUILDER TAB ── */}
    {tab==='builder'&&<div style={{animation:'fadeIn 0.3s ease'}}>

      {/* Intro / CTA card */}
      <div style={{background:B.wh,borderRadius:16,border:`2px solid ${B.border}55`,padding:'26px 28px',marginBottom:20,boxShadow:'0 2px 12px rgba(0,0,0,0.04)'}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:16,marginBottom:18,flexWrap:'wrap'}}>
          <div style={{width:52,height:52,borderRadius:14,background:`linear-gradient(135deg,${B.teal},${B.tealDark})`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,boxShadow:'0 4px 14px rgba(66,195,247,0.3)'}}>
            <Sv d={ic.layers} size={26} color="#fff"/>
          </div>
          <div style={{flex:1,minWidth:280}}>
            <h2 style={{fontSize:22,fontWeight:800,color:B.navy,margin:'0 0 8px',letterSpacing:'.01em'}}>Newsletter Builder</h2>
            <p style={{fontSize:14.5,color:B.txtSec,lineHeight:1.65,fontWeight:500,margin:0}}>
              A drag-and-drop tool for branded DOE bulletins — the middle ground between a quick email and a Mailchimp campaign. Pick from blocks (news, events, alerts, photo galleries, stats), and publish as a hosted maine.gov page, a PDF, a standalone HTML file, or a short email teaser for Quickmail. No HTML or CSS needed — the branding's baked in.
            </p>
          </div>
        </div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',paddingTop:14,borderTop:`1px solid ${B.border}30`}}>
          <a href={NEWSLETTER_BUILDER_URL} target="_blank" rel="noopener noreferrer"
            style={{display:'inline-flex',alignItems:'center',gap:8,padding:'12px 22px',borderRadius:12,background:`linear-gradient(135deg,${B.teal},${B.tealDark})`,color:'#fff',textDecoration:'none',fontSize:14,fontWeight:700,boxShadow:'0 4px 14px rgba(66,195,247,0.3)'}}>
            <Sv d={ic.ext} size={16} color="#fff"/> Open the builder
          </a>
          <a href={NEWSLETTER_TUTORIAL_URL} target="_blank" rel="noopener noreferrer"
            style={{display:'inline-flex',alignItems:'center',gap:8,padding:'12px 22px',borderRadius:12,background:B.wh,color:B.navy,textDecoration:'none',fontSize:14,fontWeight:700,border:`2px solid ${B.border}80`}}>
            <Sv d={ic.play} size={16} color={B.navy}/> Watch the tutorial
          </a>
          <a href={NEWSLETTER_SAMPLE_URL} target="_blank" rel="noopener noreferrer"
            style={{display:'inline-flex',alignItems:'center',gap:8,padding:'12px 22px',borderRadius:12,background:'transparent',color:B.txtSec,textDecoration:'none',fontSize:14,fontWeight:600}}>
            See a sample newsletter <Sv d={ic.ext} size={14} color={B.txtSec}/>
          </a>
        </div>
      </div>

      {/* What it does */}
      <div style={{background:B.wh,borderRadius:14,border:`2px solid ${B.border}55`,padding:'22px 26px',marginBottom:16}}>
        <h3 style={{fontSize:13,fontWeight:800,color:B.navy,margin:'0 0 14px',textTransform:'uppercase',letterSpacing:'.06em'}}>What it does</h3>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:14}}>
          {[
            {t:'Drag-and-drop blocks',d:'News, Updates, Events, Alerts, Photo Galleries, Tables, Resource Lists, Pull Quotes, Stats, and more — brand and typography baked into every block.'},
            {t:'Multiple output formats',d:'Hosted maine.gov page, PDF, standalone HTML file, paste-into-Drupal-ready markup, and an auto-generated 3-line email teaser for Quickmail.'},
            {t:'Reusable templates',d:'"Mark as important" flags, auto-generated tables of contents, and saved templates so future issues start from your last one.'},
          ].map((f,i)=>(
            <div key={i} style={{padding:'14px 16px',borderRadius:10,background:`${B.teal}08`,border:`1.5px solid ${B.teal}25`}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                <div style={{width:26,height:26,borderRadius:8,background:B.teal,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <Sv d={ic.check} size={14} color="#fff"/>
                </div>
                <div style={{fontSize:13.5,fontWeight:800,color:B.navy}}>{f.t}</div>
              </div>
              <div style={{fontSize:12.5,color:B.txtSec,lineHeight:1.55,fontWeight:500}}>{f.d}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Contact card */}
      <div style={{background:`linear-gradient(135deg,${B.navy},#162d44)`,borderRadius:14,padding:'20px 24px',marginBottom:8,color:'#fff'}}>
        <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
          <div style={{width:40,height:40,borderRadius:12,background:'rgba(255,255,255,0.1)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <Sv d={ic.users} size={20} color={B.teal}/>
          </div>
          <div style={{flex:1,minWidth:260}}>
            <div style={{fontSize:14,fontWeight:800,color:'#fff',marginBottom:3}}>Thinking about using it for your team?</div>
            <div style={{fontSize:13,color:'#94a3b8',lineHeight:1.5,fontWeight:500}}>Send Matt and Rachel a note with the kind of update, who it's for, and roughly how often you'd send. If you've got an example issue, we can turn it straight into a template.</div>
          </div>
          <a href="mailto:matthew.g.leavitt@maine.gov,rachel.paling@maine.gov" style={{display:'inline-flex',alignItems:'center',gap:6,padding:'10px 18px',borderRadius:10,background:B.teal,color:B.navy,textDecoration:'none',fontSize:13,fontWeight:700}}>
            Contact Comms
          </a>
        </div>
      </div>
    </div>}

    {/* ── MAILCHIMP TAB ── */}
    {tab==='data'&&<div style={{animation:'fadeIn 0.3s ease'}}>

      {/* Intro card */}
      <div style={{background:B.wh,borderRadius:16,border:`2px solid ${B.border}55`,padding:'26px 28px',marginBottom:20,boxShadow:'0 2px 12px rgba(0,0,0,0.04)'}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:16,marginBottom:14,flexWrap:'wrap'}}>
          <div style={{width:52,height:52,borderRadius:14,background:'linear-gradient(135deg,#f472b6,#ec4899)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,boxShadow:'0 4px 14px rgba(244,114,182,0.3)'}}>
            <Sv d={ic.mail} size={26} color="#fff"/>
          </div>
          <div style={{flex:1,minWidth:280}}>
            <h2 style={{fontSize:22,fontWeight:800,color:B.navy,margin:'0 0 8px',letterSpacing:'.01em'}}>Mailchimp</h2>
            <p style={{fontSize:14.5,color:B.txtSec,lineHeight:1.65,fontWeight:500,margin:0}}>
              The Maine DOE uses Mailchimp for the department's established newsletters — the weekly Maine DOE Update, priority notices to targeted audiences, and long-running program bulletins with subscriber lists. Send performance for every campaign is below: opens, clicks, and engagement over time.
            </p>
          </div>
        </div>
        <div style={{padding:'12px 18px',borderRadius:10,background:'#0d7ba008',border:'1.5px solid #0d7ba020',fontSize:13,color:B.txtSec,fontWeight:500,lineHeight:1.55}}>
          <strong style={{color:B.navy}}>Thinking of starting a new newsletter?</strong> Talk to Comms first — some newsletters are already established here. For one-off or team bulletins, the <span style={{color:'#0d7ba0',fontWeight:700}}>Newsletter Builder</span> is usually the right home instead.
        </div>
      </div>

      {loading?<div style={{display:'flex',alignItems:'center',justifyContent:'center',padding:'60px 20px',gap:12}}>
        <Sv d={ic.spin} size={22} color={B.teal} style={{animation:'spin 1s linear infinite'}}/><span style={{color:B.txtSec,fontSize:14,fontWeight:600}}>Loading Mailchimp data...</span>
      </div>
      :!data||data.error?<div style={{maxWidth:600,margin:'40px auto',textAlign:'center'}}>
        <Sv d={ic.mail} size={40} color={B.border} style={{marginBottom:12}}/>
        <h2 style={{fontSize:18,fontWeight:700,color:B.navy,marginBottom:8}}>Could not load campaign data</h2>
        <p style={{fontSize:14,color:B.txtMute}}>{data?.error||'Unknown error'}</p>
      </div>
      :<>
        {/* Summary stats */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:20}}>
          {[
            {l:'Campaigns',v:s.totalCampaigns||0,c:B.teal},
            {l:'Total sent',v:(s.totalSent||0).toLocaleString(),c:B.purple},
            {l:'Avg open rate',v:(s.avgOpenRate||0)+'%',c:rateColor(s.avgOpenRate||0,'open')},
            {l:'Avg click rate',v:(s.avgClickRate||0)+'%',c:rateColor(s.avgClickRate||0,'click')},
          ].map((m,i)=>(
            <div key={i} style={{background:B.wh,borderRadius:14,padding:'16px 18px',border:`2px solid ${B.border}55`,boxShadow:'0 2px 8px rgba(0,0,0,0.04)'}}>
              <div style={{fontSize:10,color:B.txtMute,textTransform:'uppercase',fontWeight:700,letterSpacing:.4,marginBottom:6,display:'flex',alignItems:'center',gap:5}}>
                <span style={{width:8,height:8,borderRadius:'50%',background:m.c}}/>{m.l}
              </div>
              <div style={{fontSize:28,fontWeight:800,color:B.navy,lineHeight:1}}>{m.v}</div>
            </div>
          ))}
        </div>

        {/* Search */}
        <div style={{display:'flex',gap:8,marginBottom:16}}>
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 16px',background:B.wh,borderRadius:10,border:`2px solid ${B.border}55`,flex:1}}>
            <Sv d={["M11 3a8 8 0 108 8","M21 21l-4.35-4.35"]} size={16} color={B.txtMute}/>
            <input type="text" placeholder="Search campaigns by subject, title, or date..." value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}} style={{border:'none',outline:'none',flex:1,fontSize:14,color:B.txt,fontWeight:500,background:'transparent',fontFamily:'inherit'}}/>
            {search&&<span onClick={()=>{setSearch('');setPage(1);}} style={{cursor:'pointer'}}><Sv d={ic.x} size={14} color={B.txtMute}/></span>}
          </div>
        </div>

        {/* Campaigns table */}
        <div style={{background:B.wh,borderRadius:14,border:`2px solid ${B.border}55`,overflow:'hidden',boxShadow:'0 2px 12px rgba(0,0,0,0.04)'}}>
          <div style={{padding:'16px 20px',background:B.navy,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <h3 style={{fontSize:15,fontWeight:700,color:B.teal,margin:0}}>Recent campaigns</h3>
            <span style={{fontSize:12,color:'#94a3b8',fontWeight:500}}>{filtered.length} campaign{filtered.length!==1?'s':''}{search&&` matching "${search}"`}{totalPages>1&&` · Page ${page} of ${totalPages}`}</span>
          </div>
          <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
            <thead><tr style={{background:'#e2e8f0',borderBottom:`2px solid ${B.border}80`}}>
              <th style={{padding:'12px 16px',textAlign:'left',fontWeight:800,color:B.navy,fontSize:11,textTransform:'uppercase',letterSpacing:'.06em'}}>Campaign</th>
              <th style={{padding:'12px 16px',textAlign:'left',fontWeight:800,color:B.navy,fontSize:11,textTransform:'uppercase',letterSpacing:'.06em'}}>Sent</th>
              <th style={{padding:'12px 16px',textAlign:'center',fontWeight:800,color:B.navy,fontSize:11,textTransform:'uppercase',letterSpacing:'.06em'}}>Recipients</th>
              <th style={{padding:'12px 16px',textAlign:'center',fontWeight:800,color:B.navy,fontSize:11,textTransform:'uppercase',letterSpacing:'.06em'}}>Open rate</th>
              <th style={{padding:'12px 16px',textAlign:'center',fontWeight:800,color:B.navy,fontSize:11,textTransform:'uppercase',letterSpacing:'.06em'}}>Click rate</th>
              <th style={{padding:'12px 16px',textAlign:'center',fontWeight:800,color:B.navy,fontSize:11,textTransform:'uppercase',letterSpacing:'.06em'}}>Actions</th>
            </tr></thead>
            <tbody>
              {paginated.map((c,i)=>{
                const isExp=expanded===i;
                return <React.Fragment key={c.id}>
                  <tr style={{borderBottom:isExp?'none':`1px solid ${B.border}55`,cursor:'pointer'}}
                    onClick={()=>setExpanded(isExp?null:i)}
                    onMouseEnter={e=>e.currentTarget.style.background=`${B.teal}06`}
                    onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                    <td style={{padding:'14px 16px',maxWidth:300}}>
                      <div style={{fontWeight:600,color:B.txt,marginBottom:2}}>{c.subject||c.title}</div>
                      {c.listName&&<div style={{fontSize:11,color:B.txtMute,fontWeight:500}}>{c.listName}</div>}
                    </td>
                    <td style={{padding:'14px 16px',color:B.txtSec,fontWeight:500,fontSize:12,whiteSpace:'nowrap'}}>{c.sendDate}</td>
                    <td style={{padding:'14px 16px',textAlign:'center',fontWeight:600,color:B.txtSec}}>{c.recipientCount.toLocaleString()}</td>
                    <td style={{padding:'14px 16px',textAlign:'center'}}>
                      <span style={{fontWeight:700,fontSize:14,color:rateColor(c.openRate,'open')}}>{c.openRate}%</span>
                      <div style={{fontSize:10,color:B.txtMute,marginTop:2}}>{c.opensUnique.toLocaleString()} opens</div>
                    </td>
                    <td style={{padding:'14px 16px',textAlign:'center'}}>
                      <span style={{fontWeight:700,fontSize:14,color:rateColor(c.clickRate,'click')}}>{c.clickRate}%</span>
                      <div style={{fontSize:10,color:B.txtMute,marginTop:2}}>{c.clicksUnique.toLocaleString()} clicks</div>
                    </td>
                    <td style={{padding:'14px 16px',textAlign:'center'}}>
                      {c.webViewUrl&&<a href={c.webViewUrl} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()}
                        style={{display:'inline-flex',alignItems:'center',gap:4,padding:'5px 10px',borderRadius:8,border:`2px solid ${B.border}55`,
                          background:B.wh,color:B.teal,textDecoration:'none',fontSize:11,fontWeight:700}}>
                        <Sv d={ic.ext} size={12} color={B.teal}/> View
                      </a>}
                    </td>
                  </tr>
                  {isExp&&<tr style={{borderBottom:`1px solid ${B.border}45`}}>
                    <td colSpan={6} style={{padding:0}}>
                      <div style={{padding:'16px 24px',background:`${B.navy}03`,display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16}}>
                        <div>
                          <div style={{fontSize:10,fontWeight:700,color:B.txtMute,textTransform:'uppercase',letterSpacing:'.04em',marginBottom:6}}>Delivery</div>
                          <div style={{fontSize:13,color:B.txtSec,marginBottom:3}}><strong>{c.recipientCount.toLocaleString()}</strong> sent</div>
                          <div style={{fontSize:12,color:B.txtMute}}>{c.bounces} bounced</div>
                        </div>
                        <div>
                          <div style={{fontSize:10,fontWeight:700,color:B.txtMute,textTransform:'uppercase',letterSpacing:'.04em',marginBottom:6}}>Opens</div>
                          <div style={{fontSize:13,color:B.txtSec,marginBottom:3}}><strong>{c.opensUnique.toLocaleString()}</strong> unique opens</div>
                          <div style={{fontSize:12,color:B.txtMute}}>{c.opensTotal.toLocaleString()} total opens</div>
                        </div>
                        <div>
                          <div style={{fontSize:10,fontWeight:700,color:B.txtMute,textTransform:'uppercase',letterSpacing:'.04em',marginBottom:6}}>Clicks</div>
                          <div style={{fontSize:13,color:B.txtSec,marginBottom:3}}><strong>{c.clicksUnique.toLocaleString()}</strong> unique clicks</div>
                          <div style={{fontSize:12,color:B.txtMute}}>{c.clicksTotal.toLocaleString()} total clicks</div>
                        </div>
                        <div>
                          <div style={{fontSize:10,fontWeight:700,color:B.txtMute,textTransform:'uppercase',letterSpacing:'.04em',marginBottom:6}}>Engagement</div>
                          <div style={{fontSize:13,color:B.txtSec,marginBottom:3}}><strong>{c.unsubscribes}</strong> unsubscribes</div>
                          {c.webViewUrl&&<a href={c.webViewUrl} target="_blank" rel="noopener noreferrer" style={{fontSize:12,color:B.teal,fontWeight:600}}>View email →</a>}
                        </div>
                      </div>
                    </td>
                  </tr>}
                </React.Fragment>;
              })}
              {paginated.length===0&&<tr><td colSpan={6} style={{padding:40,textAlign:'center',color:B.txtMute}}>{search?'No campaigns match your search.':'No campaigns found.'}</td></tr>}
            </tbody>
          </table>
          </div>
          {totalPages>1&&<div style={{padding:'14px 20px',borderTop:`1px solid ${B.border}45`,display:'flex',alignItems:'center',justifyContent:'center',gap:6,flexWrap:'wrap'}}>
            <button onClick={()=>setPage(1)} disabled={page===1}
              style={{padding:'6px 12px',borderRadius:8,border:`1.5px solid ${B.border}55`,background:B.wh,color:page===1?B.border:B.txtSec,fontSize:12,fontWeight:600,cursor:page===1?'default':'pointer'}}>First</button>
            <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1}
              style={{padding:'6px 12px',borderRadius:8,border:`1.5px solid ${B.border}55`,background:B.wh,color:page===1?B.border:B.txtSec,fontSize:12,fontWeight:600,cursor:page===1?'default':'pointer'}}>Prev</button>
            {Array.from({length:Math.min(5,totalPages)},(_,i)=>{
              let p;
              if(totalPages<=5)p=i+1;
              else if(page<=3)p=i+1;
              else if(page>=totalPages-2)p=totalPages-4+i;
              else p=page-2+i;
              return <button key={p} onClick={()=>setPage(p)}
                style={{padding:'6px 12px',borderRadius:8,border:page===p?'none':`1.5px solid ${B.border}55`,
                  background:page===p?B.navy:B.wh,color:page===p?B.teal:B.txtSec,
                  fontSize:12,fontWeight:700,cursor:'pointer',minWidth:36}}>{p}</button>;
            })}
            <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages}
              style={{padding:'6px 12px',borderRadius:8,border:`1.5px solid ${B.border}55`,background:B.wh,color:page===totalPages?B.border:B.txtSec,fontSize:12,fontWeight:600,cursor:page===totalPages?'default':'pointer'}}>Next</button>
            <button onClick={()=>setPage(totalPages)} disabled={page===totalPages}
              style={{padding:'6px 12px',borderRadius:8,border:`1.5px solid ${B.border}55`,background:B.wh,color:page===totalPages?B.border:B.txtSec,fontSize:12,fontWeight:600,cursor:page===totalPages?'default':'pointer'}}>Last</button>
          </div>}
        </div>
      </>}
    </div>}

    <div style={{textAlign:'center',padding:'32px 0 8px',fontSize:12,color:B.txtMute,fontWeight:500}}>Maine Department of Education · Communications Portal</div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>if(window.self!==window.top)document.addEventListener("DOMContentLoaded",function(){var b=document.getElementById("portal-bar");if(b)b.style.display="none";});</script>
</body>
</html>

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',-apple-system,sans-serif;background:#eee6df;color:#182b3c;min-height:100vh}

.portal-bar .crumb{display:flex;align-items:center;gap:8px;flex:1;font-size:13px}
.portal-bar .crumb .current{color:#e2e8f0;font-weight:700}
.ann-msg{white-space:pre-wrap;word-wrap:break-word}
.ann-msg p{margin:0 0 10px 0;line-height:1.65;white-space:normal}
.ann-msg p:last-child{margin-bottom:0}
.ann-msg a{color:#2da8d8;text-decoration:underline;font-weight:600}
.ann-msg a:hover{color:#42c3f7}
.ann-msg strong,.ann-msg b{font-weight:700;color:#182b3c}
.ann-msg em,.ann-msg i{font-style:italic}
.ann-msg ul,.ann-msg ol{padding-left:20px;margin:4px 0 10px 0}
.ann-msg li{margin:2px 0}
.ann-msg h1,.ann-msg h2,.ann-msg h3,.ann-msg h4{margin:8px 0 4px 0;color:#182b3c;font-weight:700}
</style>
</head>
<body>
<div id="portal-bar" class="portal-bar"><div class="me-badge">ME</div><div class="crumb"><span class="current">Communications Portal</span></div></div>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.9/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

const Sv=({d,size=20,color='currentColor',style})=>(
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0,...style}}>
    {Array.isArray(d)?d.map((p,i)=><path key={i} d={p}/>):<path d={d}/>}

);

const ic={
  bell:["M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9","M13.73 21a2 2 0 01-3.46 0"],
  news:["M4 22h16a2 2 0 002-2V4a2 2 0 00-2-2H8a2 2 0 00-2 2v16a2 2 0 01-2 2zm0 0a2 2 0 01-2-2v-9c0-1.1.9-2 2-2h2","M18 14h-8","M15 18h-5","M10 6h8v4h-8V6z"],
  cal:["M19 4H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2z","M16 2v4","M8 2v4","M3 10h18"],
  users:["M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2","M9 11a4 4 0 100-8 4 4 0 000 8z","M23 21v-2a4 4 0 00-3-3.87","M16 3.13a4 4 0 010 7.75"],
  mail:["M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2z","M22 6l-10 7L2 6"],
  phone:["M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"],
  x:["M18 6L6 18","M6 6l12 12"],
  spin:["M12 2v4","M12 18v4","M4.93 4.93l2.83 2.83","M16.24 16.24l2.83 2.83","M2 12h4","M18 12h4"],
  wrench:["M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"],
  star:"M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
  globe:["M12 22a10 10 0 100-20 10 10 0 000 20z","M2 12h20","M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"],
  ext:["M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6","M15 3h6v6","M10 14L21 3"],
  book:["M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z","M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"],
};

const B={navy:'#182b3c',teal:'#42c3f7',wh:'#ffffff',txt:'#182b3c',txtSec:'#334155',txtMute:'#475569',border:'#a8bdd0'};
const API='https://script.google.com/macros/s/AKfycbw98yVhSSYfD2HhJGilZBYYE_dc_R9lY4ZKNxmRRyzHXVvQdVyPkBg_iYXDcAygSkqnTQ/exec';

const tabs=[
  {id:'about',label:'About',icon:ic.book},
  {id:'announcements',label:'Announcements',icon:ic.bell},
  {id:'news',label:'News',icon:ic.news},
  {id:'social',label:'Social',icon:ic.users},
  {id:'calendar',label:'Calendar',icon:ic.cal},
  {id:'contact',label:'Contact',icon:ic.mail},
];

// Collapse redundant whitespace in announcement messages so old plain-text rows
// (\n\n \n\n between paragraphs) don't render as huge gaps. HTML messages pass through.
function normalizeMessage(msg){
  if(!msg) return '';
  // For HTML content: strip empty paragraphs (Teams often sends <p>&nbsp;</p> as spacer)
  if(/<[a-z]/i.test(msg)){
    return msg
      .replace(/<p>\s*(?:&nbsp;|\s|<br\s*\/?>)*\s*<\/p>/gi,'')
      .replace(/<div>\s*(?:&nbsp;|\s|<br\s*\/?>)*\s*<\/div>/gi,'');
  }
  // For plain-text content: collapse any run of newlines+whitespace to at most one blank line
  return msg.replace(/\n\s*\n[\s]*/g,'\n\n').replace(/^\s+|\s+$/g,'');
}

function App(){
  const [tab,setTab]=useState('about');
  const [announcements,setAnnouncements]=useState([]);
  const [loading,setLoading]=useState(true);
  const [expandedAnn,setExpandedAnn]=useState(null);
  const newsRef=useRef(null);
  const goodNewsRef=useRef(null);

  useEffect(()=>{
    (async()=>{
      try{const r=await fetch(API+'?type=announcements');const j=await r.json();if(j.rows)setAnnouncements(j.rows);}catch(e){}
      setLoading(false);
    })();
  },[]);

  // Load Elfsight when news, calendar, or social tab is active
  useEffect(()=>{
    if(tab==='news'||tab==='calendar'||tab==='social'){
      if(!document.querySelector('script[src*="elfsight"]')){
        const s=document.createElement('script');s.src='https://static.elfsight.com/platform/platform.js';s.async=true;document.body.appendChild(s);
      } else {
        // Script already loaded — trigger re-scan for new widget divs
        setTimeout(()=>{
          if(window.eapps&&window.eapps.reinit) window.eapps.reinit();
          else if(window.ElfsightPlatform&&window.ElfsightPlatform.init) window.ElfsightPlatform.init();
        },200);
      }
    }
  },[tab]);

  return <div style={{maxWidth:1100,margin:'0 auto',padding:'0 28px'}}>

    {/* Hero */}
    <div style={{position:'relative',borderRadius:'0 0 20px 20px',overflow:'hidden',minHeight:220,marginBottom:28}}>
      <div style={{position:'absolute',inset:0,
        backgroundImage:'url(https://www.maine.gov/doe/sites/maine.gov.doe/files/bulk/communications/hero-bg.jpg)',
        backgroundSize:'cover',backgroundPosition:'center 40%',filter:'blur(1px) brightness(0.3)',transform:'scale(1.05)'}}/>
      <div style={{position:'absolute',inset:0,background:'linear-gradient(135deg,rgba(12,25,38,0.8),rgba(22,45,68,0.6))'}}/>
      <div style={{position:'absolute',inset:0,pointerEvents:'none',
        backgroundImage:'linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px)',
        backgroundSize:'60px 60px',opacity:.4}}/>
      <div style={{position:'relative',zIndex:1,padding:'44px 36px 36px'}}>
        <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:16}}>

            display:'flex',alignItems:'center',justifyContent:'center',
            boxShadow:'0 8px 32px rgba(66,195,247,0.25)',padding:'10px 24px'}}>
            <img src="https://www.maine.gov/doe/sites/maine.gov.doe/files/bulk/communications/maine-doe-logo.png" alt="Maine DOE" style={{height:48,objectFit:'contain'}}/>
          </div>
          <div>
            <div style={{fontSize:11,fontWeight:700,letterSpacing:'.15em',textTransform:'uppercase',color:'#42c3f7',marginBottom:4,display:'flex',alignItems:'center',gap:8}}>

            <h1 style={{fontSize:'clamp(26px,3vw,34px)',fontWeight:800,color:'#ffffff',lineHeight:1.1,letterSpacing:'-0.02em'}}>
              Communications <span style={{background:'linear-gradient(135deg,#42c3f7,#34d399)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>Portal</span>
            </h1>
          </div>
        </div>
        <p style={{fontSize:14,color:'#cbd5e1',lineHeight:1.7,maxWidth:480,fontWeight:500,marginBottom:16}}>
          Your hub for announcements, news, brand resources, templates, and communications tools.
        </p>
        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
          <a href="https://stateofmaine.sharepoint.com/:o:/r/sites/MaineDOE/Maine%20DOE%20Information%20Library/Maine%20DOE%20Employee%20Handbook?d=w468cf35d92264d3db9d2099ad7a7595b&csf=1&web=1&e=iiNUTi" target="_blank" rel="noopener noreferrer"
            style={{display:'inline-flex',alignItems:'center',gap:8,padding:'10px 22px',borderRadius:10,
              background:'linear-gradient(135deg,#42c3f7,#34d399)',color:'#0c1926',textDecoration:'none',fontSize:13,fontWeight:700,
              boxShadow:'0 4px 16px rgba(66,195,247,0.3)'}}>
            <Sv d={ic.book} size={14} color="#0c1926"/> Staff Handbook
          </a>
        </div>
      </div>
    </div>

    {/* Tab bar */}
    <div style={{display:'flex',gap:6,marginBottom:24}}>
      {tabs.map(t=>{
        const active=tab===t.id;
        return <button key={t.id} onClick={()=>setTab(t.id)}
          style={{display:'flex',alignItems:'center',gap:7,padding:'10px 18px',borderRadius:10,fontSize:13,fontWeight:600,cursor:'pointer',
            border:active?`2px solid ${B.teal}`:'2px solid #c2cdd8',
            background:active?B.navy:B.wh,color:active?B.teal:B.txtSec,
            boxShadow:active?'0 2px 8px rgba(24,43,60,0.2)':'0 1px 3px rgba(0,0,0,0.04)',
            transition:'all 0.15s'}}>
          <Sv d={t.icon} size={15} color={active?B.teal:B.txtMute}/> {t.label}
        </button>;
      })}
    </div>

    {/* Tab content */}
    <div key={tab} style={{animation:'fadeIn 0.3s ease',paddingBottom:40}}>

      {/* ── ABOUT ── */}
      {tab==='about'&&<div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:24}}>
          {/* Vision */}
          <div style={{background:B.wh,borderRadius:14,padding:'24px 26px',border:`2px solid ${B.border}30`,boxShadow:'0 2px 12px rgba(0,0,0,0.04)'}}>
            <h3 style={{fontSize:14,fontWeight:700,color:B.navy,textTransform:'uppercase',letterSpacing:'.05em',marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
              <span style={{width:16,height:2,background:B.teal,borderRadius:1}}/>Our Vision
            </h3>
            <ul style={{listStyle:'none',padding:0,margin:0}}>
              {[
                'A vibrant and respected educator workforce that innovates, leads, and inspires.',
                'Learning environments that are safe and supportive for all.',
                'A pathway to success in school and in life for every student.',
                "Schools that are trusted centers of the community that foster meaningful civic participation and propel Maine's economy.",
                'Schools that foster the potential for all to lead purposeful lives.',
              ].map((v,i)=>(
                <li key={i} style={{fontSize:13,color:B.txtSec,lineHeight:1.65,paddingLeft:20,marginBottom:8,position:'relative',fontWeight:500}}>
                  <span style={{position:'absolute',left:0,top:8,width:6,height:6,borderRadius:'50%',background:B.teal}}/>{v}
                </li>
              ))}
            </ul>
          </div>
          {/* Mission */}
          <div style={{background:B.wh,borderRadius:14,padding:'24px 26px',border:`2px solid ${B.border}30`,boxShadow:'0 2px 12px rgba(0,0,0,0.04)'}}>

              <span style={{width:16,height:2,background:'#34d399',borderRadius:1}}/>Our Mission
            </h3>
            <p style={{fontSize:13,color:B.txtSec,lineHeight:1.65,marginBottom:12,fontWeight:500}}>
              To promote the best learning opportunities for all Maine students by:
            </p>
            <ul style={{listStyle:'none',padding:0,margin:0}}>
              {[
                'Focusing on a whole-student approach.',
                'Encouraging innovation.',
                'Respecting educators.',
                'Providing information, guidance, professional learning, and support to schools and educators.',
                'Providing adequate and equitable school funding and resources.',

                <li key={i} style={{fontSize:13,color:B.txtSec,lineHeight:1.65,paddingLeft:20,marginBottom:8,position:'relative',fontWeight:500}}>
                  <span style={{position:'absolute',left:0,top:8,width:6,height:6,borderRadius:'50%',background:'#34d399'}}/>{v}
                </li>
              ))}
            </ul>
          </div>
        </div>

        {/* Strategic Priorities */}
        <div style={{background:B.wh,borderRadius:14,padding:'24px 26px',border:`2px solid ${B.border}30`,boxShadow:'0 2px 12px rgba(0,0,0,0.04)',marginBottom:24}}>
          <h3 style={{fontSize:14,fontWeight:700,color:B.navy,textTransform:'uppercase',letterSpacing:'.05em',marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
            <span style={{width:16,height:2,background:'#a78bfa',borderRadius:1}}/>Strategic Priorities
          </h3>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            {[
              {caps:'TRUST',prefix:'Inspire',suffix:'in our organization and in our public education system.'},
              {caps:'EDUCATOR WORKFORCE',prefix:'Develop, support, and sustain a robust',suffix:'.'},
              {caps:'EDUCATIONAL EXCELLENCE and EQUITY',prefix:'Promote',suffix:'for all Maine learners.'},
              {caps:'STUDENT and SCHOOL SAFETY, HEALTH, and WELL-BEING',prefix:'Ensure',suffix:'.'},
              {caps:'CULTURE OF INNOVATION and CONTINUOUS IMPROVEMENT',prefix:'Support a',suffix:'.'},
              {caps:'HEALTHY and COLLABORATIVE work environment',prefix:'Build a',suffix:', enhancing the potential of the Maine Department of Education.'},
            ].map((p,i)=>(
              <div key={i} style={{padding:'12px 14px',borderRadius:10,background:'#f8fafc',border:'1px solid #e2e8f0'}}>
                <p style={{fontSize:13,color:B.txtSec,lineHeight:1.55,margin:0,fontWeight:500}}>
                  {p.prefix} <strong style={{color:B.navy,fontWeight:700}}>{p.caps}</strong> {p.suffix}
                </p>
              </div>
            ))}
          </div>
        </div>

        {/* Whole Student Approach */}
        <div style={{background:'linear-gradient(135deg,#0c1926,#162d44)',borderRadius:14,padding:'24px 28px',color:'#fff',marginBottom:24,position:'relative',overflow:'hidden'}}>
          <div style={{position:'absolute',inset:0,pointerEvents:'none',
            backgroundImage:'linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px)',
            backgroundSize:'40px 40px',opacity:.4}}/>
          <div style={{position:'relative',zIndex:1}}>
            <h3 style={{fontSize:14,fontWeight:700,color:B.teal,textTransform:'uppercase',letterSpacing:'.05em',marginBottom:12,display:'flex',alignItems:'center',gap:10}}>
              <span style={{width:16,height:2,background:B.teal,borderRadius:1}}/>Whole Student Approach

            <p style={{fontSize:14,color:'#cbd5e1',lineHeight:1.75,margin:0,fontWeight:500}}>

            </p>
          </div>
        </div>
      </div>}

      {/* ── ANNOUNCEMENTS ── */}
      {tab==='announcements'&&<div>
        {loading?<div style={{padding:40,textAlign:'center'}}><Sv d={ic.spin} size={24} color={B.teal} style={{animation:'spin 1s linear infinite'}}/></div>
        :announcements.length===0?<div style={{background:B.wh,borderRadius:14,padding:40,textAlign:'center',border:`2px solid ${B.border}30`}}>
          <Sv d={ic.bell} size={32} color={B.border} style={{marginBottom:12}}/>
          <p style={{fontSize:15,fontWeight:600,color:B.txtSec}}>No announcements right now</p>
          <p style={{fontSize:13,color:B.txtMute,marginTop:4}}>Check back later for updates from the Communications team.</p>
        </div>
        :<div style={{borderRadius:14,border:`2px solid ${B.border}30`,background:B.wh,overflow:'hidden'}}>
          {announcements.map((a,i)=>{
            const isUrgent=a.priority==='urgent';
            const isImportant=a.priority==='important';
            const accent=isUrgent?'#ef4444':isImportant?'#f59e0b':'#42c3f7';
            const isExp=expandedAnn===i;
            return <div key={i} style={{padding:'18px 22px',borderBottom:i<announcements.length-1?`1px solid ${B.border}55`:'none',
              borderLeft:`4px solid ${accent}`,cursor:'pointer',transition:'background 0.15s',
              background:isExp?`${accent}06`:'transparent'}}
              onClick={()=>setExpandedAnn(isExp?null:i)}
              onMouseEnter={e=>{if(!isExp)e.currentTarget.style.background=`${accent}03`}}
              onMouseLeave={e=>{if(!isExp)e.currentTarget.style.background='transparent'}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:isExp?10:0}}>
                {isUrgent&&<span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:10,background:'#fee2e2',color:'#991b1b',border:'1px solid #fca5a5'}}>URGENT</span>}
                {isImportant&&<span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:10,background:'#fef3c7',color:'#92400e',border:'1px solid #fcd34d'}}>IMPORTANT</span>}

                <span style={{fontSize:11,color:'#94a3b8',fontWeight:500,flexShrink:0}}>{a.date}</span>
                <div style={{width:26,height:26,borderRadius:8,background:isExp?`${accent}18`:`${B.teal}12`,display:'flex',alignItems:'center',justifyContent:'center',transition:'all 0.2s',transform:isExp?'rotate(180deg)':'none'}}>
                  <Sv d={["M6 9l6 6 6-6"]} size={16} color={isExp?accent:B.teal}/>
                </div>
              </div>
              {isExp&&<div className="ann-msg" style={{fontSize:13,color:B.txtSec,fontWeight:500,paddingTop:4}} dangerouslySetInnerHTML={{__html:normalizeMessage(a.message)}}/>}
            </div>;
          })}
        </div>}
      </div>}

      {/* ── NEWS ── */}
      {tab==='news'&&<div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
          <div>
            <h3 style={{fontSize:14,fontWeight:700,color:B.navy,textTransform:'uppercase',letterSpacing:'.05em',marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
              <span style={{width:16,height:2,background:'#42c3f7',borderRadius:1}}/>DOE Newsroom
            </h3>
            <div style={{background:B.wh,borderRadius:14,border:`2px solid ${B.border}30`,padding:20,minHeight:300}}>
              <div className="elfsight-app-643d49ae-6888-4d88-ad4f-6573c67cbd08" data-elfsight-app-lazy></div>
            </div>
          </div>
          <div>
            <h3 style={{fontSize:14,fontWeight:700,color:B.navy,textTransform:'uppercase',letterSpacing:'.05em',marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
              <span style={{width:16,height:2,background:'#34d399',borderRadius:1}}/>Good News
            </h3>
            <div style={{background:B.wh,borderRadius:14,border:`2px solid ${B.border}30`,padding:20,minHeight:300}}>
              <div className="elfsight-app-367e30ae-ddee-464b-81c9-4e97235c4f00" data-elfsight-app-lazy></div>
            </div>
          </div>
        </div>
      </div>}

      {/* ── SOCIAL ── */}

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
          <div>
            <h3 style={{fontSize:14,fontWeight:700,color:B.navy,textTransform:'uppercase',letterSpacing:'.05em',marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
              <span style={{width:16,height:2,background:'#42c3f7',borderRadius:1}}/>Follow us
            </h3>
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              {[
                {name:'Facebook',url:'https://www.facebook.com/MaineDepartmentofEducation1/',color:'#1877f2',

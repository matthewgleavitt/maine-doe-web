<script type="text/babel">
const {useState,useEffect} = React;

const Sv=({d,size=20,color='currentColor',style})=>(
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0,...style}}>
    {Array.isArray(d)?d.map((p,i)=><path key={i} d={p}/>):<path d={d}/>}
  </svg>
);

const ic={
  ext:["M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6","M15 3h6v6","M10 14L21 3"],
  book:["M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z","M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"],
  users:["M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2","M9 11a4 4 0 100-8 4 4 0 000 8z","M23 21v-2a4 4 0 00-3-3.87","M16 3.13a4 4 0 010 7.75"],
  clock:["M12 22a10 10 0 100-20 10 10 0 000 20z","M12 6v6l4 2"],
  star:["M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"],
  play:["M5 3l14 9-14 9V3z"],
  globe:["M12 22a10 10 0 100-20 10 10 0 000 20z","M2 12h20"],
  arrow:["M5 12h14","M12 5l7 7-7 7"],
  mail:["M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2z","M22 6l-10 7L2 6"],
};

const B={navy:'#182b3c',teal:'#42c3f7',green:'#34d399',wh:'#ffffff',txt:'#182b3c',txtSec:'#334155',txtMute:'#475569',border:'#a8bdd0'};

function App(){
  const [widgetLoaded,setWidgetLoaded]=useState(false);

  useEffect(()=>{
    // Load course widget
    const link=document.createElement('link');
    link.rel='stylesheet';link.href='https://engine.maine.gov/course-widget/styles';
    document.head.appendChild(link);
    const script=document.createElement('script');
    script.src='https://engine.maine.gov/course-widget/script';
    script.setAttribute('data-base','https://engine.maine.gov');
    script.setAttribute('data-page-limit','100');
    script.setAttribute('data-columns','3');
    script.setAttribute('data-categories','45,25,59,31,35,60,15,58,10,9');
    script.setAttribute('data-description-length','10000');
    document.body.appendChild(script);
    script.onload=()=>setWidgetLoaded(true);

  return <div style={{maxWidth:1200,margin:'0 auto',padding:'0 28px',animation:'fadeIn 0.3s ease'}}>

    {/* Hero */}
    <div style={{position:'relative',borderRadius:'0 0 20px 20px',overflow:'hidden',minHeight:260,marginBottom:28}}>
      <div style={{position:'absolute',inset:0,
        backgroundImage:'url(https://engine.maine.gov/sites/default/files/2026-03/EnGiNE-Home-Banner.png)',
        backgroundSize:'cover',backgroundPosition:'center',filter:'blur(1px) brightness(0.3)',transform:'scale(1.05)'}}/>
      <div style={{position:'absolute',inset:0,background:'linear-gradient(135deg,rgba(12,25,38,0.85),rgba(22,45,68,0.65))'}}/>
      <div style={{position:'absolute',inset:0,pointerEvents:'none',
        backgroundImage:'linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px)',
        backgroundSize:'60px 60px',opacity:.4}}/>
      <div style={{position:'relative',zIndex:1,padding:'44px 36px 36px'}}>
        <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:16}}>
          <img src="https://engine.maine.gov/themes/custom/cates/engine-logo-white.png" alt="EnGiNE" style={{height:44}}/>
          <div>
            <div style={{fontSize:11,fontWeight:700,letterSpacing:'.15em',textTransform:'uppercase',color:B.teal,marginBottom:4,display:'flex',alignItems:'center',gap:8}}>
              <span style={{width:16,height:2,background:B.teal,borderRadius:1}}/>Engaging Innovation in Education
            </div>
            <h1 style={{fontSize:'clamp(24px,3vw,32px)',fontWeight:800,color:'#ffffff',lineHeight:1.1,letterSpacing:'-0.02em'}}>
              Maine's <span style={{background:`linear-gradient(135deg,${B.teal},${B.green})`,WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>Professional Learning</span> Platform

          </div>
        </div>

        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
          <a href="https://engine.maine.gov" target="_blank" rel="noopener noreferrer"

        <div style={{display:'flex',alignItems:'center',gap:12}}>

          </div>

        </div>

            <h3 style={{fontSize:16,fontWeight:700,color:'#fff',margin:0}}>Request a Course on EnGiNE</h3>
            <p style={{fontSize:12,color:'#94a3b8',margin:0,fontWeight:500}}>Have professional learning content to share?</p>

        <a href="https://forms.office.com/Pages/ResponsePage.aspx?id=q6g_QX0gYkubzeoajy-GTo9TTqa8VhVMnzxeeWJViwtUOElCUThCOVJEM1E2RjlUVUZSMDNYNEU4OS4u" target="_blank" rel="noopener noreferrer"

      Maine Department of Education · EnGiNE · Communications Portal

<script>
/* ============================================================
   EnGiNE / Moodle Course Widget Enhancements
   Waits for widget to fully render, then:
   1) Converts category <select> into clickable buttons
   2) Ensures every card has a "Learn more →" button
   3) Adds pagination (9 per page)
   ============================================================ */

(function () {
  var CARDS_PER_PAGE = 9;
  var currentPage = 1;
  var hasInit = false;

  function waitForWidget() {
    var root = document.querySelector('#moodle-course-widget');
    if (!root) { setTimeout(waitForWidget, 500); return; }
    
    var cards = root.querySelectorAll('article.card');
    var select = root.querySelector('select');
    
    // Need both cards AND the select to be present
    if (cards.length < 2 || !select || !select.options || select.options.length < 2) {
      setTimeout(waitForWidget, 500);
      return;
    }
    
    if (hasInit) return;
    hasInit = true;
    
    console.log('EnGiNE widget ready: ' + cards.length + ' cards, ' + select.options.length + ' categories');
    
    // Small delay to let widget finish any final rendering
    setTimeout(function() { initAll(root, select); }, 600);
  }

  function initAll(root, select) {
    buildCategoryButtons(root, select);
    ensureLearnMoreButtons(root);
    snapshotCards(root);
    applyPagination(root);
    hideShowMore(root);
    
    // Re-apply learn-more on widget re-renders
    var obs = new MutationObserver(function() {
      ensureLearnMoreButtons(root);
      hideShowMore(root);
    });
    obs.observe(root, { childList: true, subtree: true });
  }

  /* ── CATEGORY BUTTONS ── */

  function buildCategoryButtons(root, select) {
    if (document.querySelector('.mw-catbar')) return;
    
    select.style.display = 'none';

    var bar = document.createElement('div');
    bar.className = 'mw-catbar';
    bar.setAttribute('role', 'toolbar');
    bar.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px 0;';

    var filterContainer = document.getElementById('engine-filters');

    Array.from(select.options).forEach(function(opt) {
      var btn = document.createElement('button');
      btn.type = 'button';
      var active = select.value === opt.value;
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      btn.textContent = (opt.textContent || '').trim();
      styleCatBtn(btn, active);

      btn.addEventListener('click', function() {
        select.value = opt.value;
        select.dispatchEvent(new Event('change', { bubbles: true }));
        bar.querySelectorAll('.mw-catbtn').forEach(function(b) {
          b.setAttribute('aria-pressed', 'false');
          styleCatBtn(b, false);
        });
        btn.setAttribute('aria-pressed', 'true');
        styleCatBtn(btn, true);
        currentPage = 1;
        // Wait for widget to re-render after filter change, then re-snapshot and paginate
        setTimeout(function() { snapshotCards(root); applyPagination(root); }, 400);
      });

      bar.appendChild(btn);
    });

    if (filterContainer) {
      filterContainer.innerHTML = '';
      filterContainer.appendChild(bar);
    } else {
      select.parentNode.insertBefore(bar, select);
    }
  }

  function styleCatBtn(btn, isActive) {
    btn.className = 'mw-catbtn';
    btn.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;padding:9px 12px;border-radius:8px;border:1px solid rgba(0,0,0,.12);cursor:pointer;white-space:nowrap;line-height:1;font-weight:700;font-family:DM Sans,sans-serif;font-size:13px;box-shadow:0 6px 14px rgba(0,0,0,.10);transition:transform .12s ease,box-shadow .12s ease;';
    if (isActive) {
      btn.style.background = '#162c40';
      btn.style.color = '#ffffff';
      btn.style.borderColor = 'rgba(0,0,0,.18)';
    } else {
      btn.style.background = '#42c3f7';
      btn.style.color = '#0b1f2a';
    }
    btn.onmouseenter = function() { btn.style.transform='translateY(-1px)'; btn.style.boxShadow='0 10px 22px rgba(0,0,0,.14)'; };
    btn.onmouseleave = function() { btn.style.transform='translateY(0)'; btn.style.boxShadow='0 6px 14px rgba(0,0,0,.10)'; };
  }

  /* ── LEARN MORE BUTTONS ── */

  function ensureLearnMoreButtons(root) {
    var cards = root.querySelectorAll('article.card');
    for (var i = 0; i < cards.length; i++) {
      upsertLearnMore(cards[i]);
    }
  }

  function upsertLearnMore(card) {
    var body = card.querySelector('.body');
    if (!body) return;
    
    var href = null;
    var hero = card.querySelector('a.hero[href]');
    if (hero) href = hero.href;
    if (!href) { var tl = card.querySelector('.title a[href]'); if (tl) href = tl.href; }
    if (!href) { var any = card.querySelector('a[href]'); if (any) href = any.href; }
    if (!href) return;

    // If learn-more got stuck inside clamped desc, move it out
    var inDesc = body.querySelector('.desc a.learn-more');
    if (inDesc) { inDesc.remove(); body.appendChild(inDesc); }

    var lm = body.querySelector(':scope > a.learn-more');
    if (!lm) {
      var anyLm = card.querySelector('a.learn-more');
      if (anyLm) { anyLm.remove(); body.appendChild(anyLm); lm = anyLm; }
    }
    if (!lm) {
      lm = document.createElement('a');
      lm.className = 'learn-more';
      lm.href = href;
      lm.target = '_blank';
      lm.rel = 'noopener';
      lm.textContent = 'Learn more \u2192';
      body.appendChild(lm);
    } else {
      if (!lm.getAttribute('href')) lm.href = href;
      if (!lm.textContent || !lm.textContent.trim()) lm.textContent = 'Learn more \u2192';
    }
  }

  /* ── PAGINATION ── */

  var allValidCards = []; // snapshot of all valid cards

  function snapshotCards(root) {
    var cards = root.querySelectorAll('article.card');
    allValidCards = [];
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].querySelector('a[href*="id=120"]')) continue;
      allValidCards.push(cards[i]);
    }
    console.log('EnGiNE: Snapshotted ' + allValidCards.length + ' cards');
  }

  function applyPagination(root) {
    // Step 1: Remove our pagination hiding
    for (var i = 0; i < allValidCards.length; i++) {
      if (allValidCards[i].dataset.pgHide === '1') {
        allValidCards[i].style.removeProperty('display');
        allValidCards[i].dataset.pgHide = '';
      }
    }

    // Step 2: Force browser reflow
    void root.offsetHeight;

    // Step 3: Find cards visible after widget filtering
    var activeCards = [];
    for (var j = 0; j < allValidCards.length; j++) {
      if (allValidCards[j].offsetParent !== null) {
        activeCards.push(allValidCards[j]);
      }
    }

    var totalPages = Math.ceil(activeCards.length / CARDS_PER_PAGE);
    if (currentPage > totalPages) currentPage = totalPages || 1;

    var start = (currentPage - 1) * CARDS_PER_PAGE;
    var end = start + CARDS_PER_PAGE;

    // Step 4: Hide cards outside current page
    for (var k = 0; k < activeCards.length; k++) {
      if (k >= start && k < end) {
        activeCards[k].style.removeProperty('display');
      } else {
        activeCards[k].style.setProperty('display', 'none', 'important');
        activeCards[k].dataset.pgHide = '1';
      }
    }

    // Step 5: Build pagination UI
    var pagDiv = document.getElementById('engine-pagination');
    if (!pagDiv) return;
    if (totalPages <= 1) { pagDiv.innerHTML = ''; return; }

    var html = '<button class="engine-page-btn"' + (currentPage===1?' disabled':'') + ' data-p="prev">Prev</button>';
    for (var p = 1; p <= totalPages; p++) {
      html += '<button class="engine-page-btn' + (p===currentPage?' active':'') + '" data-p="' + p + '">' + p + '</button>';
    }
    html += '<button class="engine-page-btn"' + (currentPage===totalPages?' disabled':'') + ' data-p="next">Next</button>';
    pagDiv.innerHTML = html;

    console.log('EnGiNE pagination: page ' + currentPage + '/' + totalPages + ', showing ' + Math.min(end, activeCards.length) + ' of ' + activeCards.length);
  }

  // Click handler via delegation on document (survives innerHTML replacement)
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('.engine-page-btn');
    if (!btn || btn.disabled) return;
    e.preventDefault();
    var val = btn.getAttribute('data-p');
    if (val === 'prev') currentPage = Math.max(1, currentPage - 1);
    else if (val === 'next') currentPage = currentPage + 1;
    else currentPage = parseInt(val);
    var root = document.querySelector('#moodle-course-widget');
    if (root) applyPagination(root);
  });

  /* ── HIDE SHOW MORE ── */

  function hideShowMore(root) {
    var btn = root.querySelector('button.show-more');
    if (btn) btn.style.display = 'none';
  }

  /* ── START ── */
  waitForWidget();
})();
</script>
<script>if(window.self!==window.top)document.addEventListener("DOMContentLoaded",function(){var b=document.getElementById("portal-bar");if(b)b.style.display="none";});</script>

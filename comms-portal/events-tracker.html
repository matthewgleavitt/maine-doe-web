// ---- Layout components ----
function Card({children,style,pad=24}){
  return <div style={{background:B.wh,borderRadius:14,border:`1px solid ${B.rule}`,padding:pad,boxShadow:'0 2px 4px rgba(24,43,60,0.04)',...style}}>{children}</div>;
}
// Each section is a bounded card rather than a heading over loose fields. The
// old version separated sections with a 13%-opacity hairline, which at a
// glance left the whole form reading as one undifferentiated column of pale
// boxes with no sense of where one group ended and the next began.
function Section({label,icon,children}){
  return <div style={{marginBottom:24,background:B.wh,border:`1.5px solid ${B.border}`,borderRadius:12,overflow:'hidden'}}>
    <div style={{display:'flex',alignItems:'center',gap:10,padding:'13px 20px',background:B.navy,borderBottom:`3px solid ${B.teal}`}}>
      {icon&&<Sv d={icon} size={16} c={B.teal}/>}
      <h3 style={{fontFamily:'League Spartan',fontWeight:800,fontSize:13,letterSpacing:'.1em',textTransform:'uppercase',color:B.wh,margin:0}}>{label}</h3>
    </div>
    {/* Trailing -18px absorbs the last Field's own bottom margin so the
        section padding stays even top and bottom. */}
    <div style={{padding:'20px 20px 2px'}}>{children}</div>
  </div>;
}
// No bottom margin here any more: the Fields inside carry their own, so a Row
// adding its own on top produced uneven gaps between rows and single fields.
function Row({children,cols,gap=16}){
  return <div style={{display:'grid',gridTemplateColumns:cols||'1fr',gap}}>{children}</div>;
}
// Longest title that still fits three lines in the 303px card title column
// at 21px / 25.2px line-height. Measured against the live calendar rather
// than estimated; 12 of 127 existing events are over it.
const TITLE_MAX=85;

// Minimum description length. Chosen against the 127 events already on the
// calendar: the median is 484 characters and the 5th percentile is 126, so
// 120 rejects only the 5 that are genuinely one-liners ("Writing and
// monitoring measurable goals", 39 characters) without pressing on anyone
// writing a real description.
const DESC_MIN=120;

// Every field carries its own bottom margin. Previously only Row did, so a
// Field placed directly between Rows — Program / initiative above Intended
// audience, for one — sat flush against the next label with no gap at all.
function Field({label,required,hint,error,children}){
  return <div style={{marginBottom:18}}>
    {label&&<label style={{display:'block',fontSize:11,fontWeight:700,color:B.navy,marginBottom:6,textTransform:'uppercase',letterSpacing:'.06em'}}>{label}{required&&<span style={{color:B.rust,marginLeft:3}}>*</span>}</label>}
    {children}
    {hint&&<div style={{fontSize:11.5,color:B.ink3,marginTop:6,fontWeight:500,lineHeight:1.45}}>{hint}</div>}
    {error&&<div style={{fontSize:11.5,color:B.rust,marginTop:6,fontWeight:600}}>{error}</div>}
  </div>;
}
// Border was B.border at 50 hex alpha (~31%), which left every input reading
// as a pale floating box rather than a bounded field.
const inputSty={width:'100%',padding:'11px 14px',borderRadius:8,border:`1.5px solid ${B.border}`,fontSize:14,fontFamily:'inherit',color:B.ink,outline:'none',background:B.wh,transition:'border-color .15s,box-shadow .15s'};
function Text({value,onChange,placeholder,type,max}){
  return <input type={type||'text'} value={value||''} onChange={e=>onChange(e.target.value)} placeholder={placeholder} maxLength={max}
    style={inputSty} onFocus={e=>e.currentTarget.style.borderColor=B.teal} onBlur={e=>e.currentTarget.style.borderColor=`${B.border}50`}/>;
}
function TextArea({value,onChange,placeholder,rows=3}){
  return <textarea value={value||''} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={rows}
    style={{...inputSty,resize:'vertical',minHeight:60}} onFocus={e=>e.currentTarget.style.borderColor=B.teal} onBlur={e=>e.currentTarget.style.borderColor=`${B.border}50`}/>;
}
function Sel({value,onChange,options,placeholder}){
  return <select value={value||''} onChange={e=>onChange(e.target.value)} style={{...inputSty,cursor:'pointer'}}>
    <option value="">{placeholder||'Select...'}</option>
    {options.map(o=><option key={o} value={o}>{o}</option>)}
  </select>;
}

// Pick an existing value or type a new one. A plain <select> could only offer
// what was hardcoded, so a program that existed in the sheet but not in the
// array was unreachable from the form — which is how Green Schools and Early
// Childhood Special Education could only be attached by editing rows by hand.
// Typing a new one here puts it in the sheet, and the next mirror refresh
// makes it a suggestion for everyone else.
function Combo({value,onChange,options,placeholder,listId}){
  return <>
    <input list={listId} value={value||''} onChange={e=>onChange(e.target.value)}
      placeholder={placeholder} style={inputSty}
      onFocus={e=>e.currentTarget.style.borderColor=B.teal}
      onBlur={e=>e.currentTarget.style.borderColor=B.border}/>
    <datalist id={listId}>{options.map(o=><option key={o} value={o}/>)}</datalist>
  </>;
}

// Distinct values in use on the calendar, written by the refresh workflow
// alongside calendar.json. Falls back to the constants below if unreachable.
const LISTS_URL='https://raw.githubusercontent.com/matthewgleavitt/maine-doe-web/main/data/lists.json';
function Check({value,onChange,label,hint}){
  return <label style={{display:'flex',alignItems:'flex-start',gap:10,cursor:'pointer',padding:'8px 12px',borderRadius:8,background:value?B.tealTint:'transparent',border:`1px solid ${value?B.teal+'40':B.rule}`}}>
    <input type="checkbox" checked={!!value} onChange={e=>onChange(e.target.checked)} style={{marginTop:2,cursor:'pointer',accentColor:B.tealInk}}/>
    <div>
      <div style={{fontSize:13,fontWeight:600,color:B.ink}}>{label}</div>
      {hint&&<div style={{fontSize:11,color:B.ink3,marginTop:3}}>{hint}</div>}
    </div>
  </label>;
}
function BtnGroup({value,onChange,options}){
  return <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
    {options.map(o=>{
      const sel=value===o;
      return <button key={o} type="button" onClick={()=>onChange(o)} style={{padding:'8px 14px',borderRadius:8,border:`1px solid ${sel?B.tealInk:B.border+'60'}`,background:sel?B.tealInk:B.wh,color:sel?B.wh:B.ink2,fontFamily:'inherit',fontWeight:sel?700:500,fontSize:13,cursor:'pointer'}}>{o}</button>;
    })}
  </div>;
}
function Btn({onClick,children,variant='primary',size='md',disabled,icon,style,type='button'}){
  const base={fontFamily:'inherit',fontWeight:700,fontSize:size==='sm'?12:14,padding:size==='sm'?'8px 14px':'12px 20px',borderRadius:8,cursor:disabled?'not-allowed':'pointer',border:'none',display:'inline-flex',alignItems:'center',gap:8,letterSpacing:'.03em',opacity:disabled?0.5:1,transition:'all .15s'};
  const v={primary:{background:B.navy,color:B.wh},teal:{background:B.tealInk,color:B.wh},ghost:{background:'transparent',color:B.ink2,border:`1px solid ${B.border}60`},danger:{background:B.rust,color:B.wh},success:{background:B.green,color:B.wh}};
  return <button type={type} onClick={onClick} disabled={disabled} style={{...base,...v[variant],...style}}>{icon&&<Sv d={icon} size={14}/>}{children}</button>;
}
function Callout({tone='info',children,title}){
  const tones={info:{bg:B.tealTint,br:B.tealInk,c:B.navy},warn:{bg:'#fef3c7',br:'#d97706',c:'#78350f'},err:{bg:'#fee2e2',br:B.rust,c:'#7f1d1d'},ok:{bg:'#d1fae5',br:B.green,c:'#065f46'}};
  const t=tones[tone];
  return <div style={{background:t.bg,borderLeft:`3px solid ${t.br}`,padding:'12px 14px',borderRadius:6,color:t.c,fontSize:13,lineHeight:1.5,margin:'12px 0'}}>
    {title&&<div style={{fontWeight:700,marginBottom:4}}>{title}</div>}
    {children}
  </div>;
}
function Modal({open,onClose,title,children,wide}){
  if(!open) return null;
  return <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:'fixed',inset:0,background:'rgba(10,21,32,0.7)',backdropFilter:'blur(3px)',zIndex:100,display:'flex',alignItems:'center',justifyContent:'center',padding:20,animation:'fadeIn .2s'}}>
    <div style={{background:B.wh,borderRadius:14,maxWidth:wide?1080:640,width:'100%',maxHeight:'92vh',overflowY:'auto',position:'relative',boxShadow:'0 30px 80px rgba(0,0,0,0.4)'}}>
      <div style={{position:'sticky',top:0,background:B.wh,borderBottom:`1px solid ${B.rule}`,padding:'18px 24px',display:'flex',justifyContent:'space-between',alignItems:'center',zIndex:1}}>
        <h2 style={{fontFamily:'League Spartan',fontSize:22,fontWeight:800,margin:0,color:B.navy}}>{title}</h2>
        <button onClick={onClose} style={{background:'transparent',border:0,cursor:'pointer',padding:8,borderRadius:6,color:B.ink3}}><Sv d={ic.x} size={20}/></button>
      </div>
      <div style={{padding:'20px 24px 24px'}}>{children}</div>
    </div>
  </div>;
}

// ---- Quill wrapper ----
function QuillEditor({value,onChange}){
  const holder=useRef(null);
  const quill=useRef(null);
  useEffect(()=>{
    if(!holder.current||quill.current) return;
    quill.current=new Quill(holder.current,{
      theme:'snow',
      placeholder:'Write this as an invitation, not a label. Two or three sentences: what the session covers, who it is for, and what someone walks away able to do. "Join us to explore how Maine schools are using CSTAG to assess and manage threats. We will work through real scenarios and you will leave with a framework your team can apply immediately."',
      modules:{toolbar:[['bold','italic','underline'],[{'list':'ordered'},{'list':'bullet'}],['link'],['clean']]}
    });
    if(value) quill.current.clipboard.dangerouslyPasteHTML(value);
    quill.current.on('text-change',()=>{
      const html=quill.current.root.innerHTML;
      onChange(html==='<p><br></p>'?'':html);
    });
  },[]);
  useEffect(()=>{
    if(!quill.current) return;
    const cur=quill.current.root.innerHTML;
    const norm=v=>(v||'').replace(/\s+/g,'').replace('<p><br></p>','');
    if(norm(cur)!==norm(value||'')) quill.current.clipboard.dangerouslyPasteHTML(value||'');
  },[value]);
  return <div style={{background:B.wh}}><div ref={holder}/></div>;
}

// ---- Utils ----
// Program / Initiative options — extend as new sub-programs come online.
// Optional field: when set, calendar widgets can filter to just this program.
// Hardcoded, so it drifts from the sheet the moment anyone renames or adds a
// program there. It had gone stale exactly that way: it still offered
// "Behavioral Threat Assessment & Management" after that was renamed to BTAM
// in the sheet, so picking it would have re-split the merged data, and it was
// missing Early Childhood Special Education entirely. Keep it in step with
// the programInitiative values on the live calendar feed.
const PROGRAMS=['BTAM','Early Childhood Special Education','McKinney-Vento'];
const EMPTY={
  contactName:'',contactEmail:'',
  focusArea:'',programInitiative:'',eventType:'',title:'',intendedAudience:'',
  description:'',
  startDate:'',endDate:'',startTime:'',endTime:'',allDay:false,
  locationType:'',venueName:'',venueAddress:'',
  registerUrl:'',registerText:'Register',
  contactHours:false,approved:false,
  // Recurrence
  isRecurring:false,recurFreq:'weekly',recurWeeklyDays:[],recurMonthlyMode:'weekday',recurMonthlyOrdinal:'1st',recurMonthlyWeekday:'Monday',recurMonthlyDay:'1',recurEnd:'',exceptions:[],
  // Additional dates
  hasAdditionalDates:false,additionalDates:[],
};

function autoTeaser(html,max=180){
  const t=(html||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  if(t.length<=max) return t;
  const cut=t.slice(0,max).replace(/\s+\S*$/,'');
  return cut+'...';
}
function to12h(t){
  if(!t) return '';
  const [H,M]=t.split(':').map(Number);
  const ap=H>=12?'PM':'AM';
  const h=(H%12)||12;
  return `${h}:${String(M).padStart(2,'0')} ${ap}`;
}
function from12h(t){
  if(!t) return '';
  const m=String(t).trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
  if(!m) return '';
  let H=parseInt(m[1],10);
  if((m[3]||'').toUpperCase()==='PM'&&H<12) H+=12;
  if((m[3]||'').toUpperCase()==='AM'&&H===12) H=0;
  return `${String(H).padStart(2,'0')}:${m[2]}`;
}
function buildRecurrencePattern(form){
  if(!form.isRecurring) return '';
  if(form.recurFreq==='weekly'){
    return 'weekly:'+form.recurWeeklyDays.map(d=>d.toLowerCase()).join(',');
  }
  if(form.recurFreq==='monthly-weekday'){
    return `monthly:${form.recurMonthlyOrdinal.toLowerCase()}-${form.recurMonthlyWeekday.toLowerCase()}`;
  }
  if(form.recurFreq==='monthly-date'){
    return `monthly:${form.recurMonthlyDay}`;
  }
  if(form.recurFreq==='daily'){
    return 'daily';
  }
  return '';
}
function serialize(form){
  return {
    'Contact Name':form.contactName,'Contact Email':form.contactEmail,
    'Focus Area':form.focusArea,'Program / Initiative':form.programInitiative||'','Type':form.eventType,'Title':form.title,
    'Intended Audience':form.intendedAudience,
    'Description':form.description,'Description Teaser':autoTeaser(form.description),
    'Start Date':form.startDate,'End Date':form.endDate||form.startDate,
    'Start Time':to12h(form.startTime),'End Time':to12h(form.endTime),
    'All Day':form.allDay?'Yes':'No',
    'Location Type':form.locationType,'Venue Name':form.venueName,'Venue Address':form.venueAddress,
    'Register URL':form.registerUrl,'Register Text':form.registerText||'Register',
    'Contact Hours':form.contactHours?'Yes':'No',
    'Recurrence Pattern':buildRecurrencePattern(form),'Recurrence End':form.recurEnd,
    'Exceptions':(form.exceptions||[]).join(','),
    'Additional Dates':form.hasAdditionalDates&&form.additionalDates.length?JSON.stringify(form.additionalDates):'',
  };
}
function deserialize(rec){
  const pat=(rec['Recurrence Pattern']||'').toLowerCase().trim();
  const f={...EMPTY};
  f.contactName=rec['Contact Name']||'';f.contactEmail=rec['Contact Email']||'';
  f.focusArea=rec['Focus Area']||'';f.programInitiative=rec['Program / Initiative']||'';f.eventType=rec['Type']||'';f.title=rec['Title']||'';
  f.intendedAudience=rec['Intended Audience']||'';
  f.description=rec['Description']||'';
  f.startDate=(rec['Start Date']||'').substring(0,10);f.endDate=(rec['End Date']||'').substring(0,10);
  f.startTime=from12h(rec['Start Time']);f.endTime=from12h(rec['End Time']);
  f.allDay=(rec['All Day']||'').toString().toLowerCase()==='yes';
  f.locationType=rec['Location Type']||'';f.venueName=rec['Venue Name']||'';f.venueAddress=rec['Venue Address']||'';
  f.registerUrl=rec['Register URL']||'';f.registerText=rec['Register Text']||'Register';
  f.contactHours=(rec['Contact Hours']||'').toString().toLowerCase()==='yes';
  if(pat){
    f.isRecurring=true;
    if(pat==='daily'){f.recurFreq='daily'}
    else if(pat.startsWith('weekly:')){f.recurFreq='weekly';f.recurWeeklyDays=pat.slice(7).split(',').map(d=>d.charAt(0).toUpperCase()+d.slice(1))}
    else if(pat.startsWith('monthly:')){
      const spec=pat.slice(8);
      if(/^\d+$/.test(spec)){f.recurFreq='monthly-date';f.recurMonthlyDay=spec}
      else{const [ord,dow]=spec.split('-');f.recurFreq='monthly-weekday';f.recurMonthlyOrdinal=ord.charAt(0).toUpperCase()+ord.slice(1);f.recurMonthlyWeekday=dow.charAt(0).toUpperCase()+dow.slice(1)}
    }
    f.recurEnd=(rec['Recurrence End']||'').substring(0,10);
    f.exceptions=(rec['Exceptions']||'').split(',').map(x=>x.trim()).filter(Boolean);
  }
  const adds=rec['Additional Dates'];
  if(adds){try{const arr=JSON.parse(adds);if(Array.isArray(arr)&&arr.length){f.hasAdditionalDates=true;f.additionalDates=arr}}catch(e){}}
  return f;
}

function EventForm({form,setForm,onSubmit,onDelete,editing,submitting,busy,draftSavedAt,onSaveDraft}){
  const [saveFlash,setSaveFlash]=useState(null); // {tone:'ok'|'err', text} — flashes for ~3s after clicking Save draft
  // Programs in use on the live calendar. Seeded with the hardcoded list so
  // the field works offline or if the CDN is unreachable, then replaced with
  // whatever is actually in the sheet.
  const [programOpts,setProgramOpts]=useState(PROGRAMS);
  useEffect(()=>{
    (async()=>{
      try{
        const r=await fetch(LISTS_URL,{cache:'no-cache'});
        if(!r.ok) return;
        const j=await r.json();
        if(Array.isArray(j.programs)&&j.programs.length) setProgramOpts(j.programs);
      }catch(e){ /* keep the seeded list */ }
    })();
  },[]);
  const uf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const err=useMemo(()=>{
    const e={};
    if(!form.contactName) e.contactName='Required';
    if(!form.contactEmail||!/^[\w.+-]+@[\w.-]+\.\w+$/.test(form.contactEmail)) e.contactEmail='Valid email required';
    if(!form.focusArea) e.focusArea='Required';
    if(!form.eventType) e.eventType='Required';
    if(!form.title) e.title='Required';
    if(!form.intendedAudience) e.intendedAudience='Required';
    const descText=(form.description||'').replace(/<[^>]+>/g,'').trim();
    if(!descText) e.description='Required';
    // A floor, not a target. "Bring MTSS questions or topics for discussion"
    // is 45 characters and tells a reader nothing about whether to attend.
    // DESC_MIN is roughly two sentences and clears every genuine description
    // already on the calendar.
    else if(descText.length<DESC_MIN) e.description=`Give people a reason to attend: what the session covers, who it is for, and what they will leave with. ${descText.length} of ${DESC_MIN} characters minimum.`;
    else if(descText.length>5000) e.description=`Please keep descriptions under 5,000 characters (currently ${descText.length.toLocaleString()}).`;
    if(!form.startDate) e.startDate='Required';
    if(!form.startTime) e.startTime='Required';
    if(!form.endTime) e.endTime='Required';
    if(!form.locationType) e.locationType='Required';
    if((form.locationType==='In-Person'||form.locationType==='Hybrid')&&!form.venueAddress) e.venueAddress='Address required for in-person';
    if(!form.registerUrl) e.registerUrl='Required';
    if(!form.approved&&!editing) e.approved='Approval confirmation required';
    return e;
  },[form,editing]);

          <Field label="Contact email" required error={err.contactEmail}><Text value={form.contactEmail} onChange={v=>uf('contactEmail',v)} placeholder="name@maine.gov"/></Field>
        </Row>
      </Section>

      <Section label="About the event" icon={ic.cal}>
        {/* 85 is measured, not guessed: the card title column is 303px at
            21px/25.2px, where 85 characters is the longest title that still
            fits three lines. Past that a card grows and the row it sits in
            grows with it. */}
        <Field label="Title" required
          hint={`${(form.title||'').length}/${TITLE_MAX} characters. Titles over ${TITLE_MAX} wrap to a fourth line on the calendar.`}
          error={err.title}>
          <Text value={form.title} onChange={v=>uf('title',v)} placeholder="Short, descriptive title" max={TITLE_MAX}/>
        </Field>
        <Row cols="1fr 1fr">
          <Field label="Focus area" required error={err.focusArea}><Sel value={form.focusArea} onChange={v=>uf('focusArea',v)} options={FOCUS_AREAS} placeholder="Select focus area..."/></Field>
          <Field label="Event type" required error={err.eventType}><Sel value={form.eventType} onChange={v=>uf('eventType',v)} options={EVENT_TYPES} placeholder="Select type..."/></Field>
        </Row>
        <Field label="Program / initiative" hint="Optional. Use only when a sub-team wants their own calendar widget. Most events leave this blank. Pick one, or type a new name to start one.">
          <Combo value={form.programInitiative} onChange={v=>uf('programInitiative',v)} options={programOpts} listId="program-options" placeholder="None — or type a new program name"/>
        </Field>
        <Field label="Intended audience" required hint="Who's this for? e.g., K-12 educators, District administrators" error={err.intendedAudience}>
          <Text value={form.intendedAudience} onChange={v=>uf('intendedAudience',v)} placeholder="Educators, administrators..."/>
        </Field>
        <Field label="Description" required hint="This is your primary marketing tool. Explain what people will learn, who should attend, and why." error={err.description}>
          <QuillEditor value={form.description} onChange={v=>uf('description',v)}/>
          {(()=>{
            const n=(form.description||'').replace(/<[^>]+>/g,'').trim().length;
            const pct=n/5000;
            const c=pct>1?'#b91c1c':pct>0.9?'#b45309':B.ink2;
            return <div style={{display:'flex',justifyContent:'flex-end',alignItems:'center',gap:6,marginTop:6,fontSize:11.5,fontWeight:600,color:c}}>
              {pct>0.9&&<span>{pct>1?'Over limit':'Getting close to limit'} — </span>}

          <Field label="Start date" required error={err.startDate}><Text type="date" value={form.startDate} onChange={v=>{uf('startDate',v);if(!form.endDate||form.endDate<v)uf('endDate',v)}}/></Field>
          <Field label="End date" hint="Same as start for single-day events"><Text type="date" value={form.endDate} onChange={v=>uf('endDate',v)}/></Field>

    const up=[],pa=[];

// ---- Local drafts (browser-only, per-device) ----
// Drafts persist to localStorage so an accidental tab close, browser crash,
// or "I got interrupted" moment doesn't lose an in-progress event submission.
// A follow-on could sync drafts to the Sheet backend for cross-device — for
// now, drafts are tied to the browser they were started in.
const DRAFTS_KEY='doe_events_drafts_v1';
function loadDrafts(){
  try{ const raw=localStorage.getItem(DRAFTS_KEY); if(!raw) return []; const arr=JSON.parse(raw); return Array.isArray(arr)?arr:[]; }
  catch(e){ return []; }
}
function saveDraftsList(list){
  try{ localStorage.setItem(DRAFTS_KEY, JSON.stringify(list)); }catch(e){}
}
function upsertDraft(id, formData){
  const list=loadDrafts();
  const now=Date.now();
  const existing=list.find(d=>d.id===id);
  const title=(formData.title||'').trim();
  const descText=(formData.description||'').replace(/<[^>]+>/g,'').trim();
  // A draft is only "meaningful" if the user has typed something beyond
  // whatever the default EMPTY state fills in — otherwise every fresh open
  // that gets abandoned would leave an "Untitled draft" clogging their list.
  const meaningful=title||descText||formData.contactName||formData.venueName||formData.registerUrl;
  if(!meaningful) return;
  const payload={ id, form:formData, updatedAt:now, contactEmail:(formData.contactEmail||'').trim().toLowerCase() };
  if(existing) Object.assign(existing, payload);
  else list.push(payload);
  saveDraftsList(list);
}
function removeDraft(id){
  saveDraftsList(loadDrafts().filter(d=>d.id!==id));
}
function draftsForEmail(email){
  const e=(email||'').trim().toLowerCase();
  const list=loadDrafts().sort((a,b)=>b.updatedAt-a.updatedAt);
  if(!e) return list;
  // Match by contact email if the draft has one; drafts without a contact
  // email (very early state) show up in every user's list — but those are
  // rare because the meaningful-check above usually gates them out.
  return list.filter(d=>!d.contactEmail||d.contactEmail===e);
}
function formatRelativeTime(ts){
  const s=Math.max(0, Math.round((Date.now()-ts)/1000));
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+' min ago';
  if(s<86400) return Math.floor(s/3600)+' hr ago';
  const d=new Date(ts);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' at '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}

function App(){
  const params=useMemo(()=>{const p={};new URLSearchParams(location.search).forEach((v,k)=>p[k]=v);return p;},[]);
  const editMode=!!params.edit;
  const [adminToken,setAdminToken]=useState(()=>localStorage.getItem('doe_events_admin_token')||'');
  const [rows,setRows]=useState([]);
  const [loadingRows,setLoadingRows]=useState(false);
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState(EMPTY);
  const [editing,setEditing]=useState(null);      // {id,token,fromAdmin}
  const [busy,setBusy]=useState(false);
  const [message,setMessage]=useState(null);
  const [confirm,setConfirm]=useState(null);
  // "Edit my events" — submitter self-service
  const [showManageDialog,setShowManageDialog]=useState(false);
  const [manageEmail,setManageEmail]=useState(()=>{
    try{return sessionStorage.getItem('doe_events_manage_email')||'';}catch(e){return '';}
  });
  const [manageMode,setManageMode]=useState(false);
  const [myEvents,setMyEvents]=useState([]);
  const [manageLoading,setManageLoading]=useState(false);
  const [showPast,setShowPast]=useState(false);
  // Draft state — a new draft ID is assigned when the form opens fresh (not
  // editing an existing event). Auto-save writes to that ID; on Submit success
  // the draft is removed. On close, the draft stays put so the user can resume.
  const [activeDraftId,setActiveDraftId]=useState(null);
  const [draftSavedAt,setDraftSavedAt]=useState(null);
  const [draftsVersion,setDraftsVersion]=useState(0); // bump to re-read localStorage in child renders

  const isAdmin=!!adminToken;
  // Recomputed whenever the drafts list changes (upsert/remove bump draftsVersion)
  const manageDrafts=useMemo(()=>draftsForEmail(manageEmail),[manageEmail,draftsVersion]);

  // Auto-save the current draft to localStorage — debounced 1.2s after the
  // last keystroke so we don't hammer localStorage on every character. Only
  // runs when the form is open AND we're not editing a live event.
  useEffect(()=>{
    if(!showForm||editing||!activeDraftId) return;
    const t=setTimeout(()=>{
      upsertDraft(activeDraftId, form);
      // Only surface "saved" if the draft actually made it into localStorage
      // (upsertDraft skips empty forms).
      const stored=loadDrafts().find(d=>d.id===activeDraftId);
      if(stored){
        setDraftSavedAt(stored.updatedAt);
        setDraftsVersion(v=>v+1);
      }
    },1200);
    return ()=>clearTimeout(t);
  },[form,showForm,editing,activeDraftId]);

  // Helper: open a fresh form and start a new draft
  function startNewSubmission(){
    setForm(EMPTY);
    setEditing(null);
    setActiveDraftId('draft_'+Date.now()+'_'+Math.random().toString(36).slice(2,7));
    setDraftSavedAt(null);
    setShowForm(true);
  }
  // Helper: load an existing draft into the form
  function continueDraft(draft){
    setForm(draft.form||EMPTY);
    setEditing(null);
    setActiveDraftId(draft.id);
    setDraftSavedAt(draft.updatedAt);
    setShowForm(true);
    setManageMode(false); // pop out of manage view when they start editing
  }
  function discardDraft(id){
    removeDraft(id);
    setDraftsVersion(v=>v+1);
  }

  // Load edit mode from URL
  useEffect(()=>{
    if(editMode){
      (async()=>{
        setBusy(true);
        try{
          const r=await fetch(`${API}?type=event&id=${encodeURIComponent(params.edit)}&token=${encodeURIComponent(params.token||'')}`);
          const j=await r.json();
          if(j.error) setMessage({tone:'err',text:j.error});
          else if(j.event){
            setForm(deserialize(j.event));
            setEditing({id:params.edit,token:params.token,fromAdmin:!!j.event.isAdmin});
            setShowForm(true);
          }
        }catch(e){setMessage({tone:'err',text:'Could not load event.'});}
        setBusy(false);
      })();
    }
  },[editMode]);

  // Load admin rows
  useEffect(()=>{
    if(!isAdmin) return;
    setLoadingRows(true);
    (async()=>{
      try{
        const r=await fetch(`${API}?type=events&token=${encodeURIComponent(adminToken)}&_=${Date.now()}`);
        const j=await r.json();
        if(j.error){setMessage({tone:'err',text:j.error+' — is the admin token correct?'});setAdminToken('');localStorage.removeItem('doe_events_admin_token');}
        else setRows((j.rows||[]).map(x=>({['Start Date']:x.dateTime,'Title':x.eventTitle,'Focus Area':x.focus,'Type':x.eventType,'Venue Name':'','Location Type':x.location,'Status':x.status,'Event ID':x.eventId||'','Contact Name':x.requestor,...x})));
      }catch(e){}
      setLoadingRows(false);
    })();
  },[isAdmin,adminToken]);

  async function submit(){
    setBusy(true);setMessage(null);
    try{
      const fields=serialize(form);
      const body=editing?{action:'event_update',id:editing.id,token:editing.token||adminToken,fields}:{action:'event_submit',fields};
      const r=await fetch(API,{method:'POST',body:JSON.stringify(body)});
      const j=await r.json();
      if(j.error){setMessage({tone:'err',text:j.error});}
      else if(editing){
        setMessage({tone:'ok',text:'Changes saved. Calendar updates within 5 minutes.'});
        if(manageMode&&manageEmail){setShowForm(false);setEditing(null);loadMyEvents(manageEmail);}
      } else {
        setMessage({tone:'ok',text:'Event submitted and posted to the calendar. A confirmation with an edit link has been sent to '+(form.contactEmail||'the contact email')+'. (Save that email — for now it\'s the only way to edit later. A better edit flow is coming soon.)'});
        // Successful submission — clear the draft so it doesn't linger in
        // the Drafts list showing content that's now live on the calendar.
        if(activeDraftId){ discardDraft(activeDraftId); setActiveDraftId(null); setDraftSavedAt(null); }
        setForm(EMPTY);setShowForm(false);
      }
    }catch(e){setMessage({tone:'err',text:'Network error - please try again.'});}
    setBusy(false);
  }
  async function del(){
    setBusy(true);setMessage(null);
    try{
      const r=await fetch(API,{method:'POST',body:JSON.stringify({action:'event_delete',id:editing.id,token:editing.token||adminToken})});
      const j=await r.json();
      if(j.error) setMessage({tone:'err',text:j.error});
      else{
        setMessage({tone:'ok',text:'Event cancelled. It will show as cancelled on the calendar and be hidden after a week.'});
        setShowForm(false);setEditing(null);setForm(EMPTY);
        if(manageMode&&manageEmail) loadMyEvents(manageEmail);
      }
    }catch(e){setMessage({tone:'err',text:'Network error.'});}
    setBusy(false);setConfirm(null);
  }
  async function cancelRow(r){
    setConfirm({title:`Cancel "${r['Title']}"?`,body:'This will mark the event as Cancelled. It shows on the calendar with a strikethrough for a week, then disappears.',onOk:async()=>{
      try{
        const res=await fetch(API,{method:'POST',body:JSON.stringify({action:'event_delete',id:r['Event ID'],token:adminToken})});
        const j=await res.json();
        if(j.error) setMessage({tone:'err',text:j.error});
        else{setMessage({tone:'ok',text:'Event cancelled.'});setRows(rows.map(x=>x['Event ID']===r['Event ID']?{...x,Status:'Cancelled'}:x));}
      }catch(e){}
      setConfirm(null);
    }});
  }
  function editRow(r){
    (async()=>{
      setBusy(true);
      try{
        const res=await fetch(`${API}?type=event&id=${encodeURIComponent(r['Event ID'])}&token=${encodeURIComponent(adminToken)}`);
        const j=await res.json();
        if(j.error) setMessage({tone:'err',text:j.error});
        else if(j.event){
          setForm(deserialize(j.event));
          setEditing({id:r['Event ID'],token:adminToken,fromAdmin:true});
          setShowForm(true);
        }
      }catch(e){}
      setBusy(false);
    })();
  }
  async function loadMyEvents(email){
    const e=String(email||'').trim();
    if(!e||e.indexOf('@')<1){setMessage({tone:'err',text:'Enter a valid email address.'});return;}
    setManageLoading(true);setMessage(null);
    try{
      // Always bypass server cache — data is small, per-user, and stale reads
      // after an edit are confusing. TTL still catches accidental hammering.
      const r=await fetch(`${API}?type=my_events&email=${encodeURIComponent(e)}&refresh=1&_=${Date.now()}`);
      const j=await r.json();
      if(j.error){setMessage({tone:'err',text:j.error});setMyEvents([]);}
      else{
        setMyEvents(j.events||[]);
        setManageMode(true);
        try{sessionStorage.setItem('doe_events_manage_email',e);}catch(err){}
        if(!(j.events||[]).length) setMessage({tone:'info',text:'No events found for '+e+'. If you submitted from a different address, try that one — or use the edit link in your confirmation email.'});
      }
    }catch(err){setMessage({tone:'err',text:'Could not load your events. Try again.'});}
    setManageLoading(false);
    setShowManageDialog(false);
  }
  function exitManage(){setManageMode(false);setMyEvents([]);setMessage(null);}
  function editMyEvent(ev){
    // The my_events response now carries the full record, so we can open the
    // edit form instantly (no second Apps Script round-trip). Fall back to
    // fetching just in case an older backend deploy is still live.
    if(ev && ev.title !== undefined && ev.description !== undefined){
      setForm(deserialize(ev));
      setEditing({id:ev.id,token:ev.editToken,fromAdmin:false});
      setShowForm(true);
      return;
    }
    (async()=>{
      setBusy(true);
      try{
        const res=await fetch(`${API}?type=event&id=${encodeURIComponent(ev.id)}&token=${encodeURIComponent(ev.editToken)}`);
        const j=await res.json();
        if(j.error) setMessage({tone:'err',text:j.error});
        else if(j.event){
          setForm(deserialize(j.event));
          setEditing({id:ev.id,token:ev.editToken,fromAdmin:false});
          setShowForm(true);
        }
      }catch(e){setMessage({tone:'err',text:'Could not load event.'});}
      setBusy(false);
    })();
  }
  function cancelMyEvent(ev){
    setConfirm({title:`Cancel "${ev.title}"?`,body:'This marks the event as Cancelled on the DOE calendar. It shows with a strikethrough for a week, then disappears.',onOk:async()=>{
      try{
        const res=await fetch(API,{method:'POST',body:JSON.stringify({action:'event_delete',id:ev.id,token:ev.editToken})});
        const j=await res.json();
        if(j.error) setMessage({tone:'err',text:j.error});
        else{
          setMessage({tone:'ok',text:'Event cancelled.'});
          setMyEvents(myEvents.map(x=>x.id===ev.id?{...x,status:'Cancelled'}:x));
        }
      }catch(e){setMessage({tone:'err',text:'Network error.'});}
      setConfirm(null);
    }});
  }
  function enterAdmin(){
    const t=prompt('Enter admin token (get from the Apps Script EVENTS_ADMIN_TOKEN property):');
    if(t){localStorage.setItem('doe_events_admin_token',t);setAdminToken(t);}
  }
  function exitAdmin(){
    if(confirm2('Exit admin mode? You\'ll need to re-enter the token next time.'))
      {localStorage.removeItem('doe_events_admin_token');setAdminToken('');setRows([]);}
  }
  function confirm2(msg){return window.confirm(msg);}

  return <div style={{maxWidth:1200,margin:'0 auto',padding:'0 28px'}}>
    {/* Hero — matches other portal trackers (dark navy panel with grid overlay) */}
    <div style={{background:'linear-gradient(135deg,#0c1926,#162d44)',borderRadius:'0 0 20px 20px',padding:'32px',marginBottom:28,position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',inset:0,pointerEvents:'none',backgroundImage:'linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px)',backgroundSize:'60px 60px'}}/>
      <div style={{position:'relative',zIndex:1}}>
        <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:20}}>
          <div style={{width:48,height:48,borderRadius:14,background:'linear-gradient(135deg,#42c3f7,#34d399)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 16px rgba(66,195,247,0.3)'}}>
            <Sv d={ic.cal} size={24} c="#0c1926"/>
          </div>
          <div>
            <h1 style={{fontFamily:"'League Spartan',sans-serif",fontSize:24,fontWeight:800,color:'#fff',margin:0,letterSpacing:'.01em'}}>Events Tracker</h1>
            <p style={{fontSize:13,color:'#94a3b8',margin:0,fontWeight:500}}>Submit and manage DOE calendar events</p>
          </div>
        </div>
        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
          {!editMode&&<button onClick={startNewSubmission} style={{display:'inline-flex',alignItems:'center',gap:8,padding:'12px 24px',borderRadius:12,background:'linear-gradient(135deg,#42c3f7,#0d7ba0)',color:'#fff',border:'none',fontSize:14,fontWeight:700,boxShadow:'0 4px 16px rgba(66,195,247,0.3)',cursor:'pointer'}}>
            <Sv d={ic.plus} size={18} c="#fff"/> Submit new event
          </button>}
          {!editMode&&!isAdmin&&(manageMode?
            <button onClick={exitManage} style={{display:'inline-flex',alignItems:'center',gap:8,padding:'12px 24px',borderRadius:12,background:'rgba(255,255,255,0.08)',border:'1.5px solid rgba(255,255,255,0.15)',color:'#e2e8f0',fontSize:14,fontWeight:600,cursor:'pointer'}}>
              <Sv d={ic.x} size={16} c="#94a3b8"/> Exit manage
            </button>
            :<button onClick={()=>setShowManageDialog(true)} style={{display:'inline-flex',alignItems:'center',gap:8,padding:'12px 24px',borderRadius:12,background:'rgba(255,255,255,0.08)',border:'1.5px solid rgba(255,255,255,0.15)',color:'#e2e8f0',fontSize:14,fontWeight:600,cursor:'pointer'}}>
              <Sv d={ic.edit} size={16} c="#94a3b8"/> Edit my events
            </button>
          )}
          <a href={CAL_URL} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:8,padding:'12px 24px',borderRadius:12,background:'rgba(255,255,255,0.08)',border:'1.5px solid rgba(255,255,255,0.15)',color:'#e2e8f0',textDecoration:'none',fontSize:14,fontWeight:600}}>
            <Sv d={ic.cal} size={18} c="#94a3b8"/> View calendar
          </a>
          {/* Pipe separator — visually groups the PD certificate actions apart from event actions */}
          <div aria-hidden="true" style={{width:1,alignSelf:'stretch',background:'rgba(255,255,255,0.15)',margin:'2px 2px'}}/>
          <a href="https://www.maine.gov/doe/certificate/create.shtml" target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:8,padding:'12px 24px',borderRadius:12,background:'rgba(255,255,255,0.08)',border:'1.5px solid rgba(255,255,255,0.15)',color:'#e2e8f0',textDecoration:'none',fontSize:14,fontWeight:600}}>
            <Sv d={ic.plus} size={16} c="#94a3b8"/> Create PD certificate
          </a>
          <a href="https://www.maine.gov/doe/certificate/view.shtml" target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:8,padding:'12px 24px',borderRadius:12,background:'rgba(255,255,255,0.08)',border:'1.5px solid rgba(255,255,255,0.15)',color:'#e2e8f0',textDecoration:'none',fontSize:14,fontWeight:600}}>
            <Sv d={ic.ext} size={16} c="#94a3b8"/> View PD certificate
          </a>
        </div>
      </div>
    </div>
    <div style={{padding:'0 0 24px'}}>

    {/* Submission tips */}
    {!editMode&&!showForm&&<Callout tone="info" title="Before you submit">
      <strong>Proofread and check grammar.</strong> Spell out acronyms. Do not submit until all details are confirmed. Only events hosted or co-hosted by the Maine DOE. <strong>Check the calendar for conflicts</strong> (same day, time, and audience) before scheduling. Newsroom posts won't publish unless the event is on the calendar. Submit at least 1 week in advance (2+ weeks recommended).
    </Callout>}

    {message&&<Callout tone={message.tone==='ok'?'ok':message.tone==='err'?'err':'info'}>{message.text}</Callout>}

    {isAdmin&&!showForm&&!editMode&&<Tracker rows={rows} loading={loadingRows} onEdit={editRow} onCancel={cancelRow} adminMode={true}/>}

    {/* Submitter manage view — list of my events with edit/cancel */}
    {!isAdmin&&manageMode&&!showForm&&!editMode&&<ManageMine
      email={manageEmail} events={myEvents} loading={manageLoading}
      showPast={showPast} setShowPast={setShowPast}
      onEdit={editMyEvent} onCancel={cancelMyEvent}
      onReload={()=>loadMyEvents(manageEmail)}
      onChangeEmail={()=>setShowManageDialog(true)}
      drafts={manageDrafts}
      onContinueDraft={continueDraft}
      onDiscardDraft={discardDraft}/>}

    {/* Default: public live calendar iframe */}
    {!isAdmin&&!manageMode&&!showForm&&!editMode&&<div style={{marginTop:8}}>
      <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:12,paddingLeft:2,flexWrap:'wrap',gap:8}}>
        <h3 style={{fontFamily:'League Spartan',fontSize:15,fontWeight:800,color:B.navy,margin:0,textTransform:'uppercase',letterSpacing:'.05em'}}>Live calendar</h3>
        <a href={CAL_URL} target="_blank" rel="noopener noreferrer" style={{fontSize:12,fontWeight:700,color:B.tealInk||'#0d7ba0',textDecoration:'none'}}>Open in new tab ↗</a>
      </div>
      <div style={{background:B.wh,borderRadius:14,border:`1px solid ${B.rule}`,overflow:'hidden'}}>
        <iframe src="https://gateway.maine.gov/doe/communications/calendar/index.html"
          style={{width:'100%',minHeight:1100,border:'none',display:'block'}}
          title="Events & Professional Development Calendar"/>
      </div>
    </div>}

    {/* Form modal */}
    <Modal open={showForm} onClose={()=>{
      if(busy) return;
      // Flush any pending edits to the draft before closing so a fast X-click
      // (before the debounced auto-save fires) doesn't lose the last few
      // keystrokes.
      if(!editing&&activeDraftId){
        upsertDraft(activeDraftId, form);
        const stored=loadDrafts().find(d=>d.id===activeDraftId);
        if(stored) setMessage({tone:'info',text:'Draft saved. You can pick it back up any time from "Edit my events".'});
      }
      setShowForm(false);
    }} title={editing?'Edit event':'Submit an event'} wide={true}>
      <EventForm form={form} setForm={setForm} onSubmit={submit}
        onDelete={editing?()=>setConfirm({title:'Cancel this event?',body:'This marks the event as Cancelled. It shows with a strikethrough for a week, then hides.',onOk:del}):null}
        editing={!!editing} busy={busy}
        draftSavedAt={draftSavedAt}
        onSaveDraft={editing?null:()=>{
          if(!activeDraftId) return 'empty';
          upsertDraft(activeDraftId, form);
          const stored=loadDrafts().find(d=>d.id===activeDraftId);
          if(stored){
            setDraftSavedAt(stored.updatedAt);
            setDraftsVersion(v=>v+1);
            return 'saved';
          }
          // upsertDraft skipped it — the form has no meaningful content yet
          return 'empty';
        }}/>
    </Modal>

    {/* Confirm modal */}
    <Modal open={!!confirm} onClose={()=>setConfirm(null)} title={confirm?.title||'Confirm'}>
      <p style={{fontSize:14,color:B.ink2,lineHeight:1.6,marginBottom:20}}>{confirm?.body}</p>
      <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
        <Btn variant="ghost" onClick={()=>setConfirm(null)}>Keep event</Btn>
        <Btn variant="danger" icon={ic.trash} onClick={()=>confirm?.onOk?.()}>Yes, cancel</Btn>
      </div>
    </Modal>

    {/* Edit my events — email dialog */}
    <Modal open={showManageDialog} onClose={()=>setShowManageDialog(false)} title="Edit my events">
      <p style={{fontSize:13.5,color:B.ink2,lineHeight:1.6,marginBottom:14}}>
        Enter the email you used when submitting (or the contact email on the event). We'll pull up every event tied to that address so you can edit or cancel it.
      </p>
      <form onSubmit={e=>{e.preventDefault();loadMyEvents(manageEmail);}}>
        <input type="email" placeholder="your.name@maine.gov" autoFocus
          value={manageEmail} onChange={e=>setManageEmail(e.target.value)}
          style={{width:'100%',padding:'12px 14px',borderRadius:8,border:`1.5px solid ${B.rule}`,fontSize:14,fontFamily:'inherit',color:B.ink,marginBottom:14,outline:'none'}}/>
        <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
          <Btn variant="ghost" onClick={()=>setShowManageDialog(false)}>Cancel</Btn>
          <Btn type="submit" variant="primary" icon={ic.search} disabled={!manageEmail||manageLoading}>
            {manageLoading?'Looking...':'Find my events'}
          </Btn>
        </div>
      </form>
    </Modal>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

function statusBadge(s){
  const cfg={live:{bg:'rgba(52,211,153,0.12)',border:'rgba(52,211,153,0.3)',color:'#34d399',dot:true,text:'Live'},
    soon:{bg:'rgba(129,140,248,0.1)',border:'rgba(129,140,248,0.25)',color:'#818cf8',text:'Coming soon'},
    blocked:{bg:'rgba(239,68,68,0.1)',border:'rgba(239,68,68,0.25)',color:'#f87171',text:'Blocked'}};
  const c=cfg[s]||cfg.soon;
  return <span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:11,fontWeight:700,padding:'4px 12px',borderRadius:20,
    background:c.bg,border:`1.5px solid ${c.border}`,color:c.color}}>
    {c.dot&&<span style={{width:6,height:6,borderRadius:'50%',background:c.color,animation:'pulse 2s infinite'}}/>}
    {c.text}
  </span>;
}

function ModuleCard({m,onClick,hovered,onHover,onLeave,delay=0,headerStyle}){
  const blocked=m.status==='blocked';
  const hov=hovered;
  return(
    <div onMouseEnter={onHover} onMouseLeave={onLeave} onClick={()=>{if(!blocked&&onClick)onClick();}}
      style={{
        background:'#ffffff',borderRadius:16,overflow:'hidden',
        border:`2.5px solid ${m.color}${hov&&!blocked?'':'45'}`,
        boxShadow:hov&&!blocked?`0 12px 40px ${m.color}20, 0 4px 12px rgba(0,0,0,0.06)`:'0 4px 16px rgba(0,0,0,0.06)',
        opacity:blocked?.45:1,cursor:blocked?'default':'pointer',
        transition:'all 0.25s ease',transform:hov&&!blocked?'translateY(-3px)':'none',
        animation:`fadeUp 0.4s ease ${delay}s both`,
      }}>
      {headerStyle?
        <div style={{padding:'16px 20px',background:m.gradient,display:'flex',alignItems:'center',gap:12}}>
          <div style={{width:36,height:36,borderRadius:10,background:'rgba(255,255,255,0.15)',
            display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <I d={m.icon} size={18} color="#ffffff"/>
          </div>
          <h3 style={{fontSize:16,fontWeight:700,color:'#ffffff',flex:1,lineHeight:1.2,margin:0}}>{m.label}</h3>
          {statusBadge(m.status)}
        </div>
      :<>
        <div style={{height:6,background:m.gradient}}/>
        <div style={{padding:'22px 24px 6px'}}>
          <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:14}}>
            <div style={{width:44,height:44,borderRadius:13,background:m.gradient,
              display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,
              boxShadow:`0 5px 18px ${m.color}30`}}>
              <I d={m.icon} size={21} color="#ffffff"/>
            </div>
            <h3 style={{fontSize:17,fontWeight:700,color:'#182b3c',flex:1,lineHeight:1.2,margin:0}}>{m.label}</h3>
            {statusBadge(m.status)}
          </div>
        </div>
      </>}
      <div style={{padding:headerStyle?'16px 20px 18px':'0 24px 20px'}}>
        <p style={{fontSize:13,color:'#334155',lineHeight:1.65,marginBottom:16,fontWeight:500}}>{m.desc}</p>
        {(m.stat||m.statLabel)&&<div style={{display:'flex',alignItems:'center',gap:14,marginBottom:16,
          padding:'12px 18px',borderRadius:12,background:`${m.color}0a`,border:`2px solid ${m.color}25`}}>
          <span style={{fontSize:28,fontWeight:800,color:m.color,lineHeight:1}}>{m.stat||'—'}</span>
          <span style={{fontSize:12,fontWeight:600,color:'#334155'}}>{m.statLabel}</span>
          {!blocked&&<span style={{marginLeft:'auto',fontSize:12,fontWeight:700,
            color:hov?'#ffffff':m.color,background:hov?m.color:'transparent',
            padding:hov?'4px 12px':'0',borderRadius:8,
            transition:'all 0.2s',
            display:'flex',alignItems:'center',gap:4}}>
            {m.external?'Open ↗':m.status==='live'?'Open →':'View →'}
          </span>}
        </div>}
        {!m.stat&&!m.statLabel&&!blocked&&<div style={{display:'flex',alignItems:'center',justifyContent:'center',
          padding:'10px 18px',borderRadius:10,marginBottom:12,
          background:hov?m.color:`${m.color}0a`,border:`2px solid ${m.color}25`,
          transition:'all 0.2s'}}>
          <span style={{fontSize:13,fontWeight:700,color:hov?'#ffffff':m.color,
            display:'flex',alignItems:'center',gap:6,transition:'all 0.2s'}}>
            {m.external?'Open ↗':'Open →'}
          </span>
        </div>}
        {m.features&&<div style={{display:'flex',flexWrap:'wrap',gap:6}}>

function Portal(){
  const [section,setSection]=useState('home');
  const [webSub,setWebSub]=useState(null);
  const [sbOpen,setSbOpen]=useState(true);
  const [mob,setMob]=useState(false);
  const [hovCard,setHovCard]=useState(null);
  const [queueStatus,setQueueStatus]=useState(()=>{
    // Hydrate from sessionStorage so the sidebar dots (YouTube pending count,
    // website approvals count) show instantly on reload instead of waiting on
    // the Apps Script cold-start fetch — the fetch below still runs and
    // overwrites with fresh values as soon as it lands.
    try{ const s=sessionStorage.getItem('doe_portal_queue_status'); if(s) return JSON.parse(s); }catch(e){}
    return {};
  });
  const [modQueue,setModQueue]=useState([]);
  const [webStats,setWebStats]=useState(()=>{
    // Same rehydrate pattern as queueStatus — show last-known numbers instantly
    // on reload, then overwrite when the fresh fetch lands. Skips the "···"
    // loading state entirely for returning users.
    try{ const s=sessionStorage.getItem('doe_portal_web_stats'); if(s) return JSON.parse(s); }catch(e){}
    return {pageViews:null,totalPages:null,totalFiles:null};
  });
  // Session-scoped cache-buster for iframes — fresh on every portal load, cached within a session.
  const [sessionV]=useState(()=>Date.now().toString(36));

  const SCRIPT_URL='https://script.google.com/macros/s/AKfycbx9_qEikjvV4ieh-7CGv-Gq5Mm7PA432dtGEN-UzmSDtzlaL7SEVxChnMOfl0Lgr2BEhg/exec';
  // Static CDN mirror — refreshed every 15 min by refresh-portal-data.yml.
  // Fetches in ~100ms vs 2-30s from Apps Script. Falls back to live if the
  // CDN payload is unreachable or older than 60 min.
  const CDN_BASE='https://raw.githubusercontent.com/matthewgleavitt/maine-doe-web/main/data/';
  const CDN_STALE_MINUTES=60;
  async function fetchCdnOrLive(type){
    try{
      const c=new AbortController();const t=setTimeout(()=>c.abort(),5000);
      const r=await fetch(CDN_BASE+type+'.json',{signal:c.signal});
      clearTimeout(t);
      if(r.ok){
        const d=await r.json();
        const age=(Date.now()-new Date(d._fetched||0).getTime())/60000;
        if(age<CDN_STALE_MINUTES){ console.log('['+type+'] CDN, age '+Math.round(age)+' min'); return d; }
        console.warn('['+type+'] CDN stale ('+Math.round(age)+' min), falling back to live');
      }
    }catch(e){ console.warn('['+type+'] CDN failed, falling back to live:',e.message); }
    const rr=await fetch(SCRIPT_URL+'?type='+type,{cache:'no-store'});
    return rr.json();
  }

  useEffect(()=>{
    // Track viewport width for responsive layout, but NEVER auto-collapse the sidebar.
    // Manual hamburger toggle is the only way to close it.
    const ck=()=>setMob(window.innerWidth<860);
    ck();window.addEventListener('resize',ck);return()=>window.removeEventListener('resize',ck);
  },[]);

  // Fetch queue status for sidebar indicators
  useEffect(()=>{
    // Retry-once + 25s timeout wrapper — Apps Script cold-start can take 5-15s
    // and occasionally hangs. Sequential awaits made web_stats appear frozen
    // behind youtube+moderation; running all three in parallel fixes that.
    const fetchJson=async(url,label)=>{
      const attempt=async()=>{
        const c=new AbortController();
        const t=setTimeout(()=>c.abort(),25000);
        try{ const r=await fetch(url,{signal:c.signal}); return await r.json(); }
        finally{ clearTimeout(t); }
      };
      try{ return await attempt(); }
      catch(e){
        await new Promise(r=>setTimeout(r,1200));
        try{ return await attempt(); }
        catch(e2){ console.warn('[portal] '+label+' fetch failed:',e2.message); return null; }
      }
    };

    // YouTube pending count (sidebar dot)
    (async()=>{
      const j=await fetchJson(SCRIPT_URL+'?type=youtube','youtube');
      if(j&&j.rows){
        const pending=j.rows.filter(s=>s.status!=='Complete').length;
        setQueueStatus(prev=>{
          const next={...prev,youtube:{pending,total:j.rows.length}};
          try{sessionStorage.setItem('doe_portal_queue_status',JSON.stringify(next));}catch(e){}
          return next;
        });
      }
    })();

    // Moderation queue (Drupal proxied via Apps Script) — CDN-first
    (async()=>{
      const j=await fetchCdnOrLive('moderation');
      if(!j) return;
      const items=j.rows||(Array.isArray(j)?j:[]);
      const parsed=items.map(item=>{
        const titleMatch=(item.title||'').match(/>([^<]+)</);
        const hrefMatch=(item.title||'').match(/href="([^"]+)"/);
        const nameMatch=(item.name||'').match(/content="([^"]+)"/)||(item.name||'').match(/>([^<…]+)/);
        const dateMatch=(item.changed||'').match(/title="([^"]+)"/);
        return{
          title:titleMatch?titleMatch[1].replace(/&amp;/g,'&'):item.title||'',
          href:hrefMatch?'https://www.maine.gov'+hrefMatch[1].replace(/\/revisions\/\d+\/view/,'/edit'):'',
          author:nameMatch?nameMatch[1]:'',
          date:dateMatch?dateMatch[1]:'',
          state:item.moderation_state||'',
        };
      });
      setModQueue(parsed);
      setQueueStatus(prev=>{
        const next={...prev,website:{pending:parsed.length,total:parsed.length}};
        try{sessionStorage.setItem('doe_portal_queue_status',JSON.stringify(next));}catch(e){}
        return next;
      });
    })();

    // Web stats (page views, total pages, total files) — independent of the above
    (async()=>{
      const j=await fetchCdnOrLive('web_stats');
      if(!j) return;
      const next={
        pageViews:j.pageViews||'—',
        totalPages:j.totalPages||'—',
        totalFiles:j.totalFiles||'—',
      };
      setWebStats(next);
      try{sessionStorage.setItem('doe_portal_web_stats',JSON.stringify(next));}catch(e){}
    })();
  },[]);

  const nav=useCallback((id)=>{
    const item=navItems.find(n=>n.id===id)||dashCards.find(n=>n.id===id);
    if(item?.external){window.open(item.external,'_blank');return;}
    setSection(id);
    setWebSub(null);
  },[]);

  // Determine what's showing
  const activeNav=navItems.find(n=>n.id===section);
  const activeWebMod=webSub?(webSub===webToolsModule.id?webToolsModule:webModules.find(m=>m.id===webSub)):null;
  const iframeUrl=section==='home'?'welcome.html':section==='brand'?'brandguide.html':section==='youtube'?'youtube-tracker.html':section==='events'?'events-tracker.html':section==='templates'?'templates.html':section==='publications'?'publications.html':section==='engine'?'engine.html':section==='wayfinder'?'wayfinder.html':activeWebMod?.href||null;
  const showIframe=(section==='home')||(section==='brand')||(section==='youtube')||(section==='events')||(section==='templates')||(section==='publications')||(section==='engine')||(section==='wayfinder')||activeWebMod?.href;

  // Title for header
  const headerTitle=activeWebMod?activeWebMod.label:section==='website'?'Website':section==='dashboard'?'Communications Portal':activeNav?.label||'';

  // ── Portal ──
  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden',background:C.navy}}>

                        <td style={{padding:'12px 16px',color:'#475569',fontWeight:500,fontSize:12,whiteSpace:'nowrap'}}>{item.date}</td>
                        <td style={{padding:'12px 16px',textAlign:'center'}}>
                          <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'4px 12px',borderRadius:20,fontSize:11,fontWeight:700,
                            background:'#fef3c7',color:'#92400e',border:'1.5px solid #fcd34d'}}>
                            {item.state}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                :<div style={{padding:'32px 20px',textAlign:'center'}}>
                  <div style={{fontSize:13,fontWeight:600,color:'#94a3b8'}}>No pending approvals</div>
                  <div style={{fontSize:12,fontWeight:500,color:'#c2cdd8',marginTop:4}}>Pages submitted for review will appear here.</div>
                </div>}
              </div>

              {/* Compact 3-card row: Analytics + Page Explorer + File Manager. Tools moved to hero. */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(3, 1fr)',gap:14,marginBottom:20}}>
                {webModules.map((m,i)=>{
                  const dynStat=m.statKey?webStats[m.statKey]:m.stat;
                  const isHov=hovCard===m.id;
                  return <div key={m.id} onClick={()=>{if(m.href)setWebSub(m.id);}}
                    onMouseEnter={()=>setHovCard(m.id)} onMouseLeave={()=>setHovCard(null)}
                    style={{background:'#fff',borderRadius:12,border:`1.5px solid ${isHov?'#42c3f7':'#e2e8f0'}`,cursor:'pointer',
                      overflow:'hidden',boxShadow:isHov?'0 6px 20px rgba(66,195,247,0.18)':'0 1px 4px rgba(0,0,0,0.04)',
                      transition:'all .18s ease',transform:isHov?'translateY(-2px)':'none',display:'flex',flexDirection:'column'}}>
                    <div style={{padding:'12px 14px',background:m.gradient,display:'flex',alignItems:'center',gap:10}}>
                      <div style={{width:32,height:32,borderRadius:9,background:'rgba(255,255,255,0.15)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                        <I d={m.icon} size={17} color="#ffffff"/>
                      </div>
                      <div style={{minWidth:0,flex:1}}>
                        <div style={{fontSize:13.5,fontWeight:800,color:'#ffffff',letterSpacing:'-0.005em',lineHeight:1.15}}>{m.label}</div>
                      </div>
                    </div>
                    <div style={{padding:'12px 14px 14px',display:'flex',flexDirection:'column',gap:8,flex:1}}>
                      <div style={{display:'flex',alignItems:'baseline',gap:6}}>
                        <span style={{fontSize:22,fontWeight:800,color:'#182b3c',fontVariantNumeric:'tabular-nums',letterSpacing:'-0.02em',lineHeight:1}}>
                          {dynStat===null||dynStat===undefined?<span style={{color:'#cbd5e1',fontWeight:600,fontSize:16,letterSpacing:'0.15em'}}>···</span>:typeof dynStat==='number'?dynStat.toLocaleString():dynStat}
                        </span>
                        <span style={{fontSize:10.5,fontWeight:600,color:'#64748b',lineHeight:1.2}}>{m.statLabel}</span>
                      </div>
                      <p style={{fontSize:11.5,color:'#64748b',lineHeight:1.5,fontWeight:500,margin:0}}>{m.desc}</p>
                      <div style={{marginTop:'auto',display:'flex',alignItems:'center',gap:5,fontSize:11.5,fontWeight:700,color:'#274f73'}}>
                        Open <I d={["M5 12h14","M12 5l7 7-7 7"]} size={12} color="#274f73"/>
                      </div>
                    </div>
                  </div>;
                })}
              </div>

              {/* Drupal editing tips — the Word-paste warning lives here, separate
                  from the file workflow because it applies to page editing, not file uploads. */}
              <div style={{background:'#ffffff',borderRadius:14,border:'2px solid #8a2e1330',overflow:'hidden',boxShadow:'0 2px 12px rgba(0,0,0,0.04)',marginBottom:20}}>
                <div style={{padding:'12px 20px',background:'#8a2e13',display:'flex',alignItems:'center',gap:10}}>
                  <div style={{width:22,height:22,borderRadius:'50%',background:'#ffffff',color:'#8a2e13',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:800,flexShrink:0}}>!</div>
                  <h3 style={{fontFamily:"'League Spartan','DM Sans',sans-serif",fontSize:14,fontWeight:800,color:'#ffffff',margin:0,letterSpacing:'.03em',textTransform:'uppercase'}}>Editing on Drupal — heads up</h3>
                </div>
                <div style={{padding:'14px 20px',fontSize:13.5,color:'#182b3c',lineHeight:1.55,fontWeight:500}}>
                  <strong style={{color:'#8a2e13',fontWeight:800}}>Do not copy and paste from Word.</strong> Word carries invisible styling that breaks page formatting. Paste as plain text (<code style={{background:'#f1f5f9',padding:'1px 6px',borderRadius:4,fontSize:12,fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace'}}>Ctrl+Shift+V</code> / <code style={{background:'#f1f5f9',padding:'1px 6px',borderRadius:4,fontSize:12,fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace'}}>Cmd+Shift+V</code>), or type directly into the Drupal editor.
                </div>
              </div>

              {/* File workflow — how to add a file to maine.gov/doe */}
              <div style={{background:'#ffffff',borderRadius:14,border:'2px solid #274f7330',overflow:'hidden',boxShadow:'0 2px 12px rgba(0,0,0,0.04)',marginBottom:20}}>
                <div style={{padding:'16px 22px',background:'linear-gradient(135deg,#0c1926,#162d44)'}}>
                  <h3 style={{fontFamily:"'League Spartan','DM Sans',sans-serif",fontSize:15,fontWeight:800,color:'#42c3f7',margin:0,letterSpacing:'.03em',textTransform:'uppercase'}}>How to add a file to maine.gov/doe</h3>
                </div>
                <div style={{padding:'20px 24px 24px'}}>
                  {/* Step 1 — Naming */}
                  <div style={{display:'flex',gap:14,marginBottom:20}}>
                    <div style={{width:28,height:28,borderRadius:'50%',background:'#274f73',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:800,flexShrink:0}}>1</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:15,fontWeight:800,color:'#182b3c',marginBottom:6}}>Name your file using the naming convention</div>
                      <code style={{display:'block',background:'#f1f5f9',padding:'10px 14px',borderRadius:8,color:'#182b3c',fontSize:13,fontWeight:700,marginBottom:10,border:'1px solid #a8bdd050',fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace'}}>Team/Area - Title of File - Full Date.pdf</code>
                      <ul style={{listStyle:'none',padding:0,margin:'0 0 12px'}}>
                        {[
                          'Spaces between hyphens.',
                          'No abbreviations or acronyms (unless universal).',
                          'Date with periods between, full year written out, no leading zeros. Use 6.1.2024, not 06.01.24 or 6.1.24.',
                          'Prioritize using PDFs.',
                          'For non-English versions, put the language in brackets at the end of the title, before the date: [Arabic], [Spanish], etc.',
                        ].map((it,i)=>(
                          <li key={i} style={{display:'flex',alignItems:'flex-start',gap:8,padding:'4px 0',fontSize:13,color:'#334155',fontWeight:500,lineHeight:1.55}}>
                            <I d={["M20 6L9 17l-5-5"]} size={14} color="#16a34a" style={{marginTop:3,flexShrink:0}}/>
                            <span>{it}</span>
                          </li>
                        ))}
                      </ul>
                      <div style={{padding:'12px 14px',background:'#f8fafc',borderRadius:8,border:'1px solid #a8bdd045'}}>
                        <div style={{fontSize:10.5,fontWeight:800,color:'#475569',letterSpacing:'.06em',textTransform:'uppercase',marginBottom:8}}>Examples</div>
                        {[
                          'Multilingual Learning - Multilingual Learners with Disabilities Policy Guide [Spanish] - 3.11.2025.pdf',
                          'Assessment - Print Disability Flowchart - 3.11.2025.pdf',
                          'Outdoor Education - Maine Outdoor Learning Grant Application - 3.11.2025.pdf',
                          'MLTI - Sphero Tutorial - 3.11.2025.pdf',
                          'School Safety - Restorative Practices Brochure - 3.11.2025.pdf',
                          'Interdisciplinary Instruction - Solutionaries Project Webinar Slides - 3.11.2025.pdf',
                        ].map((e,i)=>(
                          <div key={i} style={{fontSize:12.5,color:'#334155',padding:'3px 0',fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace',fontWeight:500,lineHeight:1.5,wordBreak:'break-word'}}>{e}</div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Step 2 — Upload */}
                  <div style={{display:'flex',gap:14,marginBottom:20}}>
                    <div style={{width:28,height:28,borderRadius:'50%',background:'#274f73',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:800,flexShrink:0}}>2</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:15,fontWeight:800,color:'#182b3c',marginBottom:6}}>Upload your file to SharePoint</div>
                      <p style={{fontSize:13.5,color:'#334155',lineHeight:1.6,fontWeight:500,marginBottom:10}}>
                        Place your file in the appropriate folder in <strong style={{color:'#182b3c'}}>DOE Teams → Communications → Files → Website Uploads</strong>. If your team's folder isn't there, reach out to Comms and we'll add it.
                      </p>
                      <a href="https://stateofmaine.sharepoint.com/:f:/t/DOETeam/IgA5Z26x-XMtR67bDYrVBg0eAcbc8G9dYzlzZkjdM1ovgvM?e=H75zYF" target="_blank" rel="noopener noreferrer"
                        style={{display:'inline-flex',alignItems:'center',gap:6,padding:'8px 14px',borderRadius:8,background:'#16a34a15',border:'1.5px solid #16a34a40',color:'#166534',textDecoration:'none',fontSize:12.5,fontWeight:700}}>
                        <I d={icons.folder} size={14} color="#166534"/> Open Website Uploads folder
                      </a>
                    </div>
                  </div>

                  {/* Step 3 — Linking */}
                  <div style={{display:'flex',gap:14}}>
                    <div style={{width:28,height:28,borderRadius:'50%',background:'#274f73',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:800,flexShrink:0}}>3</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:15,fontWeight:800,color:'#182b3c',marginBottom:6}}>Mark the link text on your Drupal page</div>
                      <p style={{fontSize:13.5,color:'#334155',lineHeight:1.6,fontWeight:500,marginBottom:10}}>
                        On the Drupal edit page, wrap the text you want linked in double asterisks (<code style={{background:'#f1f5f9',padding:'1px 6px',borderRadius:4,fontSize:12,fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace',fontWeight:700}}>**</code>) before and after. Comms picks that up and links it to the uploaded file.
                      </p>
                      <div style={{padding:'12px 14px',background:'#f8fafc',borderRadius:8,border:'1px solid #a8bdd045'}}>
                        <div style={{fontSize:10.5,fontWeight:800,color:'#475569',letterSpacing:'.06em',textTransform:'uppercase',marginBottom:8}}>Example</div>
                        <div style={{fontSize:13.5,color:'#334155',fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace',fontWeight:500,lineHeight:1.5,wordBreak:'break-word'}}>
                          You can learn more by checking out the <span style={{background:'#42c3f720',color:'#0d7ba0',padding:'1px 4px',borderRadius:3,fontWeight:700}}>**Multilingual Learners with Disability Policy Guide**</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div style={{paddingBottom:24}}/>
            </div>
          </div>}

          {/* ── WEBSITE SUB-TOOL (iframe) ── */}
          {section==='website'&&webSub&&activeWebMod?.href&&(
            <iframe src={`${activeWebMod.href}?v=${sessionV}`} style={{width:'100%',height:'100%',border:'none'}} title={activeWebMod.label}/>
          )}

          {/* ── BRAND GUIDE (iframe) ── */}
          {section==='brand'&&(
            <iframe src={`brandguide.html?v=${sessionV}`} style={{width:'100%',height:'100%',border:'none'}} title="Branding & Comms"/>
          )}

          {/* ── WAYFINDER (iframe) — local search bot, zero backend, zero cost ── */}
          {section==='wayfinder'&&(
            <iframe src={`wayfinder.html?v=${sessionV}`} style={{width:'100%',height:'100%',border:'none'}} title="Portal Wayfinder"/>
          )}

          {/* ── YOUTUBE TRACKER (iframe) ── */}
          {section==='youtube'&&(
            <iframe src={`youtube-tracker.html?v=${sessionV}`} style={{width:'100%',height:'100%',border:'none'}} title="YouTube Tracker"/>
          )}

          {/* ── EVENTS TRACKER (iframe) ── */}
          {section==='events'&&(
            <iframe src={`events-tracker.html?v=${sessionV}`} style={{width:'100%',height:'100%',border:'none'}} title="Events Tracker"/>
          )}

          {/* ── TEMPLATES (iframe) ── */}
          {section==='templates'&&(
            <iframe src={`templates.html?v=${sessionV}`} style={{width:'100%',height:'100%',border:'none'}} title="Templates"/>
          )}

          {/* ── PUBLICATIONS (iframe) ── */}
          {section==='publications'&&(
            <iframe src={`publications.html?v=${sessionV}`} style={{width:'100%',height:'100%',border:'none'}} title="Publications"/>
          )}

          {/* ── ENGINE (iframe) ── */}
          {section==='engine'&&(
            <iframe src={`engine.html?v=${sessionV}`} style={{width:'100%',height:'100%',border:'none'}} title="EnGiNE"/>
          )}

          {/* ── PROCESS & PROCEDURE (iframe) ── */}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Portal/>);
</script>
</body>
</html>

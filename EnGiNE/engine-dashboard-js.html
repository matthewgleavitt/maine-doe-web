<!--
  EnGiNE Dashboard — Additional HTML / JS (v3 — sidebar canonical menu)
  ------------------------------------------------------------
  Paste the contents below (everything between the markers) into:

    Site Admin → Appearance → Additional HTML →
    "Before BODY is closed" textarea

  Append BELOW the existing scripts. Save. No cache purge needed.

  Pipeline constraints (don't break these):
    1) Moodle's Additional HTML strips real newlines and decodes HTML
       entities. Each IIFE must therefore be a SINGLE LINE with NO //
       line comments (newline strip would orphan the rest of the file)
       and NO &#39; entity replacement (decoded to ' before parsing).
    2) Use literal apostrophes inside JS strings, not entities.

  Two IIFEs in this file:
    - Hero IIFE: gated to body.path-my .ep-dash. Greeting, first name,
      Recently Accessed harvest, tile counts, header-gap CSS var.
    - Sidebar IIFE: gated to .tgsdb-quicklinks. Replaces shifting
      Moodle nav with a canonical menu (role-aware), moves bookmarks
      and search from top bar into sidebar so the top sticky bar can
      be hidden via CSS.
  ------------------------------------------------------------
-->

<script>
(function(){if(!document.querySelector('body.path-my .ep-dash'))return;var _hdrEl=document.querySelector('header.master-header')||document.querySelector('header');function _updHdr(){if(!_hdrEl)return;var b=Math.max(0,_hdrEl.getBoundingClientRect().bottom);document.documentElement.style.setProperty('--ep-dash-header-h',b+'px');}window.addEventListener('scroll',_updHdr,{passive:true});window.addEventListener('resize',_updHdr,{passive:true});_updHdr();var hour=new Date().getHours();var greeting=hour<12?'Good morning':(hour<18?'Good afternoon':'Good evening');var greetingEl=document.querySelector('.ep-dash [data-ep-greeting]');if(greetingEl)greetingEl.textContent=greeting;var firstName=null;try{if(window.M&&M.cfg&&M.cfg.user&&M.cfg.user.fullname){firstName=String(M.cfg.user.fullname).split(' ')[0];}}catch(e){}if(!firstName){var sources=['.tool-login .sr-only','.usermenu .usertext','.userbutton .usertext','[data-fullname]','.navbar .username','.header-actions .userpic[title]'];for(var i=0;i<sources.length;i++){var el=document.querySelector(sources[i]);if(!el)continue;var nm=(el.getAttribute('data-fullname')||el.getAttribute('title')||el.textContent||'').trim();if(nm){firstName=nm.split(' ')[0];break;}}}if(!firstName){var av=document.querySelector('.navbar img.userpicture, .header-actions .userpic img');if(av&&av.alt)firstName=av.alt.replace(/^Picture of /i,'').trim().split(' ')[0];}var firstNameEl=document.querySelector('.ep-dash [data-ep-firstname]');if(firstName&&firstNameEl)firstNameEl.textContent=firstName;var heroList=document.querySelector('.ep-dash [data-ep-recent-list]');var emptyHtml='<li class="ep-dash__hero-recent-empty-li"><p class="ep-dash__hero-recent-empty">Nothing here yet. <a href="https://learn.moodle.rrev-engine.com/course/index.php">Browse the catalog &rarr;</a></p></li>';function escHtml(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}function harvest(nb){var links=nb.querySelectorAll('a[href*="/course/view.php"]');var seen={},items=[];for(var j=0;j<links.length&&items.length<4;j++){var a=links[j];if(seen[a.href])continue;seen[a.href]=1;var te=a.querySelector('.card-img > .sr-only, .coursename, .course-name, .multiline, [class*="coursename"]');var title=(te?te.textContent:(a.getAttribute('aria-label')||a.textContent))||'';title=title.replace(/\s+(course is starred|starred course|starred|hidden|removed from favourites?|is favourited)\.?$/i,'').replace(/\s+/g,' ').trim();if(title)items.push({href:a.href,title:title});}return items;}function render(items){heroList.innerHTML=items.map(function(item){return '<li class="ep-dash__hero-recent-item"><a href="'+escHtml(item.href)+'"><span class="ep-dash__hero-recent-title">'+escHtml(item.title)+'</span><span class="ep-dash__hero-recent-arrow" aria-hidden="true">&rarr;</span></a></li>';}).join('');}if(heroList){var nativeBlock=document.querySelector('section.block_recentlyaccessedcourses');if(!nativeBlock){heroList.innerHTML=emptyHtml;}else{var existing=harvest(nativeBlock);if(existing.length){render(existing);}else{var settled=false;var observer=new MutationObserver(function(){var f=harvest(nativeBlock);if(f.length&&!settled){settled=true;observer.disconnect();render(f);}});observer.observe(nativeBlock,{childList:true,subtree:true});setTimeout(function(){if(settled)return;settled=true;observer.disconnect();var f=harvest(nativeBlock);if(f.length)render(f);else heroList.innerHTML=emptyHtml;},6000);}}}fetch('https://engine.maine.gov/course-widget',{credentials:'omit'}).then(function(r){return r.ok?r.json():null;}).then(function(data){if(!data||!data.courses)return;var counts={};data.courses.forEach(function(c){var id=String(c.category_id);counts[id]=(counts[id]||0)+1;});document.querySelectorAll('.ep-dash__tile[href*="categoryid="]').forEach(function(tile){var m=tile.getAttribute('href').match(/categoryid=(\d+)/);if(!m)return;var pill=tile.querySelector('.ep-dash__tile-count');if(pill)pill.textContent=counts[m[1]]||0;});}).catch(function(){});})();
(function(){var ql=document.querySelector('.tgsdb-quicklinks');if(!ql)return;var b=document.body;var isAdmin=b.classList.contains('isadmin');var isManager=b.classList.contains('roleshortname-manager');var isPower=isAdmin||isManager;var origin=location.origin;var canonical=[{cls:'item-enginehome',label:'EnGiNE Home',href:'https://engine.maine.gov',icon:'ri-home-line',ext:true},{cls:'item-dashboard',label:'Dashboard',href:origin+'/my/',icon:'ri-dashboard-line'},{cls:'item-mycourses',label:'My courses',href:origin+'/my/courses.php',icon:'ri-graduation-cap-line'},{cls:'item-courses',label:'All courses',href:origin+'/course/',icon:'ri-book-2-line'}];function mkLi(it){var ext=it.ext?' target="_blank" rel="noopener"':'';return '<li class="'+it.cls+' ep-canonical"><a class="item-link position-relative d-flex flex-column justify-content-center" href="'+it.href+'"'+ext+'><i class="'+it.icon+'" aria-hidden="true"></i><span class="text">'+it.label+'</span></a></li>';}if(isPower){canonical.slice().reverse().forEach(function(it){var existing=ql.querySelector('.'+it.cls);if(existing){existing.classList.add('ep-canonical');ql.insertBefore(existing,ql.firstChild);}else{var tmp=document.createElement('div');tmp.innerHTML=mkLi(it);ql.insertBefore(tmp.firstChild,ql.firstChild);}});var sh=ql.querySelector('.item-frontpage');if(sh)sh.style.display='none';}else{ql.innerHTML=canonical.map(mkLi).join('');}var bm=document.querySelector('.bookmarks-item');if(bm){bm.classList.add('ep-sidebar-bookmarks');var trig=bm.querySelector('.mb2mm-action');if(trig&&!trig.querySelector('i.ri-bookmark-line')){var bIc=document.createElement('i');bIc.className='ri-bookmark-line';bIc.setAttribute('aria-hidden','true');trig.insertBefore(bIc,trig.firstChild);}ql.appendChild(bm);var dd=bm.querySelector('.theme-bookmarks');if(dd&&trig){function epBmPos(){var r=trig.getBoundingClientRect();dd.style.top=r.top+'px';dd.style.left=(r.right+4)+'px';}bm.addEventListener('mouseenter',epBmPos);trig.addEventListener('focus',epBmPos);trig.addEventListener('click',function(e){e.preventDefault();bm.classList.toggle('show');if(bm.classList.contains('show'))epBmPos();});document.addEventListener('click',function(e){if(!bm.contains(e.target))bm.classList.remove('show');});window.addEventListener('scroll',function(){if(bm.matches(':hover')||bm.classList.contains('show'))epBmPos();},{passive:true});}}var sb=document.querySelector('.header-tools-link.tool-search');if(sb){var sli=document.createElement('li');sli.className='item-search-canon ep-sidebar-search';sb.classList.add('ep-sidebar-search-btn');if(!sb.querySelector('i.ep-sidebar-search-icon')){var sIc=document.createElement('i');sIc.className='ri-search-line ep-sidebar-search-icon';sIc.setAttribute('aria-hidden','true');sb.insertBefore(sIc,sb.firstChild);}sli.appendChild(sb);ql.appendChild(sli);}var role='';if(isAdmin||isManager)role='Admin';else if(b.classList.contains('roleshortname-coursecreator'))role='Course Creator';else if(b.classList.contains('roleshortname-medoeemployee'))role='Maine DOE Staff';else if(b.classList.contains('roleshortname-engine_educator'))role='Educator';else if(b.classList.contains('roleshortname-communitymember'))role='Community Member';else if(b.classList.contains('roleshortname-nurse'))role='Nurse';if(role){var leftovers=Array.from(ql.children).filter(function(li){return !li.classList.contains('ep-canonical')&&!li.classList.contains('ep-sidebar-bookmarks')&&!li.classList.contains('ep-sidebar-search');});var divLi=document.createElement('li');divLi.className='ep-sidebar-rolelabel';divLi.innerHTML='<span class="ep-sidebar-rolelabel-text">'+role+'</span>';ql.appendChild(divLi);leftovers.forEach(function(li){ql.appendChild(li);});}var adminLinksUl=document.querySelector('.tgsdb-admin-links');if(adminLinksUl){Array.from(adminLinksUl.children).forEach(function(li){ql.appendChild(li);});}if(isPower){var adminEssentials=[{cls:'item-contentbank',label:'Content bank',href:origin+'/contentbank/index.php?contextid=1',icon:'ri-bank-line'},{cls:'item-managecoursesandcats',label:'Manage courses',href:origin+'/course/management.php',icon:'ri-folder-settings-line'}];adminEssentials.forEach(function(it){if(!ql.querySelector('.'+it.cls)){var tmp=document.createElement('div');tmp.innerHTML=mkLi(it);ql.appendChild(tmp.firstChild);}});var mc=ql.querySelector('.item-managecoursesandcats');var te=ql.querySelector('.item-turneditingcourse');if(mc&&te&&mc.previousElementSibling!==te){te.insertAdjacentElement('afterend',mc);}}ql.querySelectorAll('a .text, button .text, .mb2mm-label').forEach(function(t){if(t.textContent.trim()==='Course enrolment page'||t.textContent.trim()==='Course enrollment page'){t.textContent='Course Overview';}});var courseMatch=document.body.className.match(/course-(\d+)/);var courseId=courseMatch?courseMatch[1]:null;if(courseId&&courseId!=='1'){var hasOverview=false;ql.querySelectorAll('a .text, .mb2mm-label').forEach(function(t){var txt=t.textContent.trim();if(txt==='Course Overview'||txt==='Course enrolment page'||txt==='Course enrollment page')hasOverview=true;});if(!hasOverview){var tmp=document.createElement('div');tmp.innerHTML=mkLi({cls:'item-courseoverview',label:'Course Overview',href:origin+'/enrol/index.php?id='+courseId,icon:'ri-book-2-line'});var newItem=tmp.firstChild;var editSettings=ql.querySelector('.item-edit-course-settings, .item-coursesettings, .item-editcoursesettings');var contentBank=ql.querySelector('.item-contentbank');if(editSettings){editSettings.insertAdjacentElement('afterend',newItem);}else if(contentBank){contentBank.insertAdjacentElement('beforebegin',newItem);}else{ql.appendChild(newItem);}}}var curPath=location.pathname.replace(/\/$/,'');var curHref=location.origin+location.pathname.replace(/\/$/,'');document.querySelectorAll('.tgsdb-quicklinks > li, .tgsdb-admin-links > li').forEach(function(li){var a=li.querySelector('a[href]');if(!a)return;var h=a.getAttribute('href')||'';if(!h||h==='#')return;var aPath;try{aPath=new URL(h,location.origin).pathname.replace(/\/$/,'');}catch(e){return;}if(aPath===curPath&&aPath!==''){li.classList.add('ep-active');}});var hg=document.querySelector('.header-gap');if(hg){hg.style.display='none';hg.style.height='0';hg.style.minHeight='0';}document.querySelectorAll('section.block_myoverview .card-title, section.block_myoverview h3, section.block_myoverview h5, section.block_courseoverview .card-title, section.block_courseoverview h3, section.block_courseoverview h5').forEach(function(el){if(el.textContent.trim()==='Course overview')el.textContent='My Experiences';});})();
</script>
